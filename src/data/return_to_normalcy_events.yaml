schema:
  name: American Epochs Event Corpus
  version: 2
  date_format: YYYYMMDD
  level_definition:
    1: The epoch's "crown of the mountain" — always visible, at every zoom, from the very widest view. One beat
      per structural hinge in the epoch's own arc, not a list of "the important stuff." Target 5-8 entries regardless
      of how large or eventful the epoch was; see curation_guidance below. Automatically revealed first as the viewer
      zooms in from full history — never a manual toggle.
    2: Major events, automatically revealed at the first closer zoom past Level 1.
    3: Supporting events explaining mechanisms, shifts, and consequences.
    4: Contextual events — political, military, social, institutional texture.
    5: Fine-grained events for the closest inspection.
  curation_guidance:
  - Level 1 is the hardest and most important editorial call in the corpus. The viewer never chooses to see it —
    it is what everyone sees whether they zoom in or not, so it carries the whole epoch's argument on its own.
  - Pick one entry per point where the epoch's own arc genuinely turns, not one per famous name or battle. A working
    test - "does removing this entry break the causal chain from the epoch's start to its end?" If not, it belongs
    at Level 2 or below, however well-known it is.
  - Target 5-8 Level 1 point events specifically. This is deliberately independent of the epoch's total event count
    or length in years. Reconstruction intentionally carries nine point events because the Panic of 1873 and United
    States v. Cruikshank describe distinct political and judicial turns and the editor has approved a slightly crowded
    crown.
  - Span (duration) entries at Level 1 do not count against the point-event target because the live instrument never
    tier-filters spans; they provide scene-setting context.
  - Levels 2-5 have much more room to breathe. Disagreement there is a rounding error, not a structural problem.
    Spend the real editorial effort on Level 1.
  notes:
  - A missing end date indicates a point event.
  - Dates represent the most defensible public date for display, not necessarily every stage of a legal or political
    process.
  - date_precision (year or month) applies to start, and end_precision (month) to the end of a range. Where set, the
    placeholder in the date field must not be rendered as exact. Absent means a full day-level date. date_verified
    true means the date was confirmed against an identifiable source.
  - This corpus is a research/authoring artifact. A human or LLM reconciles it into the live EVENTS array.
  - Levels were assigned by Claude as a first-pass editorial judgment (see return_to_normalcy_outline.md for the Level 1
    reasoning). All dates are drafted from memory and none are yet source-verified, so verify before treating as
    settled. No source URLs are included, per the guide's rule against unverifiable citations. Figures to check first
    include the Great Migration's 1920s total (about 800,000), Italy's pre- and post-1924 quotas, and the market's
    losses after the Crash.
  - The great_depression span (1929-08-01 to 1933-03-31) replaces the year-level span already in the live instrument and
    deliberately crosses the epoch end of 1933-03-03, because the NBER trough falls in the New Deal's first month.
  - bonus_army is recorded as a range (1932-05-29 to 1932-07-28) but is under two years, so it reconciles as a point
    event at its end date. scopes_trial and depression_1920_21 follow the same rule.
  - Boundary decisions. The corpus opens on 1920-01-01, which takes in the January 1920 Palmer Raids that the New
    Freedom handed forward, and closes the day before Roosevelt's inauguration so that the election of 1932, the winter
    bank panics, and the Twentieth Amendment fall here. The Bonus Army is the closing Level 1 beat. Prohibition begins
    here and is repealed in the New Deal's first year.
epoch:
  id: return_to_normalcy
  title: Return to Normalcy
  start: 19200101
  end: 19330303
  thesis: After the New Freedom's war and its repudiation, the national government steps back. Harding, Coolidge, and
    Hoover cut taxes on the wealthy, raise tariffs, staff the regulatory agencies with friends of the industries they
    oversee, close the door on immigration, and decline to help farmers. The economy booms on automobiles, radio,
    installment credit, and a stock market bought on margin, while wealth concentrates and agriculture is in depression
    from 1920 onward. When the boom breaks in 1929 the same ideology refuses a counterweight, and by 1932 a quarter of
    the workforce is unemployed, the banks are failing, and the Army has driven its own veterans out of Washington.
events:
# ---------------------------------------------------------------- Level 1: span
- id: great_depression
  start: 19290801
  end: 19330331
  level: 1
  kind: economic_period
  title: Great Depression
  description_short: NBER dates the contraction August 1929 to March 1933, the longest on record.
  description_long: Industrial output falls by about half, roughly a quarter of the workforce is unemployed at the trough, and
    thousands of banks fail. The span deliberately crosses the epoch boundary of March 3, 1933, because the trough falls
    in the first month of the New Deal.
  why: It is the shared background of this epoch's last three years and the New Deal's opening weeks, the visible cost of an
    ideology with no counterweight.
  tags:
  - depression
  - unemployment
  - banking
# ---------------------------------------------------------------- Level 1: points
- id: harding_elected
  start: 19201102
  level: 1
  kind: election
  title: Harding Elected
  description_short: Warren Harding wins by the largest popular margin of the era on a promise of a "return to normalcy."
  description_long: Harding carries sixty percent of the vote and every state outside the South. His campaign phrase, coined
    in a May 1920 speech in Boston, names a retreat from Wilson's wartime state and its crusades.
  why: The country chooses a government that asks little of it, which gives the epoch its name and its first plank.
  tags:
  - election
  - normalcy
  - republicans
- id: immigration_act_1924
  start: 19240526
  level: 1
  kind: legislation
  title: Immigration Act of 1924
  description_short: Congress sets national-origin quotas on European immigration and bars Asian immigrants entirely.
  description_long: The law caps annual immigration at about 165,000, allots each nationality two percent of its 1890 U.S.
    population, and requires visas issued abroad. The 1890 base predates the large Southern and Eastern European wave, so
    Italy's yearly quota falls from about 42,000 to under 4,000. The Western Hemisphere is exempt, and the Border Patrol
    is founded days later.
  why: It is the epoch's clearest answer to who is left outside. The state steps back from the economy and advances on
    membership, ranking peoples by ancestry and leaving no category for flight from persecution.
  tags:
  - immigration
  - quotas
  - nativism
- id: business_of_america
  start: 19250117
  level: 1
  kind: speech
  title: "The Business of America Is Business"
  description_short: Coolidge tells newspaper editors that "the chief business of the American people is business."
  description_long: The speech to the American Society of Newspaper Editors is often quoted in compressed form. It expresses
    a governing philosophy in which public policy serves commerce and the economy governs itself.
  why: It is the ideology stated by the president who embodies it, the claim the whole epoch tests.
  tags:
  - coolidge
  - business
  - ideology
- id: mcnary_haugen_veto
  start: 19270225
  level: 1
  kind: political_event
  title: Coolidge Vetoes McNary–Haugen
  description_short: Coolidge vetoes a bill to support farm prices, and vetoes it again in 1928.
  description_long: The bill would have had the government buy surplus crops and sell them abroad. Farm prices had collapsed
    after the war and never recovered, leaving the rural economy in a depression through the boom years.
  why: It is the first clear sign that normalcy had losers and that the state would not intervene for them.
  tags:
  - agriculture
  - veto
  - coolidge
- id: hoover_elected
  start: 19281106
  level: 1
  kind: election
  title: Hoover Elected
  description_short: Herbert Hoover wins in a landslide after promising the final triumph over poverty.
  description_long: In his August 1928 acceptance speech Hoover says the country is "nearer to the final triumph over
    poverty than ever before in the history of any land." He carries forty states, including parts of the South.
  why: It is normalcy at its peak and its irony, a mandate for the system eleven months before it breaks.
  tags:
  - election
  - hoover
  - prosperity
- id: stock_market_crash
  start: 19291029
  level: 1
  kind: economic_crisis
  title: Stock Market Crash
  description_short: Share prices collapse on Black Tuesday, wiping out billions after the Black Thursday panic.
  description_long: The market peaked on September 3, 1929, and the selling accelerates from October 24. By mid-November
    the Dow has lost nearly half of its September peak, and by 1932 close to 90 percent.
  why: The boom breaks, and the same ideology that inflated it has no answer.
  tags:
  - crash
  - stocks
  - speculation
- id: smoot_hawley_tariff
  start: 19300617
  level: 1
  kind: legislation
  title: Smoot–Hawley Tariff
  description_short: Hoover signs the highest tariff in history over the objections of over a thousand economists.
  description_long: The act raises duties on thousands of imports, and other countries retaliate. World trade shrinks
    sharply in the years that follow.
  why: It is the ideology's response to the crisis, and it deepens it, the clearest case of the absence of a counterweight.
  tags:
  - tariff
  - trade
  - hoover
- id: bonus_army
  start: 19320529
  end: 19320728
  level: 1
  kind: protest
  title: Bonus Army
  description_short: The Army clears thousands of World War I veterans from Washington with tear gas and bayonets.
  description_long: About 17,000 veterans and their families camp in Washington to demand early payment of their service
    bonus. After the Senate rejects the bill, Hoover orders the camps cleared on July 28, and Douglas MacArthur leads
    troops against them.
  why: The decade's idea of normalcy ends with the state's force turned on its own veterans, and it ends the epoch.
  tags:
  - veterans
  - protest
  - hoover
# ---------------------------------------------------------------- Level 2
- id: prohibition_begins
  start: 19200117
  level: 2
  kind: policy
  title: Prohibition Begins
  description_short: The Eighteenth Amendment takes effect, banning the manufacture and sale of alcohol.
  description_long: The Volstead Act's enforcement is underfunded and unevenly applied, and the ban creates a large illegal
    market. It is repealed in December 1933.
  why: It is the decade's most famous policy and an example of the state governing private life while leaving the economy alone.
  tags:
  - prohibition
  - enforcement
  - crime
- id: nineteenth_amendment_ratified
  start: 19200818
  level: 2
  kind: constitutional_amendment
  title: Nineteenth Amendment Ratified
  description_short: Tennessee becomes the thirty-sixth state to ratify woman suffrage.
  description_long: The state's legislature approves it by a single vote, and the amendment is certified on August 26.
  why: It answers who participates in the affirmative, even as the decade closes other doors.
  tags:
  - suffrage
  - women
  - constitution
- id: tulsa_massacre
  start: 19210531
  level: 2
  kind: violence
  title: Tulsa Race Massacre
  description_short: A white mob destroys the Greenwood district, Tulsa's prosperous Black neighborhood, killing dozens or more.
  description_long: Over about eighteen hours, mobs burn about 35 blocks and leave thousands homeless. No one is convicted, and
    the event is largely left out of public memory for decades.
  why: It shows what exclusion looked like in practice, and the state's refusal to protect Black prosperity.
  tags:
  - race
  - violence
  - oklahoma
- id: revenue_act_1921
  start: 19211123
  level: 2
  kind: legislation
  title: Revenue Act of 1921
  description_short: Congress cuts the top income tax rate and repeals the wartime excess-profits tax.
  description_long: Treasury Secretary Andrew Mellon's tax policy cuts rates further in 1924 and 1926. Over the decade the top
    rate falls from 73 percent to 25 percent.
  why: It rolls back the Sixteenth Amendment's fiscal state at the top, and tilts the boom toward concentrated wealth.
  tags:
  - taxes
  - mellon
  - wealth
- id: fordney_mccumber_tariff
  start: 19220921
  level: 2
  kind: legislation
  title: Fordney–McCumber Tariff
  description_short: Congress raises tariffs sharply, reversing the Wilson-era reductions.
  description_long: The act protects American industry and agriculture, and it contributes to Europe's difficulty repaying its war
    debts.
  why: It is the decade's first move toward protection, preparing the way for Smoot–Hawley.
  tags:
  - tariff
  - trade
  - congress
- id: teapot_dome_hearings
  start: 19231022
  level: 2
  kind: scandal
  title: Teapot Dome Scandal
  description_short: Senate hearings expose Interior Secretary Albert Fall's secret oil leases in exchange for cash and loans.
  description_long: Fall had leased the Teapot Dome naval oil reserve in Wyoming to a private company in 1922. He is later
    convicted of bribery, the first cabinet officer jailed for his conduct in office.
  why: It is the era's emblem of government for sale, though voters did not punish it.
  tags:
  - corruption
  - oil
  - harding
- id: harding_dies
  start: 19230802
  level: 2
  kind: political_event
  title: Harding Dies in Office
  description_short: Harding dies in San Francisco, and Calvin Coolidge becomes president.
  description_long: Harding's death arrives just before the full scale of the scandals reaches the public. Coolidge's
    reputation for honesty insulates the administration.
  why: It brings the president who embodies the epoch's ideology to power.
  tags:
  - harding
  - coolidge
  - succession
- id: scopes_trial
  start: 19250710
  end: 19250721
  level: 2
  kind: court_case
  title: Scopes Trial
  description_short: A Tennessee teacher is convicted of teaching evolution in a nationally covered trial.
  description_long: Clarence Darrow cross-examines William Jennings Bryan on the Bible. Scopes is fined $100, and the
    conviction is later overturned on a technicality.
  why: It stages the decade's fight between the new America and the old in a courtroom.
  tags:
  - evolution
  - culture-war
  - tennessee
- id: great_migration_surges
  start: 19240101
  level: 2
  kind: migration
  title: Great Migration Surges
  description_short: About 800,000 Black Southerners move north during the 1920s as the quotas cut off European labor.
  description_long: The war cut European immigration to a trickle, and the 1921 and 1924 laws kept it low. Northern factories and
    stockyards recruit Black workers, who are drawn by wages several times Southern pay and pushed by the boll weevil, floods, and
    lynching. Date is year-level (1924).
  why: It is the labor consequence of the immigration laws and the largest internal movement of the era.
  tags:
  - migration
  - race
  - labor
  date_precision: year
- id: sacco_vanzetti_executed
  start: 19270823
  level: 2
  kind: legal
  title: Sacco and Vanzetti Executed
  description_short: Two Italian anarchist immigrants are executed in Massachusetts after a trial widely seen as unfair.
  description_long: Their 1921 conviction for a robbery and murder rested on thin evidence, and the case becomes an international
    cause. Massachusetts formally exonerates them in 1977.
  why: It shows the fusion of nativism and the Red Scare, and what the state did to the people the quotas would later keep out.
  tags:
  - immigration
  - anarchism
  - justice
- id: rfc_created
  start: 19320122
  level: 2
  kind: institution
  title: Reconstruction Finance Corporation
  description_short: Congress creates a federal lender to rescue banks and railroads, Hoover's first major break with voluntarism.
  description_long: The agency lends billions to banks and businesses but not to individuals or states in its first months. It
    becomes a workhorse of the New Deal.
  why: It is the first sign that the ideology was retreating, three years after the crash and too late.
  tags:
  - banking
  - hoover
  - relief
- id: election_1932
  start: 19321108
  level: 2
  kind: election
  title: Roosevelt Elected
  description_short: Franklin Roosevelt defeats Hoover in a landslide, carrying 42 of 48 states.
  description_long: Hoover wins only six states. The country repudiates the ideology of the decade but does not yet know what
    will replace it.
  why: It is the repudiation of normalcy, and the first beat of the next epoch's story.
  tags:
  - election
  - roosevelt
  - realignment
# ---------------------------------------------------------------- Level 3
- id: normalcy_speech
  start: 19200514
  level: 3
  kind: speech
  title: Harding's "Normalcy" Speech
  description_short: Harding calls for "not heroism but healing, not nostrums but normalcy" in a Boston speech.
  description_long: The word "normalcy" was considered a mistake by critics, but became the campaign's slogan.
  why: It gives the epoch its name.
  tags:
  - harding
  - speech
  - normalcy
- id: palmer_raids_january_1920
  start: 19200102
  level: 3
  kind: violence
  title: Palmer Raids Peak
  description_short: The Justice Department arrests thousands of suspected radicals in over thirty cities in one night.
  description_long: The raids follow the November 1919 wave, and about 500 people are deported. Public opinion turns against
    Palmer by spring.
  why: It is the end of the wartime repression, closing the New Freedom's Red Scare as this epoch begins.
  tags:
  - red-scare
  - deportation
  - civil-liberties
- id: emergency_quota_act
  start: 19210519
  level: 3
  kind: legislation
  title: Emergency Quota Act
  description_short: Congress limits immigration to three percent of each nationality's 1910 U.S. population.
  description_long: The first numerical limits on European immigration cut arrivals from about 800,000 to about 300,000 a
    year.
  why: It is the first step in the immigration thread, setting the principle the 1924 act extends.
  tags:
  - immigration
  - quotas
  - nativism
- id: depression_1920_21
  start: 19200101
  end: 19210731
  end_precision: month
  level: 3
  kind: economic_crisis
  title: Postwar Depression of 1920–21
  description_short: A sharp recession cuts output and sends unemployment above eleven percent.
  description_long: Prices fall by about a third, and farm incomes collapse. The government does little, and the economy
    recovers within about eighteen months.
  why: It is the first test of the hands-off approach, which appears to pass and so reinforces it.
  tags:
  - depression
  - recession
  - farm-crisis
- id: coolidge_elected_1924
  start: 19241104
  level: 3
  kind: election
  title: Coolidge Elected
  description_short: Coolidge wins a full term, and Robert La Follette's Progressive ticket gets 17 percent.
  description_long: The campaign slogan is "Keep Cool with Coolidge." La Follette's showing is the strongest third-party
    result since 1912.
  why: It confirms the mandate for normalcy, and measures the size of the dissent.
  tags:
  - election
  - coolidge
  - progressives
- id: indian_citizenship_act
  start: 19240602
  level: 3
  kind: legislation
  title: Indian Citizenship Act
  description_short: Congress grants citizenship to all Native Americans born in the United States.
  description_long: Many states continue to deny Native people the vote for decades.
  why: It is a rare expansion of membership in a decade of closures.
  tags:
  - native-americans
  - citizenship
  - voting
- id: border_patrol_created
  start: 19240528
  level: 3
  kind: institution
  title: Border Patrol Created
  description_short: Congress creates the U.S. Border Patrol two days after passing the Immigration Act.
  description_long: The force starts with about 450 officers and is charged with preventing unlawful entry along the Canadian and
    Mexican borders.
  why: It builds the enforcement apparatus for the quota system, and makes "illegal" entry a category.
  tags:
  - immigration
  - enforcement
  - border
- id: klan_march_washington
  start: 19250808
  level: 3
  kind: protest
  title: Klan March on Washington
  description_short: About 30,000 robed Klansmen march down Pennsylvania Avenue.
  description_long: The Klan, which had about four million members at its mid-1920s peak, sinks quickly afterward amid scandals.
  why: It shows the public power of the exclusion movement at its height.
  tags:
  - klan
  - race
  - nativism
- id: harlem_renaissance
  start: 19250101
  level: 3
  kind: cultural
  title: The New Negro and the Harlem Renaissance
  description_short: Alain Locke's anthology The New Negro announces a flowering of Black art and writing in Harlem.
  description_long: Langston Hughes, Zora Neale Hurston, Duke Ellington, and others emerge from the community the Great
    Migration created. Date is year-level (1925).
  why: It is the cultural result of the migration and a new self-definition of Black America.
  tags:
  - culture
  - race
  - harlem
  date_precision: year
- id: lindbergh_flight
  start: 19270521
  level: 3
  kind: cultural
  title: Lindbergh Flies the Atlantic
  description_short: Charles Lindbergh lands in Paris after the first solo nonstop transatlantic flight.
  description_long: He becomes the decade's greatest hero, and the flight symbolizes its faith in technology and individual
    achievement.
  why: It is the epoch's emblem of confidence, in the individual and in technology.
  tags:
  - aviation
  - celebrity
  - technology
- id: mississippi_flood
  start: 19270401
  level: 3
  kind: disaster
  title: Great Mississippi Flood
  description_short: The river breaks its levees, flooding 27,000 square miles and displacing hundreds of thousands, mostly Black.
  description_long: Hoover's relief work makes his national reputation, but Black refugees are held in camps and forced to
    work. The flood accelerates the Great Migration and weakens Southern Black loyalty to the Republican Party. Date is
    month-level (April 1927).
  why: It builds Hoover's reputation and exposes the racial order's treatment of Black victims.
  tags:
  - disaster
  - hoover
  - race
  date_precision: month
- id: hoover_poverty_speech
  start: 19280811
  level: 3
  kind: speech
  title: Hoover's "Final Triumph Over Poverty" Speech
  description_short: Hoover accepts the Republican nomination and claims the nation is nearing the end of poverty.
  description_long: He delivers the speech at Stanford. It later becomes a symbol of the ideology's overconfidence.
  why: It is the peak of the decade's confidence in its own system.
  tags:
  - hoover
  - prosperity
  - speech
- id: black_thursday
  start: 19291024
  level: 3
  kind: economic_crisis
  title: Black Thursday
  description_short: Stock prices plunge on huge trading volume, and a bankers' pool tries to prop up the market.
  description_long: A group of Wall Street banks, including J.P. Morgan's, buys shares to steady the market, with only brief
    success.
  why: It is the first day of the crash, and the first sign that private rescue would not work.
  tags:
  - crash
  - stocks
  - bankers
- id: bank_of_united_states_fails
  start: 19301211
  level: 3
  kind: economic_crisis
  title: Bank of United States Fails
  description_short: A New York bank with 400,000 depositors, mostly immigrants and Jews, collapses.
  description_long: The largest bank failure of its kind to that date starts a wave of bank panics. The Fed does not intervene.
  why: It shows the banking system failing with no federal response.
  tags:
  - banking
  - failure
  - fed
- id: hoover_moratorium
  start: 19310620
  level: 3
  kind: foreign_policy
  title: Hoover Moratorium
  description_short: Hoover proposes a one-year pause on war debt and reparations payments.
  description_long: The moratorium comes too late to stop the European banking crisis, and Britain leaves the gold standard
    in September.
  why: It is Hoover's international attempt to stem the crisis, and it fails.
  tags:
  - war-debts
  - hoover
  - gold-standard
- id: glass_steagall_1932
  start: 19320227
  level: 3
  kind: legislation
  title: Glass–Steagall Act of 1932
  description_short: Congress widens the Fed's ability to lend against government securities and ease credit.
  description_long: The act is a limited emergency measure that is followed by the more famous Banking Act of 1933.
  why: It shows the first legislative retreat from the hands-off approach.
  tags:
  - banking
  - fed
  - credit
- id: norris_laguardia_act
  start: 19320323
  level: 3
  kind: legislation
  title: Norris–LaGuardia Act
  description_short: Congress bars federal injunctions against peaceful strikes and bans yellow-dog contracts.
  description_long: The law reverses the labor injunction that began with In re Debs in 1895.
  why: It undoes the Gilded Age's central labor weapon, a sign of the repudiation to come.
  tags:
  - labor
  - injunction
  - congress
- id: bank_holidays_1933
  start: 19330214
  level: 3
  kind: economic_crisis
  title: Bank Holidays Begin
  description_short: Michigan closes all banks, starting a cascade of state bank holidays.
  description_long: By inauguration day most states have closed their banks or restricted withdrawals.
  why: It is the system's nadir, the country at a standstill as the epoch ends.
  tags:
  - banking
  - panic
  - michigan
# ---------------------------------------------------------------- Level 4
- id: wall_street_bombing
  start: 19200916
  level: 4
  kind: violence
  title: Wall Street Bombing
  description_short: A bomb on Wall Street kills 38 people and wounds hundreds, and the perpetrators are never found.
  description_long: The explosion occurs outside J.P. Morgan's offices and is blamed on anarchists.
  why: It is the Red Scare's last major event and feeds fear of foreign radicals.
  tags:
  - bombing
  - anarchism
  - red-scare
- id: kdka_first_broadcast
  start: 19201102
  level: 4
  kind: technology
  title: KDKA Broadcasts Election Returns
  description_short: Pittsburgh's KDKA airs the first scheduled commercial radio broadcast, reporting the Harding result.
  description_long: Radio spreads to millions of homes within a few years.
  why: It begins the mass media that unifies the decade's culture.
  tags:
  - radio
  - media
  - technology
- id: garvey_unia_convention
  start: 19200801
  level: 4
  kind: organization
  title: Garvey's UNIA Convention
  description_short: Marcus Garvey's Universal Negro Improvement Association holds a mass convention in New York.
  description_long: The movement of Black pride and economic independence reaches millions at its peak. Date is month-level
    (August 1920).
  why: It is the largest mass Black movement of the era, a response to exclusion that looks inward.
  tags:
  - race
  - garvey
  - pride
  date_precision: month
- id: budget_and_accounting_act
  start: 19210610
  level: 4
  kind: legislation
  title: Budget and Accounting Act
  description_short: Congress creates the Bureau of the Budget and requires the president to submit an annual budget.
  description_long: The act centralizes federal budgeting in the executive, an administrative step in a decade of small
    government.
  why: It shows the state's capacity growing even as its ambitions shrink.
  tags:
  - budget
  - executive
  - bureaucracy
- id: sacco_vanzetti_convicted
  start: 19210714
  level: 4
  kind: legal
  title: Sacco and Vanzetti Convicted
  description_short: A Massachusetts jury convicts the two Italian anarchists of murder.
  description_long: The trial, held in the shadow of the Red Scare, features open prejudice against immigrants and radicals.
  why: It begins the case that defines the decade's nativism and Red Scare.
  tags:
  - immigration
  - anarchism
  - justice
- id: washington_naval_conference
  start: 19211112
  level: 4
  kind: diplomacy
  title: Washington Naval Conference
  description_short: The major powers agree to limit battleship tonnage in a landmark arms-control treaty.
  description_long: The conference concludes in February 1922 with the Five-Power Treaty. The agreement holds through the decade.
  why: It shows the retreat from Wilson's internationalism taking the form of limited, practical agreements.
  tags:
  - navy
  - treaty
  - arms-control
- id: debs_freed
  start: 19211225
  level: 4
