schema:
  name: American Epochs Event Corpus
  version: 2
  date_format: YYYYMMDD
  level_definition:
    1: The epoch's "crown of the mountain" — always visible, at every zoom, from the very widest view. One beat
      per structural hinge in the epoch's own arc, not a list of "the important stuff." Target 5-8 entries regardless
      of how large or eventful the epoch was; see curation_guidance below. Automatically revealed first as the viewer
      zooms in from full history — never a manual toggle.
    2: Major events, automatically revealed at the first closer zoom past Level 1.
    3: Supporting events explaining mechanisms, shifts, and consequences.
    4: Contextual events — political, military, social, institutional texture.
    5: Fine-grained events for the closest inspection.
  curation_guidance:
  - Level 1 is the hardest and most important editorial call in the corpus. The viewer never chooses to see it —
    it is what everyone sees whether they zoom in or not, so it carries the whole epoch's argument on its own.
  - Pick one entry per point where the epoch's own arc genuinely turns, not one per famous name or battle. A working
    test - "does removing this entry break the causal chain from the epoch's start to its end?" If not, it belongs
    at Level 2 or below, however well-known it is.
  - Target 5-8 Level 1 point events specifically. This is deliberately independent of the epoch's total event count
    or length in years. Reconstruction intentionally carries nine point events because the Panic of 1873 and United
    States v. Cruikshank describe distinct political and judicial turns and the editor has approved a slightly crowded
    crown.
  - Span (duration) entries at Level 1 do not count against the point-event target because the live instrument never
    tier-filters spans; they provide scene-setting context.
  - Levels 2-5 have much more room to breathe. Disagreement there is a rounding error, not a structural problem.
    Spend the real editorial effort on Level 1.
  notes:
  - A missing end date indicates a point event.
  - Dates represent the most defensible public date for display, not necessarily every stage of a legal or political
    process.
  - date_precision (year or month) applies to start, and end_precision (month) to the end of a range. Where set, the
    placeholder in the date field must not be rendered as exact. Absent means a full day-level date. date_verified
    true means the date was confirmed against an identifiable source.
  - This corpus is a research/authoring artifact. A human or LLM reconciles it into the live EVENTS array.
  - Levels were assigned by Claude as a first-pass editorial judgment (see affluent_society_outline.md for the Level 1
    reasoning). All dates are drafted from memory and none are yet source-verified, so verify before treating as
    settled. No source URLs are included, per the guide's rule against unverifiable citations. Figures to check first
    include the Interstate system's size and cost, Watts casualty counts, March on Washington attendance, and Vietnam
    casualty totals.
  - vietnam_war (1964-08-07 to 1975-04-30) is a cross-epoch span owned by this corpus because it begins here. It crosses
    the epoch end by about nine years. The Unravelling corpus must carry its end events, the Paris Peace Accords and the
    Fall of Saigon. The span runs from authorization to collapse. The alternative conventions (U.S. combat years 1965 to
    1973, or the Pentagon's 1955 to 1975) were considered and rejected in the outline.
  - cuban_missile_crisis, montgomery_bus_boycott, birmingham_campaign, watts_riot, and the Selma march are recorded with
    true ranges but are under two years, so they reconcile as point events at their end dates.
  - Watts stays at Level 2 and the Time "We Are All Keynesians Now" cover (the last day of the epoch) is Level 4.
  - Boundary decisions. The corpus opens on 1953-01-01 and closes on 1965-12-31. Eisenhower's election is the
    Ascendancy's closing beat, and the Social Security expansion and Interstate Highway Act here carry the ratification
    signal. Hart-Celler (October 1965) ends the national-origins system the 1924 act built, and closes the immigration
    thread's arc inside this epoch.
epoch:
  id: affluent_society
  title: The Affluent Society
  start: 19530101
  end: 19651231
  thesis: The Ascendancy's victory is consolidated at home. Eisenhower, a Republican, leaves Social Security and the regulatory
    state intact, expands both, and builds the Interstate Highway System, while wages rise with productivity and the GI Bill and
    suburban housing build a mass middle class. The Cold War turns inward with Sputnik and the missile crisis, and the
    settlement's second clause, who stands inside it, becomes the decade's defining struggle. Brown, Montgomery, Little Rock, the
    sit-ins, Birmingham, and Selma force the government to extend its terms, and the Civil Rights Act and the Voting Rights Act
    are their result. Kennedy's assassination makes room for Johnson's Great Society, Medicare and Medicaid, and a war in
    Vietnam that arrives as the consensus peaks.
events:
# ---------------------------------------------------------------- Level 1: span
- id: vietnam_war
  start: 19640807
  end: 19750430
  level: 1
  kind: war
  title: Vietnam War
  description_short: The American war in Vietnam, from the Gulf of Tonkin Resolution to the Fall of Saigon.
  description_long: The span runs from Congress's authorization on August 7, 1964 to the fall of South Vietnam's capital on April 30,
    1975. About 58,000 Americans and millions of Vietnamese die. It is owned by this corpus because it begins here, and it crosses
    the epoch end by nine years. The Unravelling corpus must carry its end events, the Paris Peace Accords and the Fall of Saigon.
  why: It is the war that the Great Society's consensus could not carry, authorized at its height and lost at its end.
  tags:
  - vietnam
  - war
  - cold-war
# ---------------------------------------------------------------- Level 1: points
- id: brown_v_board
  start: 19540517
  level: 1
  kind: court_case
  title: Brown v. Board of Education
  description_short: The Supreme Court unanimously rules that racial segregation in public schools is unconstitutional.
  description_long: Chief Justice Earl Warren writes that separate educational facilities are inherently unequal. The decision
    overturns Plessy for public education, and the Court's order to desegregate "with all deliberate speed" follows a year later.
  why: It makes the question's second clause, who stands inside the settlement, the epoch's defining struggle.
  tags:
  - segregation
  - supreme-court
  - education
- id: interstate_highway_act
  start: 19560629
  level: 1
  kind: legislation
  title: Interstate Highway Act
  description_short: Congress authorizes a 41,000-mile highway system, the largest public works program in American history.
  description_long: Eisenhower, a Republican who had seen Germany's autobahns, signs the $25 billion program funded by a gas tax. The
    system reshapes cities, suburbs, and trucking, and reinforces the car-based economy.
  why: It is the opposition party building on the New Deal state, and gives the affluent society its physical form.
  tags:
  - highways
  - infrastructure
  - eisenhower
- id: sputnik
  start: 19571004
  level: 1
  kind: technology
  title: Sputnik
  description_short: The Soviet Union launches the first artificial satellite, and Americans fear they are falling behind.
  description_long: The launch triggers a national debate over schools and science, and leads to NASA and the National Defense
    Education Act. A second, heavier satellite carrying a dog follows a month later.
  why: It turns the Cold War inward and breaks the era's complacency, bringing federal money to science and schools.
  tags:
  - space-race
  - science
  - education
- id: kennedy_elected
  start: 19601108
  level: 1
  kind: election
  title: Kennedy Elected
  description_short: John F. Kennedy narrowly defeats Richard Nixon, becoming the youngest elected president and the first Catholic.
  description_long: The margin is about 112,000 votes. The televised debates, in which Kennedy looks poised and Nixon ill at ease,
    are widely credited with helping him.
  why: It is a generational turn that promises more of the settlement's terms, won on television by a hair.
  tags:
  - election
  - kennedy
  - television
- id: cuban_missile_crisis
  start: 19621016
  end: 19621028
  level: 1
  kind: crisis
  title: Cuban Missile Crisis
  description_short: Thirteen days of confrontation over Soviet missiles in Cuba bring the superpowers to the edge of nuclear war.
  description_long: Kennedy imposes a naval quarantine, and Khrushchev agrees on October 28 to remove the missiles in exchange for
    a public pledge not to invade Cuba and a secret promise to remove American missiles from Turkey.
  why: It is the Cold War's closest approach to catastrophe, and the era's second great anxiety.
  tags:
  - cuba
  - nuclear
  - kennedy
- id: kennedy_assassinated
  start: 19631122
  level: 1
  kind: political_event
  title: Kennedy Assassinated
  description_short: President Kennedy is shot in Dallas, and Lyndon Johnson takes the oath on Air Force One.
  description_long: The killing is watched by the country on television for four days. Johnson tells Congress that the best tribute to
    Kennedy would be the civil rights bill.
  why: It is the shock that makes room for the Great Society.
  tags:
  - assassination
  - kennedy
  - johnson
- id: civil_rights_act_1964
  start: 19640702
  level: 1
  kind: legislation
  title: Civil Rights Act of 1964
  description_short: Congress outlaws discrimination in public accommodations, employment, and federally funded programs.
  description_long: The act ends legal segregation in hotels, restaurants, and public places and bans employment discrimination
    by race, sex, and religion. It passes after a Senate filibuster by Southern Democrats that lasts for more than fifty days.
  why: It extends the settlement's terms in law, the largest civil rights statute since Reconstruction.
  tags:
  - civil-rights
  - legislation
  - johnson
- id: voting_rights_act
  start: 19650806
  level: 1
  kind: legislation
  title: Voting Rights Act
  description_short: Congress bans literacy tests and other devices that deny Black citizens the vote, and authorizes federal oversight.
  description_long: The act follows the violence in Selma and sends federal examiners into Southern counties. Black voter registration
    in the South rises sharply within a few years.
  why: It is the legislative apex of the consensus, the Fifteenth Amendment finally enforced.
  tags:
  - voting-rights
  - civil-rights
  - johnson
# ---------------------------------------------------------------- Level 2
- id: korean_armistice
  start: 19530727
  level: 2
  kind: war
  title: Korean Armistice
  description_short: An armistice at Panmunjom ends the fighting in Korea, with the peninsula still divided.
  description_long: The agreement ends the war that closed the Ascendancy, as Eisenhower had promised. No peace treaty follows.
  why: It starts the epoch with a calm that makes plenty possible, and leaves a permanent Cold War frontier.
  tags:
  - korea
  - armistice
  - eisenhower
- id: social_security_expansion_1954
  start: 19540901
  level: 2
  kind: legislation
  title: Social Security Expanded
  description_short: A Republican Congress and president extend Social Security to about ten million more workers.
  description_long: Eisenhower had written to his brother that any party trying to abolish Social Security would vanish from politics, and
    his administration proposes the expansion, adding farm and domestic workers among others.
  why: It is the clearest evidence of the ratification signal, the opposition party accepting the New Deal's terms.
  tags:
  - social-security
  - eisenhower
  - ratification
- id: montgomery_bus_boycott
  start: 19551205
  end: 19561220
  level: 2
  kind: protest
  title: Montgomery Bus Boycott
  description_short: Black residents of Montgomery boycott the city's buses for 381 days, led by a young minister, Martin Luther King Jr.
  description_long: The boycott begins four days after Rosa Parks's arrest, and ends with a Supreme Court ruling that bus
    segregation is unconstitutional. It establishes nonviolent mass protest as a method and makes King a national figure.
  why: It shows the movement's method and force, the people outside the settlement organizing for entry.
  tags:
  - civil-rights
  - boycott
  - king
- id: little_rock
  start: 19570924
  level: 2
  kind: political_event
  title: Little Rock Nine
  description_short: Eisenhower sends the 101st Airborne to Little Rock to enforce the integration of Central High School.
  description_long: Governor Orval Faubus had used the Arkansas National Guard to block nine Black students. Federal troops escort
    them to class.
  why: It shows that desegregation required federal force, and a Republican president using it.
  tags:
  - desegregation
  - eisenhower
  - arkansas
- id: affluent_society_book
  start: 19580101
  level: 2
  kind: intellectual
  title: Galbraith's The Affluent Society
  description_short: John Kenneth Galbraith argues that the problem of production is solved and private wealth sits beside public squalor.
  description_long: The book names the era and shifts the question from producing wealth to distributing it and improving its
    quality. Date is year-level (1958).
  why: It names the epoch and states the question of the first clause, whether plenty will be shared.
  tags:
  - galbraith
  - economics
  - affluence
  date_precision: year
- id: greensboro_sit_ins
  start: 19600201
  level: 2
  kind: protest
  title: Greensboro Sit-Ins
  description_short: Four Black college students sit down at a whites-only lunch counter in Greensboro, North Carolina, starting a wave of sit-ins.
  description_long: Within two months the sit-ins spread to more than fifty cities, and students form the Student Nonviolent
    Coordinating Committee.
  why: It begins the student phase of the movement, a mass direct-action challenge to Southern exclusion.
  tags:
  - sit-ins
  - civil-rights
  - students
- id: eisenhower_farewell
  start: 19610117
  level: 2
  kind: speech
  title: Eisenhower's Farewell Address
  description_short: Eisenhower warns the nation against the "unwarranted influence" of the military-industrial complex.
  description_long: The speech comes from the general who presided over the largest peacetime military buildup and warns that the
    arms industry and military had acquired too much power.
  why: It is the era's own warning about the cost of the Cold War state it built.
  tags:
  - eisenhower
  - military
  - warning
- id: berlin_wall
  start: 19610813
  level: 2
  kind: crisis
  title: Berlin Wall Built
  description_short: East Germany seals the border in Berlin with barbed wire and then a concrete wall.
  description_long: Kennedy accepts the division, calling the wall "a hell of a lot better than a war." The wall stands for 28 years.
  why: It is the Cold War's symbol, and the settlement's limit in Europe.
  tags:
  - berlin
  - cold-war
  - germany
- id: birmingham_campaign
  start: 19630403
  end: 19630510
  level: 2
  kind: protest
  title: Birmingham Campaign
  description_short: Marches and sit-ins meet police dogs and fire hoses in Birmingham, Alabama, and the images appall the nation.
  description_long: King writes his Letter from Birmingham Jail in April, and hundreds of schoolchildren march in May. The city
    agrees to desegregate lunch counters and other facilities.
  why: It turns the Southern exclusion into a national moral crisis, and prepares the Civil Rights Act.
  tags:
  - civil-rights
  - birmingham
  - king
- id: march_on_washington
  start: 19630828
  level: 2
  kind: protest
  title: March on Washington
  description_short: About 250,000 people gather at the Lincoln Memorial for jobs and freedom, where King gives his "I Have a Dream" speech.
  description_long: The march is organized by A. Philip Randolph and others and is the largest political gathering in the capital to
    that date.
  why: It builds the national consensus behind the civil rights bill.
  tags:
  - civil-rights
  - king
  - washington
- id: gulf_of_tonkin_resolution
  start: 19640807
  level: 2
  kind: legislation
  title: Gulf of Tonkin Resolution
  description_short: Congress authorizes the president to use force in Southeast Asia after reported attacks on U.S. ships.
  description_long: The vote is unanimous in the House and 88 to 2 in the Senate. Later evidence shows the second attack never
    happened.
  why: It is a blank check for the war, authorized at the consensus's height.
  tags:
  - vietnam
  - congress
  - johnson
- id: johnson_landslide
  start: 19641103
  level: 2
  kind: election
  title: Johnson's Landslide
  description_short: Lyndon Johnson defeats Barry Goldwater with 61 percent of the vote, the largest popular margin of the century.
  description_long: The result gives Johnson a Congress with large Democratic majorities, and the Great Society follows.
  why: It is the mandate for the Great Society, at the settlement's height.
  tags:
  - election
  - johnson
  - great-society
- id: selma_bloody_sunday
  start: 19650307
  level: 2
  kind: violence
  title: Bloody Sunday at Selma
  description_short: State troopers attack voting-rights marchers at the Edmund Pettus Bridge in Selma, Alabama.
  description_long: Television shows the beatings, and Johnson addresses Congress eight days later, saying "we shall overcome." The
    march to Montgomery follows.
  why: It is the violence that produces the Voting Rights Act.
  tags:
  - voting-rights
  - selma
  - violence
- id: da_nang_landing
  start: 19650308
  level: 2
  kind: military
  title: Marines Land at Da Nang
  description_short: The first American combat troops arrive in South Vietnam.
  description_long: The landing follows the start of the Rolling Thunder bombing campaign. By the end of the year about 180,000
    American troops are in Vietnam.
  why: It begins the ground war, on the same day the consensus is approaching its peak.
  tags:
  - vietnam
  - marines
  - escalation
- id: medicare_medicaid
  start: 19650730
  level: 2
  kind: legislation
  title: Medicare and Medicaid
  description_short: Johnson signs health insurance for the elderly and the poor, with Harry Truman at his side.
  description_long: The programs, signed in Independence, Missouri, make the federal government the chief payer of health care for tens
    of millions.
  why: It is the Great Society's social-insurance peak, the answer to the first clause of the question.
  tags:
  - health
  - medicare
  - great-society
- id: watts_riot
  start: 19650811
  end: 19650816
  level: 2
  kind: violence
  title: Watts Riot
  description_short: Six days of rioting in Los Angeles's Black Watts neighborhood kill 34 people and destroy about a thousand buildings.
  description_long: The riot begins after a traffic stop and shows that Black frustration in Northern and Western cities was not met
    by the Southern civil rights laws.
  why: It is the first crack, five days after the Voting Rights Act, at the moment of triumph.
  tags:
  - race
  - violence
  - los-angeles
- id: hart_celler_act
  start: 19651003
  level: 2
  kind: legislation
  title: Hart–Celler Act
  description_short: Congress abolishes the national-origins quota system, replacing it with a preference for family reunification and skills.
  description_long: Johnson signs the act at the Statue of Liberty and says it will not change the country's makeup. It ends
    the system of 1924 and later transforms the immigrant population, with a new cap on Western Hemisphere immigration.
  why: It reverses the immigration thread's closure, the 1924 logic of membership ended in the same year as the Voting Rights Act.
  tags:
  - immigration
  - quotas
  - great-society
# ---------------------------------------------------------------- Level 3
- id: eisenhower_inaugurated
  start: 19530120
  level: 3
  kind: political_event
  title: Eisenhower Inaugurated
  description_short: Dwight Eisenhower becomes the first Republican president in twenty years.
  description_long: He accepts the New Deal's structure while changing its tone, and names a cabinet of businessmen.
  why: It opens the epoch with the opposition in power and the settlement unrepealed.
  tags:
  - eisenhower
  - inauguration
  - republicans
- id: hew_created
  start: 19530411
  level: 3
  kind: institution
  title: Department of Health, Education, and Welfare Created
  description_short: Eisenhower's administration creates a cabinet department for health, education, and welfare.
  description_long: Oveta Culp Hobby becomes its first secretary. The department consolidates the New Deal's social programs.
  why: It shows a Republican administration building a cabinet department for the welfare state.
  tags:
  - welfare
  - bureaucracy
  - eisenhower
- id: iran_coup_1953
  start: 19530819
  level: 3
  kind: foreign_policy
  title: Iran Coup
  description_short: The CIA and Britain help overthrow Iran's elected prime minister, Mohammad Mossadegh.
  description_long: The operation restores the Shah to power and secures Western oil interests. Its consequences return in 1979.
  why: It begins the pattern of covert action that the Cold War leadership relies on.
  tags:
  - iran
  - cia
  - covert-action
- id: army_mccarthy_hearings
  start: 19540422
  end: 19540617
  level: 3
  kind: political_event
  title: Army–McCarthy Hearings
  description_short: Televised Senate hearings expose Senator McCarthy's bullying, and his support collapses.
  description_long: Army counsel Joseph Welch asks him on camera, "Have you no sense of decency, sir?"
  why: It is the beginning of the end of McCarthyism, brought down by television.
  tags:
  - mccarthyism
  - television
  - senate
- id: dien_bien_phu
  start: 19540507
  level: 3
  kind: war
  title: Dien Bien Phu
  description_short: Vietnamese forces defeat the French at Dien Bien Phu, ending French rule in Indochina.
  description_long: Eisenhower declines to intervene. The Geneva Accords in July divide Vietnam at the 17th parallel.
  why: It starts the American inheritance of the Vietnam commitment.
  tags:
  - vietnam
  - france
  - geneva
- id: mccarthy_censured
  start: 19541202
  level: 3
  kind: political_event
  title: McCarthy Censured
  description_short: The Senate votes 67 to 22 to censure Senator McCarthy.
  description_long: McCarthy's power ends, and he dies in 1957.
  why: It marks the end of the Red Scare's peak.
  tags:
  - mccarthyism
  - senate
  - censure
- id: polio_vaccine
  start: 19550412
  level: 3
  kind: science
  title: Polio Vaccine Declared Safe
  description_short: Jonas Salk's polio vaccine is announced as safe and effective.
  description_long: The vaccine had been funded by the March of Dimes, and the announcement is greeted with national celebration.
  why: It is a triumph of mass science and the era's confidence in progress.
  tags:
  - polio
  - science
  - health
- id: brown_ii
  start: 19550531
  level: 3
  kind: court_case
  title: Brown II
  description_short: The Supreme Court orders desegregation "with all deliberate speed."
  description_long: The vague standard leaves implementation to local federal courts and invites a decade of resistance.
  why: It shows the gap between a right and its enforcement.
  tags:
  - segregation
  - supreme-court
  - enforcement
- id: emmett_till
  start: 19550828
  level: 3
  kind: violence
  title: Emmett Till Murdered
  description_short: A 14-year-old Black boy from Chicago is kidnapped and killed in Mississippi, and his killers are acquitted.
  description_long: His mother insists on an open casket, and the photographs appear in Jet magazine and shock the country.
  why: It is a national awakening to the South's violence.
  tags:
  - lynching
  - race
  - mississippi
- id: rosa_parks
  start: 19551201
  level: 3
  kind: political_event
  title: Rosa Parks Arrested
  description_short: Rosa Parks refuses to give up her bus seat to a white passenger in Montgomery and is arrested.
  description_long: The NAACP activist's arrest sparks the boycott.
  why: It is the spark of the movement.
  tags:
  - civil-rights
  - montgomery
  - parks
- id: afl_cio_merger
  start: 19551205
  level: 3
  kind: organization
  title: AFL–CIO Merger
  description_short: The AFL and CIO merge, uniting about 15 million workers.
  description_long: George Meany becomes the first president. Union membership is about a third of the nonfarm workforce.
  why: It is organized labor at its peak, a partner in the settlement.
  tags:
  - labor
  - unions
  - meany
- id: eisenhower_reelected
  start: 19561106
  level: 3
  kind: election
  title: Eisenhower Reelected
  description_short: Eisenhower defeats Adlai Stevenson again, 457 electoral votes to 73.
  description_long: The result confirms the settlement's popularity.
  why: It confirms the consensus.
  tags:
  - election
  - eisenhower
  - consensus
- id: civil_rights_act_1957
  start: 19570909
  level: 3
  kind: legislation
  title: Civil Rights Act of 1957
  description_short: Congress passes the first civil rights law since Reconstruction, a weak voting-rights measure.
  description_long: Senator Strom Thurmond filibusters for more than 24 hours. The act creates a Civil Rights Commission.
  why: It breaks the long silence, in a limited way.
  tags:
  - civil-rights
  - voting-rights
  - congress
- id: nasa_created
  start: 19580729
  level: 3
  kind: institution
  title: NASA Created
  description_short: Eisenhower signs the law creating the National Aeronautics and Space Administration.
  description_long: The agency takes over the American space effort in response to Sputnik.
  why: It is the federal answer to Sputnik, the Cold War turned inward.
  tags:
  - space-race
  - nasa
  - science
- id: ndea
  start: 19580902
  level: 3
  kind: legislation
  title: National Defense Education Act
  description_short: Congress funds science, math, and foreign-language education, and student loans.
  description_long: The first large-scale federal aid to education is justified as defense.
  why: It is the Cold War justifying federal education spending.
  tags:
  - education
  - science
  - cold-war
- id: castro_takes_power
  start: 19590101
  level: 3
  kind: political_event
  title: Castro Takes Power in Cuba
  description_short: Fidel Castro's revolution overthrows Cuba's dictator, Fulgencio Batista.
  description_long: Castro's turn toward the Soviet Union brings the Cold War ninety miles from Florida.
  why: It sets up the Bay of Pigs and the missile crisis.
  tags:
  - cuba
  - castro
  - revolution
- id: u2_incident
  start: 19600501
  level: 3
  kind: crisis
  title: U-2 Shot Down
  description_short: The Soviet Union downs an American spy plane, and Eisenhower admits the flights.
  description_long: The incident collapses a planned summit in Paris.
  why: It ends a hopeful moment and exposes the secrecy of the Cold War.
  tags:
  - espionage
  - soviet-union
  - summit
- id: birth_control_pill
  start: 19600509
  level: 3
  kind: science
  title: Birth Control Pill Approved
  description_short: The FDA approves the first oral contraceptive.
  description_long: The pill gives women unprecedented control over reproduction and spreads rapidly.
  why: It is a technological change with a social effect larger than most laws.
  tags:
  - contraception
  - women
  - science
- id: kennedy_nixon_debate
  start: 19600926
  level: 3
  kind: political_event
  title: First Kennedy–Nixon Debate
  description_short: The first televised presidential debate is watched by about 70 million people.
  description_long: Radio listeners think Nixon did well and television viewers think Kennedy won.
  why: It makes television central to presidential politics.
  tags:
  - television
  - debate
  - kennedy
- id: kennedy_inaugural
  start: 19610120
  level: 3
  kind: speech
  title: Kennedy's Inaugural Address
  description_short: Kennedy asks Americans to "ask not what your country can do for you."
  description_long: The speech frames the Cold War as a "long twilight struggle" and pledges to bear any burden.
  why: It states the era's confidence and its open-ended commitments.
  tags:
  - kennedy
  - inauguration
  - cold-war
- id: bay_of_pigs
  start: 19610417
  level: 3
  kind: military
  title: Bay of Pigs
  description_short: A CIA-trained force of Cuban exiles invades Cuba and is defeated within three days.
  description_long: Kennedy had inherited the plan and declines to provide air cover. The failure humiliates the administration.
