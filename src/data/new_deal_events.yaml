schema:
  name: American Epochs Event Corpus
  version: 2
  date_format: YYYYMMDD
  level_definition:
    1: The epoch's "crown of the mountain" — always visible, at every zoom, from the very widest view. One beat
      per structural hinge in the epoch's own arc, not a list of "the important stuff." Target 5-8 entries regardless
      of how large or eventful the epoch was; see curation_guidance below. Automatically revealed first as the viewer
      zooms in from full history — never a manual toggle.
    2: Major events, automatically revealed at the first closer zoom past Level 1.
    3: Supporting events explaining mechanisms, shifts, and consequences.
    4: Contextual events — political, military, social, institutional texture.
    5: Fine-grained events for the closest inspection.
  curation_guidance:
  - Level 1 is the hardest and most important editorial call in the corpus. The viewer never chooses to see it —
    it is what everyone sees whether they zoom in or not, so it carries the whole epoch's argument on its own.
  - Pick one entry per point where the epoch's own arc genuinely turns, not one per famous name or battle. A working
    test - "does removing this entry break the causal chain from the epoch's start to its end?" If not, it belongs
    at Level 2 or below, however well-known it is.
  - Target 5-8 Level 1 point events specifically. This is deliberately independent of the epoch's total event count
    or length in years. Reconstruction intentionally carries nine point events because the Panic of 1873 and United
    States v. Cruikshank describe distinct political and judicial turns and the editor has approved a slightly crowded
    crown.
  - Span (duration) entries at Level 1 do not count against the point-event target because the live instrument never
    tier-filters spans; they provide scene-setting context.
  - Levels 2-5 have much more room to breathe. Disagreement there is a rounding error, not a structural problem.
    Spend the real editorial effort on Level 1.
  notes:
  - A missing end date indicates a point event.
  - Dates represent the most defensible public date for display, not necessarily every stage of a legal or political
    process.
  - date_precision (year or month) applies to start, and end_precision (month) to the end of a range. Where set, the
    placeholder in the date field must not be rendered as exact. Absent means a full day-level date. date_verified
    true means the date was confirmed against an identifiable source.
  - This corpus is a research/authoring artifact. A human or LLM reconciles it into the live EVENTS array.
  - Levels were assigned by Claude as a first-pass editorial judgment (see new_deal_outline.md for the Level 1
    reasoning). All dates are drafted from memory and none are yet source-verified, so verify before treating as
    settled. No source URLs are included, per the guide's rule against unverifiable citations. Figures to check first
    include the Dust Bowl exodus (about 2.5 million), union membership growth, and WPA employment totals.
  - Spans follow the "duration is necessary but not sufficient" rule. Only dust_bowl earns a permanent lane.
    emergency_banking_act, hundred_days, court_packing_fails, flint_sit_down_strike, roosevelt_recession, the
    antilynching filibuster, and the Battle of Britain are recorded with true ranges but are under two years, so they
    reconcile as point events at their end dates.
  - Level 1 includes hundred_days (1933-03-09 to 1933-06-16), which renders as a point on June 16, the day the National
    Industrial Recovery Act and Glass-Steagall were signed.
  - Boundary decisions. The corpus opens at Roosevelt's inauguration (1933-03-04). The winter's bank panics, the
    election of 1932, and the Twentieth Amendment belong to Return to Normalcy. The corpus closes at the end of 1940
    and keeps the draft, the destroyers deal, the third term, and the Arsenal of Democracy speech. Lend-Lease passes in
    March 1941 and opens the Ascendancy. The Great Depression span in the live instrument ends in March 1933 and is
    not extended.
epoch:
  id: new_deal
  title: A New Deal
  start: 19330304
  end: 19401231
  thesis: Within four years Roosevelt builds the modern American state, with bank rescue and deposit insurance, securities
    regulation, relief and public jobs, farm supports, the right to organize, Social Security, rural electrification, and
    a federal role in housing. The Supreme Court strikes down the National Recovery Administration and the farm program,
    Roosevelt wins a 1936 landslide and overreaches with a plan to enlarge the Court, and the plan fails but the Court yields
    to the program's legal basis anyway. A 1937 recession, a conservative coalition of Southern Democrats and Republicans,
    and the war in Europe end the expansion. The order that survives governs the economy and extends security to many, but
    on terms set by the coalition that made it possible, which leaves out agricultural and domestic workers.
events:
# ---------------------------------------------------------------- Level 1: span
- id: dust_bowl
  start: 19340101
  end: 19391231
  level: 1
  kind: environmental_period
  title: Dust Bowl
  description_short: Drought and wind erosion devastate the southern Plains, driving hundreds of thousands of families off the land.
  description_long: Decades of plowing the grasslands leave the soil exposed when the drought hits. Black blizzards of dust darken
    the sky across the Plains, and about 2.5 million people leave the Plains states during the 1930s. Dates are year-level (1934
    to 1939).
  why: It frames the relief programs, the farm policy, and the migration of the era, a disaster that the new state is expected to
    answer.
  tags:
  - dust-bowl
  - agriculture
  - migration
  date_precision: year
# ---------------------------------------------------------------- Level 1: points
- id: emergency_banking_act
  start: 19330306
  end: 19330309
  level: 1
  kind: legislation
  title: Bank Holiday and Emergency Banking Act
  description_short: Roosevelt closes every bank in the country, and Congress passes the Emergency Banking Act in a few hours.
  description_long: The House passes the bill without a printed copy on March 9, five days after the inauguration. Banks reopen
    under federal inspection, and Roosevelt's first fireside chat persuades depositors to return their money.
  why: It is the rescue. The government becomes the lender of last resort for the country, and confidence returns within days.
  tags:
  - banking
  - rescue
  - roosevelt
- id: hundred_days
  start: 19330309
  end: 19330616
  level: 1
  kind: legislation
  title: The Hundred Days
  description_short: Congress passes fifteen major laws in Roosevelt's first hundred days, creating most of the New Deal's agencies.
  description_long: The session runs from March 9 to June 16, 1933, and produces relief, public jobs, farm supports, the Tennessee
    Valley Authority, securities regulation, deposit insurance, and the National Industrial Recovery Act.
  why: It is the founding burst, the moment the national government assumes responsibility for the economy at scale.
  tags:
  - congress
  - legislation
  - roosevelt
- id: wagner_act
  start: 19350705
  level: 1
  kind: legislation
  title: Wagner Act
  description_short: Congress guarantees workers the right to organize and bargain collectively, and creates the National Labor Relations Board.
  description_long: The act protects workers from employer retaliation and requires employers to bargain with certified unions. It
    excludes agricultural and domestic workers. Union membership roughly triples by the end of the decade.
  why: It is the labor pillar of the New Deal Order, the answer to the Gilded Age's use of federal force against strikes.
  tags:
  - labor
  - unions
  - congress
- id: social_security_act
  start: 19350814
  level: 1
  kind: legislation
  title: Social Security Act
  description_short: Congress creates old-age pensions and unemployment insurance, the permanent core of the welfare state.
  description_long: The act covers most industrial workers but excludes agricultural and domestic workers, which leaves out a large
    share of Black and Mexican American workers. Payments begin in 1940.
  why: It is the program that outlasts every attack, and where the question's second clause is clearest, since protection is built
    with exclusions.
  tags:
  - social-security
  - welfare
  - exclusion
- id: court_packing_fails
  start: 19370205
  end: 19370722
  level: 1
  kind: political_event
  title: Court-Packing Plan Fails
  description_short: The Senate recommits Roosevelt's plan to add justices to the Supreme Court, handing him his worst defeat.
  description_long: Roosevelt proposes the plan on February 5, 1937, after winning forty-six states. His own party revolts, and the
    Court changes direction anyway in March and April by upholding state minimum wage and the Wagner Act.
  why: It is the contest over survival, a real attempt to override a coequal branch, and the order's legal basis is secured even as
    the plan fails.
  tags:
  - supreme-court
  - constitution
  - roosevelt
- id: conservative_coalition
  start: 19381108
  level: 1
  kind: election
  title: Conservative Coalition Forms
  description_short: Republicans gain 81 House seats in the midterms, and they join Southern Democrats in a bloc that blocks new reform.
  description_long: Roosevelt's attempt to purge conservative Democrats in the primaries failed that summer. The bloc controls key
    committees for decades and blocks labor and civil rights bills.
  why: It is the New Deal Order's built-in limit, the price Southern Democrats set for their votes.
  tags:
  - congress
  - midterm
  - southern-democrats
- id: selective_service_act
  start: 19400916
  level: 1
  kind: legislation
  title: Selective Service Act
  description_short: Congress enacts the first peacetime draft in American history.
  description_long: The act requires men aged 21 to 35 to register, with 900,000 to be drafted each year. It passes after the fall
    of France.
  why: It turns the story from domestic argument to mobilization.
  tags:
  - draft
  - mobilization
  - war
# ---------------------------------------------------------------- Level 2
- id: fdr_inaugurated
  start: 19330304
  level: 2
  kind: political_event
  title: Franklin Roosevelt Inaugurated
  description_short: Roosevelt takes office declaring that "the only thing we have to fear is fear itself."
  description_long: Banks are closed or restricted in nearly every state, and about a quarter of the workforce is unemployed.
  why: It opens the epoch and gives its tone, a confident, experimental government.
  tags:
  - roosevelt
  - inauguration
  - fear
- id: banking_act_1933
  start: 19330616
  level: 2
  kind: legislation
  title: Glass–Steagall Act and the FDIC
  description_short: Congress separates commercial and investment banking and creates federal deposit insurance.
  description_long: The Banking Act of 1933 restores trust in the banking system. Deposit insurance becomes one of the New Deal's
    most durable legacies.
  why: It builds the permanent regulatory structure for finance, the Big Stick's unfinished business after the Panic of 1907.
  tags:
  - banking
  - fdic
  - regulation
- id: nira
  start: 19330616
  level: 2
  kind: legislation
  title: National Industrial Recovery Act
  description_short: Congress creates the National Recovery Administration to organize business into fair-competition codes.
  description_long: The act also creates a public works program and guarantees workers the right to organize. The NRA relies on
    voluntary compliance and a blue eagle emblem.
  why: It is the New Deal's most ambitious experiment, governing the economy through business itself, and its failure shapes
    everything after.
  tags:
  - nra
  - industry
  - recovery
- id: prohibition_repealed
  start: 19331205
  level: 2
  kind: constitutional_amendment
  title: Prohibition Repealed
  description_short: The Twenty-First Amendment repeals the Eighteenth, the only time an amendment has been repealed.
  description_long: Utah becomes the thirty-sixth state to ratify. The repeal restores a legal alcohol industry and a new source of
    tax revenue.
  why: It ends the decade's failed attempt to govern private life, and marks the shift in what government tries to do.
  tags:
  - prohibition
  - constitution
  - repeal
- id: wpa_created
  start: 19350408
  level: 2
  kind: institution
  title: Works Progress Administration
  description_short: Congress funds the largest federal jobs program to date, which employs millions.
  description_long: The WPA employs about 8.5 million people over its life, building roads, bridges, schools, and airports, and
    employing artists and writers. Harry Hopkins runs it.
  why: It makes the government the employer of last resort, the Second New Deal's signature response to unemployment.
  tags:
  - jobs
  - relief
  - hopkins
- id: schechter_decision
  start: 19350527
  level: 2
  kind: court_case
  title: Schechter Poultry v. United States
  description_short: The Supreme Court unanimously strikes down the National Industrial Recovery Act.
  description_long: The Court holds that the act delegates too much legislative power and stretches the commerce clause. The
    decision is known as "Black Monday" in the administration.
  why: It is the first great test of the New Deal's survival, and Roosevelt's response eventually leads to the court-packing fight.
  tags:
  - supreme-court
  - nra
  - commerce-clause
- id: election_1936
  start: 19361103
  level: 2
  kind: election
  title: Roosevelt's Landslide Reelection
  description_short: Roosevelt wins 46 of 48 states, defeating Alf Landon in the largest electoral victory since 1820.
  description_long: The New Deal coalition of urban workers, Southerners, Black voters, and farmers is formed. Black voters shift
    from the Republican Party to the Democrats in large numbers.
  why: It gives the order a mandate and a coalition, and sets up the overreach that follows.
  tags:
  - election
  - coalition
  - roosevelt
- id: flint_sit_down_strike
  start: 19361230
  end: 19370211
  level: 2
  kind: strike
  title: Flint Sit-Down Strike
  description_short: Autoworkers occupy General Motors plants for six weeks and win recognition of the UAW.
  description_long: The strike begins December 30, 1936, and ends February 11, 1937. Governor Frank Murphy refuses to use the
    National Guard to evict the strikers.
  why: It is the labor movement winning in the way the Gilded Age's strikes lost, with the state declining to side with capital.
  tags:
  - labor
  - strike
  - uaw
- id: west_coast_hotel
  start: 19370329
  level: 2
  kind: court_case
  title: West Coast Hotel v. Parrish
  description_short: The Supreme Court upholds a state minimum wage law, reversing its position of the previous year.
  description_long: Justice Owen Roberts changes his vote, and the 5–4 ruling is called "the switch in time that saved nine."
    The Court upholds the Wagner Act and Social Security within two months.
  why: It is the legal turning point, the Court yielding to the modern regulatory state.
  tags:
  - supreme-court
  - minimum-wage
  - constitution
- id: roosevelt_recession
  start: 19370501
  end: 19380630
  level: 2
  kind: economic_crisis
  title: Roosevelt Recession
  description_short: A sharp downturn follows spending cuts and tax increases, and unemployment rises again.
  description_long: The NBER dates the contraction from May 1937 to June 1938. Industrial output falls by a third and unemployment
    climbs back above 19 percent. Dates are month-level.
  why: It shows that the economy had not yet recovered on its own, and breaks the confidence of the second term.
  tags:
  - recession
  - unemployment
  - spending
  date_precision: month
  end_precision: month
- id: fair_labor_standards_act
  start: 19380625
  level: 2
  kind: legislation
  title: Fair Labor Standards Act
  description_short: Congress sets a national minimum wage of 25 cents an hour and a 44-hour week, and bans most child labor.
  description_long: The act is the last major New Deal law, and it excludes agricultural and domestic workers, as the earlier laws did.
  why: It is the final reform before the coalition's stall, and again the exclusions mark who was inside.
  tags:
  - minimum-wage
  - child-labor
  - labor
- id: germany_invades_poland
  start: 19390901
  level: 2
  kind: war
  title: Germany Invades Poland
  description_short: Germany attacks Poland, and Britain and France declare war, starting World War II in Europe.
  description_long: Roosevelt declares neutrality and then moves to revise the neutrality laws to allow arms sales to Britain and
    France.
  why: It begins the turn from domestic argument to mobilization.
  tags:
  - war
  - europe
  - neutrality
- id: fall_of_france
  start: 19400622
  level: 2
  kind: war
  title: Fall of France
  description_short: France signs an armistice with Germany, leaving Britain alone.
  description_long: The shock leads to rearmament, the draft, and the destroyers deal within months.
  why: It is the event that makes American mobilization a national consensus.
  tags:
  - war
  - france
  - rearmament
- id: destroyers_for_bases
  start: 19400902
  level: 2
  kind: diplomacy
  title: Destroyers-for-Bases Deal
  description_short: Roosevelt trades fifty old destroyers to Britain for leases on British bases in the Western Hemisphere.
  description_long: The agreement, made without Congress, is a first step into the war that skirts the neutrality laws.
  why: It is the first big American commitment to the Allied side, executive action without legislation.
  tags:
  - britain
  - navy
  - executive
- id: election_1940
  start: 19401105
  level: 2
  kind: election
  title: Roosevelt Wins a Third Term
  description_short: Roosevelt defeats Wendell Willkie and breaks the two-term tradition set by Washington.
  description_long: The campaign turns on the war, and Roosevelt promises that American boys will not be sent into foreign wars.
  why: It breaks a 150-year precedent and confirms that the story is now about the war.
  tags:
  - election
  - third-term
  - roosevelt
# ---------------------------------------------------------------- Level 3
- id: first_fireside_chat
  start: 19330312
  level: 3
  kind: speech
  title: First Fireside Chat
  description_short: Roosevelt explains the banking crisis to the country on the radio.
  description_long: The talks give the presidency a direct voice in American homes.
  why: It makes radio an instrument of the presidency.
  tags:
  - radio
  - roosevelt
  - communication
- id: civilian_conservation_corps
  start: 19330331
  level: 3
  kind: institution
  title: Civilian Conservation Corps
  description_short: Congress creates a program that puts young men to work in forests and parks.
  description_long: About three million young men serve over nine years, planting billions of trees and building park facilities.
    The camps are largely segregated.
  why: It is the first relief program, popular and visible.
  tags:
  - jobs
  - conservation
  - youth
- id: gold_standard_abandoned
  start: 19330419
  level: 3
  kind: finance
  title: U.S. Leaves the Gold Standard
  description_short: Roosevelt takes the dollar off the gold standard for domestic use.
  description_long: The move, with a ban on private gold holdings, lets prices rise and the money supply expand. The Gold Reserve Act
    of January 1934 sets a new gold price of $35 an ounce.
  why: It ends the monetary order of the 1890s that McKinley's election defended.
  tags:
  - gold-standard
  - money
  - deflation
- id: agricultural_adjustment_act
  start: 19330512
  level: 3
  kind: legislation
  title: Agricultural Adjustment Act
  description_short: Congress pays farmers to reduce production in order to raise crop prices.
  description_long: The act subsidizes landowners, and displaces many tenant farmers and sharecroppers, especially Black Southerners.
  why: It is the answer to the farm crisis Coolidge vetoed, and it shows the exclusions inside its own design.
  tags:
  - agriculture
  - subsidies
  - sharecroppers
- id: tennessee_valley_authority
  start: 19330518
  level: 3
  kind: institution
  title: Tennessee Valley Authority
  description_short: Congress creates a federal corporation to build dams and bring electric power and flood control to the Tennessee Valley.
  description_long: The TVA is the largest public power and regional development project in American history.
  why: It is public ownership of infrastructure on a scale the Gilded Age would not have imagined.
  tags:
  - power
  - infrastructure
  - regional-development
- id: securities_act
  start: 19330527
  level: 3
  kind: legislation
  title: Securities Act of 1933
  description_short: Congress requires companies to disclose information when selling stocks and bonds.
  description_long: The law makes issuers truthful about what they sell, and follows with the Securities Exchange Act in 1934.
  why: It answers the speculation of the 1920s.
  tags:
  - securities
  - regulation
  - finance
- id: homeowners_loan_corporation
  start: 19330613
  level: 3
  kind: institution
  title: Home Owners' Loan Corporation
  description_short: Congress creates a federal agency to refinance mortgages in default.
  description_long: The HOLC refinances about a million homes. Its appraisal maps, with Black and immigrant neighborhoods coded
    red, shape lending for decades.
  why: It saves homeowners and builds the system of redlining, the same act of protection and exclusion.
  tags:
  - housing
  - redlining
  - mortgages
- id: sec_created
  start: 19340606
  level: 3
  kind: institution
  title: Securities and Exchange Commission
  description_short: Congress creates the SEC to regulate the stock markets, with Joseph Kennedy as its first chairman.
  description_long: The agency polices exchanges, brokers, and corporate disclosure.
  why: It is the permanent regulator of the market that crashed.
  tags:
  - securities
  - regulation
  - sec
- id: indian_reorganization_act
  start: 19340618
  level: 3
  kind: legislation
  title: Indian Reorganization Act
  description_short: Congress ends allotment and lets tribes adopt self-government and recover some land.
  description_long: The act reverses the Dawes Act's assimilation policy, and is the "Indian New Deal" led by John Collier.
  why: It reverses Gilded Age policy, an answer to the question of who is counted.
  tags:
  - native-americans
  - self-government
  - collier
- id: national_housing_act
  start: 19340628
  level: 3
  kind: legislation
  title: National Housing Act and the FHA
  description_short: Congress creates the Federal Housing Administration to insure home mortgages.
  description_long: The FHA's insured long-term loans make mass homeownership possible, but its guidelines favor white
    suburban neighborhoods.
  why: It builds the middle-class home and the segregation of housing together.
  tags:
  - housing
  - mortgages
  - fha
- id: black_sunday
  start: 19350414
  level: 3
  kind: disaster
  title: Black Sunday Dust Storm
  description_short: A huge dust storm blackens the sky across the southern Plains.
  description_long: The storm carries soil as far as the East Coast and makes the Dust Bowl a national story.
  why: It is the Dust Bowl's defining day.
  tags:
  - dust-bowl
  - disaster
  - plains
- id: rural_electrification
  start: 19350511
  level: 3
  kind: institution
  title: Rural Electrification Administration
  description_short: Roosevelt creates an agency to bring electric power to farms.
  description_long: In 1935 about 90 percent of rural homes lack electricity, and by 1950 about 90 percent have it.
  why: It extends the new state to rural America.
  tags:
  - electricity
  - rural
  - infrastructure
- id: cio_founded
  start: 19351109
  level: 3
  kind: organization
  title: CIO Founded
  description_short: John L. Lewis and other union leaders form the Committee for Industrial Organization.
  description_long: The CIO organizes unskilled workers in mass-production industries, including Black and immigrant workers the AFL
    had often excluded.
  why: It is the labor movement the Wagner Act made possible.
  tags:
  - labor
  - cio
  - industrial-unionism
- id: huey_long_assassinated
  start: 19350910
  level: 3
  kind: political_event
  title: Huey Long Assassinated
  description_short: Senator Huey Long, Roosevelt's most dangerous critic from the left, dies after being shot in Baton Rouge.
  description_long: Long's "Share Our Wealth" plan had millions of supporters and was a threat to Roosevelt's 1936 prospects.
  why: It removes the era's most powerful challenge from the populist left.
  tags:
  - populism
  - long
  - assassination
- id: butler_decision
  start: 19360106
  level: 3
  kind: court_case
  title: United States v. Butler
  description_short: The Supreme Court strikes down the Agricultural Adjustment Act's processing tax, 6–3.
  description_long: The decision ends the first farm program, and Congress passes a new version in 1938 on a different basis.
  why: It is the second great setback in the contest over the New Deal's survival.
  tags:
  - supreme-court
  - agriculture
  - taxation
- id: court_plan_announced
  start: 19370205
  level: 3
  kind: political_event
  title: Roosevelt Proposes Enlarging the Court
  description_short: Roosevelt asks Congress to let him appoint up to six new justices.
  description_long: His rationale is the burden of elderly judges, and the unspoken reason is the Court's rulings against the New
    Deal.
  why: It is the moment of overreach that turns the Court fight into a fight within Roosevelt's party.
  tags:
  - supreme-court
  - roosevelt
  - overreach
- id: jones_laughlin
  start: 19370412
  level: 3
  kind: court_case
  title: NLRB v. Jones & Laughlin Steel
  description_short: The Supreme Court upholds the Wagner Act, 5–4.
  description_long: The decision expands the commerce clause to cover labor relations in industries that affect interstate commerce.
  why: It secures the legal foundation for the labor pillar.
  tags:
  - supreme-court
  - labor
  - commerce-clause
- id: dies_committee
  start: 19380526
  level: 3
  kind: institution
  title: Dies Committee Created
  description_short: The House creates a committee to investigate un-American activities, the forerunner of HUAC.
  description_long: Martin Dies, a Texas Democrat, targets the New Deal and labor as communist-influenced.
  why: It is the start of the anticommunist politics that shapes the later Order.
  tags:
  - anticommunism
  - huac
  - congress
- id: kristallnacht
  start: 19381109
  level: 3
  kind: foreign_policy
  title: Kristallnacht
  description_short: Nazi mobs destroy Jewish businesses and synagogues across Germany, and thousands of Jews are arrested.
  description_long: Roosevelt recalls the American ambassador but does not raise the immigration quotas.
  why: It tests the 1924 quota system's consequences, and shows what the law leaves out.
  tags:
  - holocaust
  - refugees
  - immigration
- id: marian_anderson_concert
  start: 19390409
  level: 3
  kind: cultural
  title: Marian Anderson at the Lincoln Memorial
  description_short: After the DAR bars her from Constitution Hall, Marian Anderson sings to 75,000 people at the Lincoln Memorial.
  description_long: Eleanor Roosevelt resigns from the DAR and helps arrange the concert.
  why: It is a public moment on who is counted, with the government's tacit support.
  tags:
  - race
  - music
  - eleanor-roosevelt
- id: st_louis_refused
  start: 19390604
  level: 3
  kind: foreign_policy
  title: The St. Louis Turned Away
  description_short: The United States refuses entry to a ship of 937 Jewish refugees from Germany, which returns to Europe.
  description_long: About a quarter of its passengers die in the Holocaust. The U.S. quota for Germany remains filled by existing
    applicants.
  why: It is the most direct consequence of the immigration thread's closed door.
  tags:
  - refugees
  - immigration
  - holocaust
- id: neutrality_revised
  start: 19391104
  level: 3
  kind: legislation
  title: Neutrality Act Revised
  description_short: Congress allows "cash and carry" arms sales to the Allies.
  description_long: The change lets Britain and France buy arms from the United States, and it ends the arms embargo.
  why: It is the first legislative step toward Lend-Lease.
  tags:
  - neutrality
  - arms
  - congress
- id: arsenal_of_democracy
  start: 19401229
  level: 3
  kind: speech
  title: Arsenal of Democracy Speech
  description_short: Roosevelt tells the country that it must be "the great arsenal of democracy."
  description_long: The fireside chat prepares the public for Lend-Lease, which Roosevelt had announced on December 17.
  why: It sets the terms of the next epoch, an economy turned to the defense of others.
  tags:
  - war
  - lend-lease
  - speech
- id: lend_lease_proposed
  start: 19401217
  level: 3
  kind: political_event
  title: Roosevelt Proposes Lend-Lease
  description_short: Roosevelt compares aid to Britain to lending a neighbor a garden hose to put out a fire.
  description_long: The proposal frames what becomes the Lend-Lease Act of March 1941.
  why: It is the pivot from neutrality to arsenal, ending the epoch and opening the next.
  tags:
