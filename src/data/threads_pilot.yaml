    why_here: The party's leadership cannot hold its own voters.
    verify: Confirm the date and the claim that no majority leader had lost a primary before.
  - corpus: interregnum
    id: boehner_resigns
    role: link
    link: argued
    why_here: The Speaker resigns under pressure from his own party's insurgents.
  # --- the outsiders
  - corpus: interregnum
    id: sanders_announces
    role: link
    link: argued
    why_here: An independent senator who calls himself a socialist challenges the Democratic establishment.
  - corpus: interregnum
    id: trump_announces
    role: link
    link: documented
    why_here: A candidate with no political experience announces, and goes on to win the Republican nomination over the party's establishment.
  - corpus: reckoning
    id: scalia_garland
    role: link
    link: argued
    why_here: The Senate refuses to hold a hearing on a Supreme Court nominee, so the Court itself becomes an object of the fight over the system.
  - proposed: democratic_primary_2016
    start: 20160607
    suggested_level: 4
    suggested_epoch: reckoning
    title: Clinton Wins the Democratic Nomination
    sketch: Hillary Clinton clinches the Democratic nomination after the final primaries, defeating Bernie Sanders, who won more than twenty states and about 13 million votes. A month later leaked party emails feed charges that the process favored her.
    role: counterweight
    link: argued
    why_here: The insurgency on the left is absorbed by the party, where on the right the insurgency took it over, and the contrast is the thread's clearest asymmetry.
    verify: Confirm the date the delegate majority was reached, Sanders's state and vote totals, and the date and content of the DNC email release.
  - corpus: reckoning
    id: trump_elected
    role: culmination
    link: argued
    why_here: The outsider wins, against both establishments and the polls.
  # --- the loss of faith continues
  - corpus: reckoning
    id: election_2020
    role: consequence
    link: argued
    why_here: The loser refuses to concede, and the legitimacy of the count becomes a partisan fact.
  - corpus: reckoning
    id: january_6
    role: consequence
    link: argued
    why_here: The loss of faith in the count becomes physical.
  - corpus: reckoning
    id: roe_leak
    role: link
    link: argued
    why_here: A draft opinion leaks, and the Court's deliberations are seen before its decision.
  - corpus: reckoning
    id: dobbs
    role: consequence
    link: argued
    why_here: The Court ends a fifty-year settlement, and the loss of faith in an institution now runs from the other side.
  - proposed: court_confidence_2022
    start: 20220700
    date_precision: month
    suggested_level: 4
    suggested_epoch: reckoning
    title: Confidence in the Supreme Court Hits a Record Low
    sketch: Gallup reports the share of Americans with a great deal or quite a lot of confidence in the Supreme Court at the lowest in its polling, weeks after Dobbs.
    role: consequence
    link: documented
    why_here: The measure of the loss of faith, applied to the Court.
    verify: Confirm the figure and the date against Gallup before using either.
  - corpus: reckoning
    id: trump_reelected
    role: consequence
    link: argued
    why_here: The electorate returns the outsider to office, after the institutions that might have judged him declined to.

  settled_by_editor:
  - The three pre-2008 seeds stay.
  - The thread runs into Dobbs and the Court.
  - The 2016 Democratic primary is added, as a counterweight, for the left-right asymmetry.
  gaps:
    summary: >-
      Four events are not in any corpus yet, all at low levels. The pre-2008 seeds (Bush v. Gore, the
      missing weapons, Katrina) are marked argued, since the claim that disenchantment began before the crash
      is the thread's second counter-reading and is not settled.
    open_questions:
    - Whether the three pre-2008 seeds belong, or whether the thread starts at the crash.

- id: imperial_presidency
  title: The Imperial Presidency
  claim: Since Nixon, the balance of power has shifted from Congress and the courts to the president, through claims that
    the law does not bind him, and each limit that followed has been narrower than the claim.
  summary: 'Nixon''s own words state the idea: "When the president does it, that means that it is not illegal." Watergate
    produced the strongest correction, with a unanimous Supreme Court, a resignation, the Church Committee, and a law restoring
    Congress''s control of spending, and the claim was never repudiated, only checked. After September 11, lawyers in the
    executive branch wrote that the president''s war powers override statutes against torture and warrantless surveillance,
    and a secret memo approved the killing of an American citizen by drone. Both parties'' presidents then governed by executive
    action where Congress would not act, on immigration, recess appointments, eviction moratoria, vaccine rules, and student
    debt, and the courts struck several of them down. In the second Trump term the claim moved from theory to practice, with
    a Supreme Court decision on immunity, agencies dismantled by executive action, spending withheld, tariffs by emergency
    declaration, and flights that proceeded despite a judge''s order. The courts have set some limits, and the thread records
    those too.'
  register: argued
  register_note: The events are documented. That they form a pattern of one claim is an interpretation. The thread's own name
    comes from Arthur Schlesinger's 1973 book, but the thread is narrower than his, which covered the whole growth of presidential
    power, including war-making. The editor's reading is that war-making grew out of the country's postwar position, and is
    a different question.
  counter_reading: Three objections. (1) The unitary executive theory holds that the Constitution vests all executive power
    in the president, so what the thread calls a claim of immunity is a restoration of Article II, and the Court's immunity
    decision, on this view, is a correct reading. (2) Nixon was not the first to claim broad power. Lincoln suspended habeas
    corpus and Wilson ran the Espionage Act, so a thread starting in 1972 may mistake the point at which the claim was made
    explicit for the point at which it began. (3) The record is not a steady rise. United States v. Nixon, the post-Watergate
    laws, and in 2025 and 2026 the rulings on the National Guard and the tariffs show the other branches holding the line
    at times, and the thread includes them as counterweights.
  endpoint: Open. The latest members are the Iran War and the 2026 Supreme Court rulings.
  status: open
  see_also:
  - disenchantment
  - al_qaedas_war
  - war_powers (not yet drafted)
  - dirty_tricks (not yet drafted)
