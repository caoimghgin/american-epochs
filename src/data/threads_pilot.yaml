    role: link
    link: documented
    why_here: The warning is on the record five weeks before the attack, and the 9/11 Commission examines it.
  # --- the culmination
  - corpus: end_of_history
    id: september_11
    role: culmination
    link: documented
    why_here: The campaign reaches the United States.
  # --- the war that follows
  - corpus: end_of_history
    id: afghanistan_invasion
    role: consequence
    link: documented
    why_here: The war the attack produces, against the group's host government.
  - corpus: end_of_history
