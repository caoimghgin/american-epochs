  settled_by_editor:
  - The thread starts with Nixon, and its subject is the shift in the balance of power toward the executive. War-making and
    police actions are a different question, and belong in a separate thread.
  - Pardons are left out. They are a constitutional power of the office, even when abused, and are not a shift in the balance
    of power.
  - The thread includes presidents of both parties and activity done for either party.
  gaps:
    summary: 'Six events are not in any corpus yet, at Levels 3 to 5: the Frost interview, the 1973 Justice Department opinion,
      the 1974 impoundment law, the emergency statutes of 1976 and 1977, and three court rulings against Democratic-era actions
      (Noel Canning, the eviction moratorium, and the vaccine mandate). The members dropped are the war-powers items, Youngstown,
      the 1942 internment order, and all the pardons. The war-powers items are the natural start of a separate thread.'
    open_questions:
    - Whether to draft the war-powers thread, with the editor's postwar-position reading as its claim.
    - Whether a fourth thread, on political dirty tricks (Nixon's plumbers, the Brooks Brothers Riot, the 2016 leaks), belongs
      beside this one.
    - Whether Comey's firing and January 6 should be members. January 6 was dropped, as being about the transfer of power
      and not the balance among branches.
