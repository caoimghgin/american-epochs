# Threads — pilot draft. A thread is a named, ordered group of events with a claim about why they belong
# together. Threads are authored arguments, not part of the Level 1 spine, and an event may belong to
# several threads. Written by Claude as a first pass for the editor to overrule; nothing here is in the
# live instrument yet.
#
# Data model under test in this pilot:
#   id, title, claim (one sentence), summary (the story in a few sentences), register (factual | structural | argued), counter_reading, status
#   members[]: ref (an existing event id from a corpus), or proposed (a new event the thread needs, not in
#   any corpus yet), plus role (origin | link | culmination | consequence | context), link
#   (documented | contested | argued) and a one-line why_here.
#   `link` is the strength of this member's connection to the thread, separate from the thread's register.
#   The register of the thread as a whole is the weakest claim it makes in its own title.

version: 0

threads:
- id: al_qaedas_war
  title: Al-Qaeda's War
  claim: >-
    September 11 was the culmination of a campaign al-Qaeda publicly declared in 1996 and expanded in 1998.
  summary: >-
    The United States initially confronted that campaign through criminal prosecution, intelligence operations,
    and limited military force. After September 11, it launched a war that overthrew the Taliban government
    sheltering al-Qaeda. Twenty years later, American forces withdrew from Afghanistan, and the Taliban
    returned to power.
  register: factual
  register_note: >-
    The core chain (1996 declaration, 1998 fatwa, the embassy bombings, the Cole, September 11) is documented
    by the group's own statements and by indictments, and the 9/11 Commission narrates it. Two members
    (the 1993 bombing and Mogadishu) are marked contested below and kept, since they are what the thread
    argues about.
  counter_reading: >-
    Three objections. (1) The first World Trade Center bombing was planned by Ramzi Yousef, whose uncle
    Khalid Sheikh Mohammed later planned September 11, but whether it was an al-Qaeda operation is a matter of
    personnel and not of command, and the chain looks neater in retrospect than it did to those inside it.
    (2) The common story that American support for the mujahideen in the 1980s created al-Qaeda is contested,
    and bin Laden's own stated grievances do not rest on the Soviet war, so the thread leaves it out. (3) "War"
    was the post-2001 government's word. Before September 11 the response was a mix of indictments,
    covert action, and one round of missile strikes, and the choice of that mix is part of the story and
    not a settled label.
  endpoint: Open. The thread runs to the present, and its latest member is the August 2021 return of the Taliban, with the Afghanistan War span as the container.
  status: open
  see_also:
  - imperial_presidency   # the Patriot Act, Guantanamo, and the military commissions began here
  members:
  # --- origins
  - proposed: al_qaeda_founded
    start: 19880800
    date_precision: month
    suggested_level: 4
    suggested_epoch: morning_in_america
    title: Al-Qaeda Founded
    sketch: Bin Laden and associates form al-Qaeda. The month is from the 9/11 Commission narrative and needs a source check.
    role: origin
    link: documented
    why_here: The organization exists before any attack on the United States.
  - proposed: troops_in_saudi_arabia
    start: 19900807
    suggested_level: 4
    suggested_epoch: morning_in_america
    title: American Troops Deployed to Saudi Arabia
    sketch: Operation Desert Shield begins after Iraq invades Kuwait, stationing American forces in the kingdom that holds Mecca and Medina. It is the grievance bin Laden cites most in his 1996 declaration.
    role: origin
    link: documented
    why_here: Bin Laden's stated reason for the campaign against the United States.
  # --- the early attacks
  - corpus: end_of_history
    id: wtc_bombing_1993
    role: link
    link: contested
    why_here: A truck bomb under the North Tower kills six. Its planner is the nephew of the man who plans September 11, and the case is the model for the later treatment of such attacks as crimes.
    verify: Check how the 9/11 Commission Report describes the connection between Yousef's plot and al-Qaeda.
  - corpus: end_of_history
    id: mogadishu
    role: link
    link: contested
    why_here: Bin Laden later claimed his followers had trained Somali fighters, and he cited the American withdrawal as proof that the country would retreat. The extent of al-Qaeda's role in the battle is disputed.
    verify: Source the claim and the dispute before this member is kept.
  # --- the declared war
  - proposed: declaration_of_war_1996
    start: 19960823
    suggested_level: 4
    suggested_epoch: end_of_history
    title: Bin Laden's Declaration of War
    sketch: Bin Laden publishes a "Declaration of War against the Americans Occupying the Land of the Two Holy Places," calling for attacks on American forces in Arabia.
    role: link
    link: documented
    why_here: The campaign is announced in writing, five years before it reaches American soil.
  - proposed: fatwa_1998
    start: 19980223
    suggested_level: 4
    suggested_epoch: end_of_history
    title: The 1998 Fatwa
    sketch: Bin Laden and allied leaders issue a statement under the name of a "World Islamic Front" that declares it a duty to kill Americans, civilian and military.
    role: link
    link: documented
    why_here: The aim is extended to civilians, and the second public announcement precedes the embassy attacks by five months.
  - proposed: embassy_bombings_1998
    start: 19980807
    suggested_level: 2
    suggested_epoch: end_of_history
    title: The Embassy Bombings
    sketch: Truck bombs destroy the American embassies in Nairobi, Kenya, and Dar es Salaam, Tanzania, within minutes of each other, killing more than 220 people, most of them Africans, including twelve Americans.
    role: link
    link: documented
    why_here: The first attacks the United States attributes to al-Qaeda, tried in federal court and answered with missile strikes.
    verify: Confirm the death totals and the number of American dead.
  - proposed: sudan_afghanistan_strikes_1998
    start: 19980820
    suggested_level: 4
    suggested_epoch: end_of_history
    title: Cruise Missile Strikes on Sudan and Afghanistan
    sketch: The Clinton administration fires cruise missiles at a Khartoum factory and at training camps in Afghanistan in response to the embassy bombings. The Sudan target is later disputed.
    role: link
    link: documented
    why_here: The one military response before 2001, and the Taliban's first appearance in the thread's record.
  - proposed: millennium_plot_1999
    start: 19991214
    suggested_level: 5
    suggested_epoch: end_of_history
    title: The Millennium Plot
    sketch: A customs officer stops Ahmed Ressam at the Washington State border with explosives bound for Los Angeles International Airport.
    role: link
    link: documented
    why_here: A prevented attack, which shows the pattern was running ahead of the government's attention.
  - proposed: uss_cole_2000
    start: 20001012
    suggested_level: 3
    suggested_epoch: end_of_history
    title: USS Cole
    sketch: A boat bomb attacks the destroyer USS Cole in the port of Aden, Yemen, killing 17 American sailors.
    role: link
    link: documented
    why_here: The last attack before September 11, and the one the outgoing and incoming administrations decided not to answer.
    verify: Confirm that no military response followed, and the wording about the two administrations.
  - proposed: bin_ladin_pdb_2001
    start: 20010806
    suggested_level: 4
    suggested_epoch: end_of_history
