    link: documented
    why_here: Bin Laden escapes into Pakistan.
  - corpus: interregnum
    id: bin_laden
    role: consequence
    link: documented
    why_here: Killed nearly ten years later, in Pakistan, while the war in Afghanistan continues.
  - corpus: reckoning
    id: doha_agreement
    role: consequence
    link: documented
    why_here: The United States agrees with the Taliban, over the Afghan government's head, to leave.
  - corpus: reckoning
    id: fall_of_kabul
    role: consequence
    link: documented
    why_here: The host government that sheltered al-Qaeda returns to power as the last American troops leave.
  - corpus: reckoning
    id: last_flight_kabul
    role: consequence
    link: documented
    why_here: The span closes.
  - proposed: zawahiri_killed_2022
    start: 20220731
    suggested_level: 3
    suggested_epoch: reckoning
    title: Zawahiri Killed in Kabul
    sketch: An American drone strike kills Ayman al-Zawahiri, al-Qaeda's leader since bin Laden's death, at a house in Kabul. The strike takes place eleven months after the last troops left.
    role: consequence
    link: documented
    why_here: Shows the thread has not closed, because al-Qaeda's leader was living in the Taliban's capital.
    verify: Confirm the date, the location, and the interval since the withdrawal.
  gaps:
    summary: >-
      Eight events are not in any corpus yet, plus the 2022 Zawahiri strike. The embassy bombings and the Cole
      are the ones the thread cannot do without, since they are the links between 1993 and 2001. Each needs a
      source before it is added. The live array also needs an `id` per event so threads can refer to events.
    settled_by_editor:
    - The Soviet war and withdrawal are left out. Bin Laden's stated grievances do not rest on it.
    - The 1993 bombing and Mogadishu stay as contested members.
    - The thread is open and is not assumed to end in 2021. Tora Bora stays as a consequence, with Kabul after it.
    open_questions:
    - Whether Khobar Towers (1996) belongs. It is left out because the attribution is disputed and the group is not al-Qaeda, which would make it a different thread.

- id: disenchantment
  title: The Disenchantment
  claim: >-
    After the 2008 financial crisis, trust in the country's institutions collapsed on both the left and the
    right, and voters turned to outsiders who promised to break the system.
  summary: >-
    The crash exposed institutions that had failed to see it coming, and the government's response protected
    the banks that caused it while the households that owed the money carried the loss. The anger found two
    forms, the Tea Party and Occupy Wall Street, each aimed at a different part of the same arrangement.
    Neither became a governing alternative, and Congress and the parties kept failing to govern. In 2015 an
    outsider on each side declared for the presidency, and in 2016 one of them won. The loss of faith did not
    end with the election. It reached the count itself in 2020 and has not yet resolved.
  register: argued
  register_note: >-
    Every member is a documented event. The connections between them are interpretive. That the crash and the
    bailouts caused the Tea Party, Occupy, and Trump is a claim historians dispute, and the thread says so.
  counter_reading: >-
    Three objections. (1) The decline in trust began long before 2008. Public trust in the federal government
    has fallen since the 1960s, through Vietnam and Watergate, which this project's own Unravelling epoch
    treats as a break, so the crash accelerated a trend and did not start it. (2) The cause of the 2016 result
    is disputed. Economic grievance is one explanation, and racial and cultural resentment, partisan
    loyalty, and the weakness of the Clinton campaign are others, so the link from foreclosures to the Trump
    vote is the thread's weakest. (3) The loss of faith was not steady or even. Voters re-elected Obama in
    2012, four years after the crash, which is why that election is a member, as a counterweight.
  endpoint: Open. The latest member is the 2024 re-election, and the thread runs to the present.
  status: open
  see_also:
  - imperial_presidency
  members:
  # --- seeds: failures of the institutions before the crash
  - corpus: end_of_history
    id: bush_v_gore
    role: origin
    link: argued
    why_here: The Supreme Court decides a presidential election, and many voters on one side stop trusting the count.
  - corpus: end_of_history
    id: duelfer_report
    role: origin
    link: argued
    why_here: The weapons that justified the Iraq War are not found, and the government's account of itself is discredited.
  - corpus: end_of_history
    id: katrina
    role: origin
    link: argued
    why_here: The state fails visibly, in a major city, and the failure falls on those with the least.
  # --- the crash and the response
  - corpus: end_of_history
    id: housing_peak
    role: origin
    link: documented
    why_here: Prices start to fall, and the loans written on the assumption that they would not begin to default.
  - corpus: interregnum
    id: lehman_fails
    role: trigger
    link: documented
    why_here: The credit system seizes, and the institutions that were meant to prevent this did not see it coming.
  - corpus: interregnum
    id: tarp_signed
    role: trigger
    link: documented
    why_here: The banks are rescued on the order's terms, and the public's anger has its target.
  - corpus: interregnum
    id: obama_elected
    role: link
    link: documented
    why_here: Voters choose change in the middle of the collapse, and the change arrives inside the settlement it inherits.
  - corpus: interregnum
    id: hamp
    role: link
    link: documented
    why_here: The program meant to help households modify their mortgages reaches far fewer than promised.
  - corpus: interregnum
    id: aig_bonuses
    role: link
    link: documented
    why_here: A rescued firm pays bonuses to the people who caused its losses, and the outrage is bipartisan.
  # --- two forms of the same anger
  - corpus: interregnum
    id: santelli_rant
    role: link
    link: documented
    why_here: A television broadcast from the Chicago trading floor gives the Tea Party its name, as a protest against helping homeowners.
  - corpus: interregnum
    id: tea_party_wave
    role: link
    link: documented
    why_here: The anger on the right becomes votes, and the largest House swing since 1948.
  - corpus: interregnum
    id: occupy_wall_street
    role: link
    link: documented
    why_here: The anger on the left takes a different target, the banks, and has no electoral outlet.
  - corpus: interregnum
    id: too_big_to_jail
    role: link
    link: documented
    why_here: The attorney general says some banks are too large to prosecute, and the line becomes the era's shorthand.
  - proposed: congress_approval_2013
    start: 20131100
    date_precision: month
    suggested_level: 5
    suggested_epoch: interregnum
    title: Congress Approval Hits a Record Low
    sketch: Gallup reports that approval of Congress falls to 9 percent, the lowest in its polling.
    role: link
    link: documented
    why_here: The measure of the loss of faith reaches its floor, a month after a government shutdown.
    verify: Confirm the figure and the date against Gallup.
  - corpus: interregnum
    id: shutdown_2013
    role: link
    link: argued
    why_here: A faction of one party shuts the government down over the health-care law, and the institutions are seen failing to govern.
  - corpus: interregnum
    id: obama_reelected
    role: counterweight
    link: documented
    why_here: A majority re-elects the incumbent four years after the crash, so the disenchantment was neither universal nor linear.
  - proposed: cantor_defeat_2014
    start: 20140610
    suggested_level: 4
    suggested_epoch: interregnum
    title: Cantor Loses His Primary
    sketch: House Majority Leader Eric Cantor loses his Republican primary in Virginia to a Tea Party challenger, the first time a majority leader has lost a primary.
    role: link
