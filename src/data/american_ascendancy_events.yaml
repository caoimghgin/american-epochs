schema:
  name: American Epochs Event Corpus
  version: 2
  date_format: YYYYMMDD
  level_definition:
    1: The epoch's "crown of the mountain" — always visible, at every zoom, from the very widest view. One beat
      per structural hinge in the epoch's own arc, not a list of "the important stuff." Target 5-8 entries regardless
      of how large or eventful the epoch was; see curation_guidance below. Automatically revealed first as the viewer
      zooms in from full history — never a manual toggle.
    2: Major events, automatically revealed at the first closer zoom past Level 1.
    3: Supporting events explaining mechanisms, shifts, and consequences.
    4: Contextual events — political, military, social, institutional texture.
    5: Fine-grained events for the closest inspection.
  curation_guidance:
  - Level 1 is the hardest and most important editorial call in the corpus. The viewer never chooses to see it —
    it is what everyone sees whether they zoom in or not, so it carries the whole epoch's argument on its own.
  - Pick one entry per point where the epoch's own arc genuinely turns, not one per famous name or battle. A working
    test - "does removing this entry break the causal chain from the epoch's start to its end?" If not, it belongs
    at Level 2 or below, however well-known it is.
  - Target 5-8 Level 1 point events specifically. This is deliberately independent of the epoch's total event count
    or length in years. Reconstruction intentionally carries nine point events because the Panic of 1873 and United
    States v. Cruikshank describe distinct political and judicial turns and the editor has approved a slightly crowded
    crown.
  - Span (duration) entries at Level 1 do not count against the point-event target because the live instrument never
    tier-filters spans; they provide scene-setting context.
  - Levels 2-5 have much more room to breathe. Disagreement there is a rounding error, not a structural problem.
    Spend the real editorial effort on Level 1.
  notes:
  - A missing end date indicates a point event.
  - Dates represent the most defensible public date for display, not necessarily every stage of a legal or political
    process.
  - date_precision (year or month) applies to start, and end_precision (month) to the end of a range. Where set, the
    placeholder in the date field must not be rendered as exact. Absent means a full day-level date. date_verified
    true means the date was confirmed against an identifiable source.
  - This corpus is a research/authoring artifact. A human or LLM reconciles it into the live EVENTS array.
  - Levels were assigned by Claude as a first-pass editorial judgment (see american_ascendancy_outline.md for the Level 1
    reasoning). All dates are drafted from memory and none are yet source-verified, so verify before treating as
    settled. No source URLs are included, per the guide's rule against unverifiable citations. Figures to check first
    include Lend-Lease's total (about $50 billion), the Marshall Plan's total (about $13 billion), the 1946 strike
    total (4.6 million), and war casualty counts.
  - Level 1 carries nine point events, not the usual five to eight. The Truman Doctrine, the Marshall Plan, and NATO are
    three distinct mechanisms of the same Cold War structure (the commitment in ideas, in money, and in an institution).
    NATO was promoted to Level 1 in review by Kevin. If the crown needs to return to eight, the Truman Doctrine is the one
    to demote.
  - Three spans. world_war_ii replaces the span already in the live instrument. korean_war (1950-06-25 to 1953-07-27)
    crosses the epoch end by seven months. cold_war (1947-03-12 to 1991-12-26) is owned by this corpus because it begins
    here, crosses four later epoch boundaries by design, and is the first cross-epoch element in the instrument. The End
    of History corpus must carry the dissolution of the Soviet Union as its end event.
  - midway, yalta, the Casablanca conference, and the Berlin airlift are recorded with true ranges but are under two
    years, so they reconcile as point events at their end dates.
  - Internment (executive_order_9066) stays at Level 2, a decision made in review. The price at home is carried at Level 2
    with Executive Order 9981, Shelley v. Kraemer, and McCarthy's Wheeling speech.
  - Boundary decisions. The corpus opens on 1941-01-01 and follows the New Deal corpus, which closes at the end of 1940.
    It closes on 1952-12-31, with Eisenhower's election as the closing Level 1 beat. His inauguration and the Korean
    armistice open the Affluent Society.
epoch:
  id: american_ascendancy
  title: The American Ascendancy
  start: 19410101
  end: 19521231
  thesis: The New Deal state, built to govern an economy, turns outward. Lend-Lease makes the United States the arsenal and
    creditor of the Allies before it fights, and Pearl Harbor brings two wars. Wartime mobilization ends the Depression, Bretton
    Woods makes the dollar the world's reserve currency, and the atomic bombs end the Pacific war and begin a new kind of power.
    From 1947 the Truman Doctrine, the Marshall Plan, and NATO build an alliance system that other countries join by
    invitation, and containment turns a competition for power into a contest of ideas that will last for decades. At home the
    New Deal consensus holds, the GI Bill builds a middle class, and Truman desegregates the military, while a second Red Scare,
    a limited war in Korea, and the exclusion of Black veterans from much of the benefit show the cost. The era ends with the
    election of a Republican general who will not repeal the New Deal.
events:
# ---------------------------------------------------------------- Level 1: spans
- id: world_war_ii
  start: 19411207
  end: 19450902
  level: 1
  kind: war
  title: World War II
  description_short: The crucible in which American hegemony was forged.
  description_long: The United States fights in Europe and the Pacific at once from December 7, 1941 to the Japanese surrender on
    September 2, 1945. About 16 million Americans serve, and about 400,000 die.
  why: It ends the Depression, mobilizes the economy and the state at unprecedented scale, and leaves the United States as the
    strongest power on earth.
  tags:
  - war
  - mobilization
  - hegemony
- id: cold_war
  start: 19470312
  end: 19911226
  level: 1
  kind: geopolitical_period
  title: Cold War
  description_short: Forty-four years of ideological and strategic rivalry between the United States and the Soviet Union.
  description_long: The span runs from the Truman Doctrine on March 12, 1947 to the dissolution of the Soviet Union on December 26,
    1991. It is fought through alliances, arms races, proxy wars, and competing models of political economy, and it crosses
    five epochs of this project. It is owned by this corpus because it begins here, and the End of History corpus carries its
    ending.
  why: It is the ideological contest that organizes American foreign policy for two generations, and the frame that holds
    four epochs together.
  tags:
  - cold-war
  - soviet-union
  - containment
- id: korean_war
  start: 19500625
  end: 19530727
  level: 1
  kind: war
  title: Korean War
  description_short: A three-year limited war on the Korean peninsula ends in a stalemate and an armistice.
  description_long: American and UN forces fight North Korea and then China from June 25, 1950 to the armistice on July 27, 1953.
    About 36,000 Americans die. The span crosses the epoch boundary by seven months, a deliberate exception.
  why: It is the Cold War's first hot war, and it shows the limits of containment and its cost at home.
  tags:
  - korea
  - limited-war
  - cold-war
# ---------------------------------------------------------------- Level 1: points
- id: lend_lease_act
  start: 19410311
  level: 1
  kind: legislation
  title: Lend-Lease
  description_short: Congress authorizes the president to supply war materiel to nations whose defense is vital to the United States.
  description_long: The program provides about $50 billion in aid to Britain, the Soviet Union, China, and others. Britain pays in
    part by selling off overseas assets and trade preferences, which accelerates the end of its empire.
  why: It is the structural pivot. The United States becomes creditor and arsenal of the Allies before it fights.
  tags:
  - lend-lease
  - britain
  - arsenal
- id: pearl_harbor
  start: 19411207
  level: 1
  kind: war
  title: Pearl Harbor
  description_short: Japan attacks the U.S. Pacific Fleet in Hawaii, and Congress declares war the next day.
  description_long: About 2,400 Americans die, and Germany and Italy declare war on the United States on December 11.
  why: It brings two wars at once and ends the isolationist argument.
  tags:
  - japan
  - war
  - hawaii
- id: bretton_woods
  start: 19440722
  level: 1
  kind: diplomacy
  title: Bretton Woods
  description_short: Forty-four nations agree to peg their currencies to the dollar, which is convertible to gold at $35 an ounce.
  description_long: The conference creates the International Monetary Fund and the World Bank. The United States holds about two
    thirds of the world's monetary gold, and its dollar becomes the reserve currency.
  why: It is the monetary expression of American leadership, the financial architecture of the American century.
  tags:
  - bretton-woods
  - dollar
  - gold
- id: hiroshima
  start: 19450806
  level: 1
  kind: war
  title: Hiroshima
  description_short: The United States drops an atomic bomb on Hiroshima, and another on Nagasaki three days later.
  description_long: The bombs kill well over 100,000 people, and Japan announces its surrender on August 15. The Manhattan Project
    had cost about $2 billion and employed about 130,000 people.
  why: It ends the Pacific war and begins a new kind of power, with a moral debate that does not end.
  tags:
  - atomic-bomb
  - japan
  - war
- id: truman_doctrine
  start: 19470312
  level: 1
  kind: speech
  title: Truman Doctrine
  description_short: Truman asks Congress for aid to Greece and Turkey and pledges support for free peoples resisting subjugation.
  description_long: Britain can no longer sustain its commitments in the eastern Mediterranean. Truman frames the choice as one
    between two ways of life, and Congress approves $400 million.
  why: It is the commitment in the language of an ideological contest, and the start of containment.
  tags:
  - containment
  - greece
  - ideology
- id: marshall_plan
  start: 19480403
  level: 1
  kind: legislation
  title: Marshall Plan
  description_short: Truman signs the Economic Cooperation Act, committing about $13 billion to rebuild Western Europe.
  description_long: Secretary of State George Marshall had proposed the program in a June 1947 speech at Harvard. The aid is offered
    to the Soviet bloc too, which declines. It runs through 1952.
  why: It is the instrument of leadership, aid, not conquest, which rebuilds allies and ties them to American economic design.
  tags:
  - marshall-plan
  - europe
  - aid
- id: nato
  start: 19490404
  level: 1
  kind: treaty
  title: NATO
  description_short: Twelve nations sign the North Atlantic Treaty, a collective defense alliance.
  description_long: The treaty is the first peacetime military alliance the United States has joined since the 1778 alliance with
    France. An attack on one member is an attack on all.
  why: It makes the commitment permanent and the American role in Europe structural.
  tags:
  - nato
  - alliance
  - europe
- id: north_korea_invades
  start: 19500625
  level: 1
  kind: war
  title: North Korea Invades South Korea
  description_short: North Korean forces cross the 38th parallel, and Truman commits American forces within days.
  description_long: Truman acts without a congressional declaration and under UN authority. The attack comes after the Soviet bomb
    and the fall of China, and the administration reads it as a test of containment.
  why: It makes the Cold War hot and begins the limited-war politics that will follow.
  tags:
  - korea
  - containment
  - war
- id: eisenhower_elected
  start: 19521104
  level: 1
  kind: election
  title: Eisenhower Elected
  description_short: Dwight Eisenhower wins in a landslide, ending twenty years of Democratic control of the presidency.
  description_long: Eisenhower promises to go to Korea and end the war, and he carries 39 states. He will accept the New Deal's
    structure while changing its tone.
  why: It is the opposition party's acceptance of the New Deal frame, which closes this epoch and opens the next.
  tags:
  - election
  - eisenhower
  - ratification
# ---------------------------------------------------------------- Level 2
- id: fepc_established
  start: 19410625
  level: 2
  kind: policy
  title: Executive Order 8802 and the FEPC
  description_short: Roosevelt bans discrimination in defense industries after A. Philip Randolph threatens a march on Washington.
  description_long: The Fair Employment Practices Committee is the first federal anti-discrimination agency since Reconstruction.
    It has little enforcement power.
  why: It is the first federal step on the question's second clause in this epoch, achieved by Black organizing and the pressure of war.
  tags:
  - race
  - employment
  - randolph
- id: executive_order_9066
  start: 19420219
  level: 2
  kind: policy
  title: Japanese American Internment
  description_short: Executive Order 9066 authorizes the removal of about 120,000 people of Japanese descent from the West Coast.
  description_long: About two thirds are U.S. citizens, and they are held in camps for most of the war. The Supreme Court upholds
    the policy in Korematsu (1944). Congress apologizes and pays redress in 1988.
  why: It is the clearest case of the question's second clause, the country fighting for freedom abroad while denying it at home.
  tags:
  - internment
  - japanese-americans
  - civil-liberties
- id: battle_of_midway
  start: 19420604
  end: 19420607
  level: 2
  kind: military
  title: Battle of Midway
  description_short: U.S. carrier aircraft sink four Japanese carriers, turning the Pacific war.
  description_long: The victory, six months after Pearl Harbor, ends Japan's offensive momentum.
  why: It marks the turn in the Pacific, and the arsenal's output beginning to tell.
  tags:
  - pacific
  - navy
  - turning-point
- id: d_day
  start: 19440606
  level: 2
  kind: military
  title: D-Day
  description_short: Allied forces land in Normandy in the largest amphibious invasion in history.
  description_long: About 156,000 troops cross the Channel on the first day, and the Western Front opens.
  why: It is the decisive Western campaign, and the American army fighting as the leading Allied force.
  tags:
  - normandy
  - europe
  - invasion
- id: gi_bill
  start: 19440622
  level: 2
  kind: legislation
  title: GI Bill
  description_short: Congress offers veterans education benefits, home and business loans, and unemployment pay.
  description_long: About half of all veterans use the education benefits, and millions buy homes with GI loans. Local administration
    and bank practice exclude many Black veterans from the benefits.
  why: It is the empirical basis of the next epoch's affluence and the program through which exclusion works.
  tags:
  - veterans
  - education
  - housing
- id: fdr_dies
  start: 19450412
  level: 2
  kind: political_event
  title: Roosevelt Dies
  description_short: Roosevelt dies in Warm Springs, Georgia, and Harry Truman becomes president.
  description_long: Truman knows almost nothing of the atomic bomb project or of the diplomacy of the alliance.
  why: It passes the New Deal's leadership to a successor who will carry its institutions into the Cold War.
  tags:
  - roosevelt
  - truman
  - succession
- id: un_charter_senate
  start: 19450728
  level: 2
  kind: treaty
  title: Senate Approves the UN Charter
  description_short: The Senate approves the United Nations Charter 89 to 2.
  description_long: The vote comes less than twenty-six years after the Senate rejected the League of Nations, and the United
    States hosts the new body in New York.
  why: It reverses the New Freedom's failure, with the country embracing the international role it had refused.
  tags:
  - united-nations
  - senate
  - internationalism
- id: taft_hartley
  start: 19470623
  level: 2
  kind: legislation
  title: Taft–Hartley Act
  description_short: Congress overrides Truman's veto to restrict unions' tactics and let states ban the union shop.
  description_long: The act bans closed shops, secondary boycotts, and requires union officers to swear non-communist oaths.
  why: It is the conservative coalition's first major curb on the Wagner Act, the limit on labor inside the settlement.
  tags:
  - labor
  - unions
  - conservative-coalition
- id: national_security_act
  start: 19470726
  level: 2
  kind: legislation
  title: National Security Act
  description_short: Congress creates the Department of Defense, the CIA, and the National Security Council.
  description_long: The act unifies the military services and builds the permanent machinery of a national security state.
  why: It is the institutional form of the Cold War at home, a standing apparatus for a permanent contest.
  tags:
  - national-security
  - cia
  - institutions
- id: shelley_v_kraemer
  start: 19480503
  level: 2
  kind: court_case
  title: Shelley v. Kraemer
  description_short: The Supreme Court holds that courts cannot enforce racially restrictive housing covenants.
  description_long: The ruling is unanimous. Private discrimination continues through other devices, including federal lending
    guidelines.
  why: It is a landmark on the rights thread, limited by the housing system the New Deal built.
  tags:
  - housing
  - race
  - supreme-court
- id: executive_order_9981
  start: 19480726
  level: 2
  kind: policy
  title: Executive Order 9981
  description_short: Truman orders the desegregation of the armed forces.
  description_long: Implementation is slow, and the Army is not fully integrated until the Korean War. Truman acts after Congress
    declines civil rights legislation.
  why: It is the first presidential step toward desegregation, driven by the Cold War's need to answer Soviet propaganda.
  tags:
  - race
  - military
  - truman
- id: berlin_airlift
  start: 19480624
  end: 19490512
  level: 2
  kind: military
  title: Berlin Blockade and Airlift
  description_short: The Soviet Union blockades West Berlin, and the Allies supply the city by air for nearly a year.
  description_long: The airlift flies more than 2 million tons of supplies into the city. The Soviets lift the blockade on May 12, 1949.
  why: It is the first test of containment in Europe, won without a shot.
  tags:
  - berlin
  - cold-war
  - airlift
- id: soviet_atomic_bomb
  start: 19490829
  level: 2
  kind: military
  title: Soviet Union Tests an Atomic Bomb
  description_short: The Soviet Union detonates its first atomic device years ahead of American estimates.
  description_long: The test ends the American atomic monopoly and prompts the decision to build a hydrogen bomb.
  why: It ends the sense that the contest is not close, and begins the arms race.
  tags:
  - atomic-bomb
  - soviet-union
  - arms-race
- id: mccarthy_wheeling_speech
  start: 19500209
  level: 2
  kind: speech
  title: McCarthy's Wheeling Speech
  description_short: Senator Joseph McCarthy claims to hold a list of communists in the State Department.
  description_long: The speech in Wheeling, West Virginia launches the senator's campaign and the period named for him. No list
    is ever produced.
  why: It is the domestic price of the Cold War, anticommunism turned into a weapon against fellow citizens.
  tags:
  - mccarthyism
  - anticommunism
  - red-scare
# ---------------------------------------------------------------- Level 3
- id: four_freedoms
  start: 19410106
  level: 3
  kind: speech
  title: Four Freedoms Speech
  description_short: Roosevelt names four freedoms (of speech, of worship, from want, and from fear) as the aims of the democracies.
  description_long: The speech frames Lend-Lease before Congress and the war's moral purpose.
  why: It sets out the rights language that the Cold War, and the country's critics, will later hold it to.
  tags:
  - freedoms
  - roosevelt
  - rights
- id: american_century
  start: 19410217
  level: 3
  kind: intellectual
  title: Luce's American Century
  description_short: Henry Luce's Life essay urges Americans to accept the role of "the most powerful and vital nation in the world."
  description_long: The essay appears a month before Lend-Lease passes. Luce argues that the century should be American.
  why: It names the era, and states the ambition before the power exists.
  tags:
  - luce
  - leadership
  - ideology
- id: atlantic_charter
  start: 19410814
  level: 3
  kind: diplomacy
  title: Atlantic Charter
  description_short: Roosevelt and Churchill issue a joint statement of war aims, including self-determination and freedom of trade.
  description_long: The principles become the basis of the postwar order and later of the UN, and imply the end of colonial empires.
  why: It is the first statement of the postwar vision, American principles in an Anglo-American text.
  tags:
  - churchill
  - war-aims
  - self-determination
- id: war_production_board
  start: 19420116
  level: 3
  kind: institution
  title: War Production Board
  description_short: Roosevelt creates the board that converts American industry to war production.
  description_long: Automakers stop building cars, and the economy produces about two thirds of the Allies' munitions.
  why: It is the mobilization of the arsenal, the New Deal state turned to production at scale.
  tags:
  - production
  - mobilization
  - industry
- id: manhattan_project
  start: 19420813
  level: 3
  kind: science
  title: Manhattan Project Begins
  description_short: The Army creates the Manhattan Engineer District to build an atomic bomb.
  description_long: The project grows from the Einstein letter and the earlier research committees into a vast secret enterprise.
  why: It is the largest government science project in history, and the origin of a new instrument of power.
  tags:
  - atomic-bomb
  - science
  - secrecy
- id: smith_v_allwright
  start: 19440403
  level: 3
  kind: court_case
  title: Smith v. Allwright
  description_short: The Supreme Court strikes down the white primary in the South.
  description_long: The decision opens the Democratic primaries to Black voters in states that had barred them.
  why: It is a first judicial crack in the post-Reconstruction political system.
  tags:
  - voting-rights
  - race
  - supreme-court
- id: korematsu
  start: 19441218
  level: 3
  kind: court_case
  title: Korematsu v. United States
  description_short: The Supreme Court upholds the exclusion of Japanese Americans from the West Coast, 6–3.
  description_long: The decision is repudiated in later decades. Justice Robert Jackson's dissent warns of the weapon the ruling leaves.
  why: It confirms the internment in constitutional law.
  tags:
  - internment
  - supreme-court
  - civil-liberties
- id: yalta_conference
  start: 19450204
  end: 19450211
  level: 3
  kind: diplomacy
  title: Yalta Conference
  description_short: Roosevelt, Churchill, and Stalin plan the end of the war and the shape of postwar Europe.
  description_long: The agreements on Poland and Soviet entry into the Pacific war become subjects of later controversy.
  why: It is the high point of the wartime alliance, and the origin of postwar disputes.
  tags:
  - yalta
  - stalin
  - diplomacy
- id: un_charter_signed
  start: 19450626
  level: 3
  kind: treaty
  title: UN Charter Signed
  description_short: Fifty nations sign the United Nations Charter in San Francisco.
  description_long: The Security Council gives the great powers a veto.
  why: It is the League's successor, with the United States as host and sponsor.
  tags:
  - united-nations
  - charter
  - internationalism
- id: trinity_test
  start: 19450716
  level: 3
  kind: science
  title: Trinity Test
  description_short: The first atomic bomb is detonated in the New Mexico desert.
  description_long: J. Robert Oppenheimer and the scientists at Los Alamos watch the first nuclear explosion.
  why: It proves the weapon on which the postwar power rests.
  tags:
  - atomic-bomb
  - new-mexico
  - science
- id: nagasaki
  start: 19450809
  level: 3
  kind: war
  title: Nagasaki
  description_short: The United States drops a second atomic bomb, on Nagasaki.
  description_long: The Soviet Union declares war on Japan the same day.
  why: It completes the nuclear attack that ends the war.
  tags:
  - atomic-bomb
  - japan
  - war
- id: japan_surrender
  start: 19450902
  level: 3
  kind: war
  title: Japan Surrenders
  description_short: Japan signs the surrender aboard the USS Missouri in Tokyo Bay.
  description_long: Douglas MacArthur begins the American occupation, which lasts until 1952.
  why: It ends the war and begins the occupation that remakes Japan.
  tags:
  - japan
  - surrender
  - occupation
- id: imf_world_bank_founded
  start: 19451227
  level: 3
  kind: institution
  title: IMF and World Bank Established
  description_short: The International Monetary Fund and the World Bank come into being with the ratification of the Bretton Woods agreements.
  description_long: The two institutions are headquartered in Washington and shaped by American votes.
  why: It builds the financial institutions of the American-led order.
  tags:
  - imf
  - world-bank
  - institutions
- id: long_telegram
  start: 19460222
  level: 3
  kind: diplomacy
  title: Kennan's Long Telegram
  description_short: George Kennan sends a telegram from Moscow arguing for firm, patient containment of Soviet power.
  description_long: The message reshapes Washington's view of the Soviet Union and is the intellectual source of containment.
  why: It is the strategic idea behind the Cold War.
  tags:
  - kennan
  - containment
  - soviet-union
- id: iron_curtain_speech
  start: 19460305
  level: 3
  kind: speech
  title: Iron Curtain Speech
  description_short: Winston Churchill warns in Missouri that an "iron curtain" has descended across Europe.
  description_long: Truman sits on the platform. The speech gives the divided Europe a name.
  why: It publicly frames the rift.
  tags:
  - churchill
  - cold-war
  - europe
- id: employment_act_1946
  start: 19460220
  level: 3
  kind: legislation
  title: Employment Act of 1946
  description_short: Congress commits the federal government to promote maximum employment and creates the Council of Economic Advisers.
  description_long: The act weakens the original bill's full-employment guarantee but makes economic management a federal duty.
  why: It writes the New Deal's responsibility for the economy into permanent law.
  tags:
  - employment
  - economics
  - keynes
- id: postwar_strike_wave
  start: 19460101
  level: 3
  kind: strike
  title: Postwar Strike Wave
  description_short: About 4.6 million workers strike in 1946, the largest strike year in American history.
  description_long: The strikes in steel, autos, coal, and railroads follow the end of wartime wage controls and set up the Taft–Hartley
    backlash. Date is year-level (1946).
  why: It is the labor push that provokes the conservative coalition's response.
  tags:
  - labor
  - strikes
  - reconversion
  date_precision: year
- id: philippine_independence
  start: 19460704
  level: 3
  kind: political_event
  title: Philippine Independence
  description_short: The United States grants the Philippines independence on schedule, as promised in 1934.
  description_long: The islands' independence begins on July 4, 1946, with American military bases and trade ties preserved.
  why: It closes the empire thread begun in 1898, one of the few voluntary unwindings of an imperial possession.
  tags:
  - philippines
  - empire
  - independence
- id: atomic_energy_act
  start: 19460801
  level: 3
  kind: legislation
  title: Atomic Energy Act
  description_short: Congress places atomic energy under a civilian commission.
  description_long: The act establishes the Atomic Energy Commission and civilian control of nuclear weapons.
  why: It settles who controls the new weapon.
  tags:
  - atomic-energy
  - civilian-control
  - congress
- id: jackie_robinson
  start: 19470415
  level: 3
  kind: cultural
  title: Jackie Robinson Breaks the Color Line
  description_short: Jackie Robinson debuts for the Brooklyn Dodgers, the first Black player in the major leagues in the modern era.
  description_long: Robinson endures abuse and becomes a national symbol. The integration of baseball precedes the military's.
  why: It is the most visible early breach of segregation in American life.
  tags:
  - race
  - baseball
  - integration
- id: loyalty_program
  start: 19470321
  level: 3
  kind: policy
  title: Federal Loyalty Program
