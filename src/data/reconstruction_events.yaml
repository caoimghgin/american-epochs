  - western-expansion
  end: 18730601
- id: polaris_failure
  start: 18730918
  level: 4
  kind: financial_failure
  title: Jay Cooke & Company Fails
  description_short: The leading financier of the Northern Pacific Railroad suspends payments.
  description_long: The failure closes markets and triggers panic across banks and exchanges.
