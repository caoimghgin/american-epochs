schema:
  name: American Epochs Event Corpus
  version: 2
  date_format: YYYYMMDD
  level_definition:
    1: The epoch's "crown of the mountain" — always visible, at every zoom, from the very widest view. One beat
      per structural hinge in the epoch's own arc, not a list of "the important stuff." Target 5-8 entries regardless
      of how large or eventful the epoch was; see curation_guidance below. Automatically revealed first as the viewer
      zooms in from full history — never a manual toggle.
    2: Major events, automatically revealed at the first closer zoom past Level 1.
    3: Supporting events explaining mechanisms, shifts, and consequences.
    4: Contextual events — political, military, social, institutional texture.
    5: Fine-grained events for the closest inspection.
  curation_guidance:
  - Level 1 is the hardest and most important editorial call in the corpus. The viewer never chooses to see it —
    it is what everyone sees whether they zoom in or not, so it carries the whole epoch's argument on its own.
  - Pick one entry per point where the epoch's own arc genuinely turns, not one per famous name or battle. A working
    test - "does removing this entry break the causal chain from the epoch's start to its end?" If not, it belongs
    at Level 2 or below, however well-known it is.
  - Target 5-8 Level 1 point events specifically. This is deliberately independent of the epoch's total event count
    or length in years. Reconstruction intentionally carries nine point events because the Panic of 1873 and United
    States v. Cruikshank describe distinct political and judicial turns and the editor has approved a slightly crowded
    crown.
  - Span (duration) entries at Level 1 do not count against the point-event target because the live instrument never
    tier-filters spans; they provide scene-setting context.
  - Levels 2-5 have much more room to breathe. Disagreement there is a rounding error, not a structural problem.
    Spend the real editorial effort on Level 1.
  notes:
  - A missing end date indicates a point event.
  - Dates represent the most defensible public date for display, not necessarily every stage of a legal or political
    process.
  - This corpus is a research/authoring artifact. A human or LLM reconciles it into the live EVENTS array.
  - The hierarchy supplies the big picture first and progressively reveals explanations, mechanisms, consequences,
    and texture.
  - One correction made during reconciliation - compromise_of_1877 and congressional_reconstruction both originally
    ended 1877-03-31 ("by the end of March"), but this corpus's own more granular entries (south_carolina_troops_withdrawn,
    louisiana_troops_withdrawn) correctly show South Carolina on April 10 and Louisiana, the last state, on April 24.
    Both entries now end 1877-04-24 for internal consistency with the corpus's own detail.
  - presidential_reconstruction (1865-04-15 to 1867-03-02, 1.88 years) is kept as a Level 1 span alongside
    congressional_reconstruction despite falling about six weeks short of the ~2-year span/point threshold - it is
    the same kind of entry (a named political period, not a campaign or crisis with a discrete resolution), and
    splitting two structurally identical phase-markers into different render types would be an arbitrary result of
    a mechanical rule applied without judgment.
  - Duration alone is necessary but not sufficient for span treatment. Kevin caught this directly after reviewing
    the live render - five entries technically cleared the 2-year threshold (freedmens_bureau_extended,
    freedmans_savings_bank, union_league_mobilization, public_education_reconstruction, knights_of_white_camelia)
    but didn't earn the Duration strip's permanent, always-on real estate the way the outline's own four intended
    "long-running conditions" (Presidential Reconstruction, Congressional Reconstruction, organized white terror,
    sharecropping) do - they read as institutional facts that happen to have a date range, not background
    conditions the whole epoch turns on. Reconciled instead as point events (or, for the Freedman's Savings Bank,
    folded into its existing "Fails" entry rather than adding a second one) - see reconstruction_outline.md's own
    "Long-running conditions" line, which named only four all along. The two Knights-of-White-Camelia and
    White-League entries both nominally represent "organized white terror" from the outline's list; only White
    League Organizes stays a span, since it has the clearest direct ties to already-recorded violence (Coushatta,
    Vicksburg, Battle of Liberty Place) - Knights of the White Camelia becomes a point event at its founding instead.
epoch:
  id: reconstruction
  title: Reconstruction
  start: 18650415
  end: 18770424
  thesis: The Civil War destroys slavery, and Reconstruction remakes the constitutional nation around national citizenship
    and federal protection of individual rights. Congress briefly constructs and defends a biracial republic, but
    economic crisis, organized white violence, judicial retreat, and political compromise end sustained enforcement
    while the constitutional transformation survives.
events:
- id: presidential_reconstruction
  start: 18650415
  level: 1
  kind: political_period
  title: Presidential Reconstruction
  description_short: Andrew Johnson directs rapid restoration of the former Confederate states.
  description_long: Johnson offers broad pardons and permits Southern states to reorganize with limited federal
    conditions. The restored governments accept abolition but resist broader civil and political equality.
  why: It establishes the inadequate settlement that provokes congressional intervention.
  tags:
  - andrew-johnson
  - restoration
  - federalism
  end: 18670302
- id: thirteenth_amendment_ratified
  start: 18651206
  level: 1
  kind: constitutional_amendment
  title: Thirteenth Amendment Ratified
  description_short: The Constitution abolishes slavery throughout the United States.
  description_long: Ratification prohibits slavery and involuntary servitude except as punishment for crime and
    gives Congress enforcement power.
  why: It destroys the legal foundation of the old order and creates the unresolved question of what freedom will
    mean.
  tags:
  - constitution
  - slavery
  - emancipation
  sources:
  - name: National Archives
    url: https://www.archives.gov/milestone-documents
- id: civil_rights_act_1866
  start: 18660409
  level: 1
  kind: legislation
  title: Civil Rights Act of 1866
  description_short: Congress establishes national citizenship and equal civil rights.
  description_long: Congress overrides Andrew Johnson's veto and declares people born in the United States citizens
    without regard to race, while protecting basic rights of contract, property, and legal process.
  why: The nation claims authority to protect citizenship against hostile state governments.
  tags:
  - citizenship
  - civil-rights
  - congress
  sources:
  - name: U.S. Senate Historical Office
    url: https://www.senate.gov/history/CivilWar_chronology.htm
- id: first_reconstruction_act
  start: 18670302
  level: 1
  kind: legislation
  title: First Reconstruction Act
  description_short: Congress places most former Confederate states under military Reconstruction.
  description_long: The act divides ten Southern states into five military districts and requires new constitutions,
    Black male suffrage, and ratification of the Fourteenth Amendment for readmission.
  why: Congress replaces rapid restoration with a federally supervised reconstruction of Southern government.
  tags:
  - reconstruction-acts
  - military
  - readmission
  sources:
  - name: U.S. Senate Historical Office
    url: https://www.senate.gov/history/CivilWar_chronology.htm
- id: congressional_reconstruction
  start: 18670302
  level: 1
  kind: political_period
  title: Congressional Reconstruction
  description_short: Congress directs the reconstruction and readmission of the former Confederacy.
  description_long: Military supervision, constitutional conventions, new electorates, and federal enforcement sustain
    reconstructed governments until national commitment retreats.
  why: It is the period in which the constitutional promise is translated into governing institutions.
  tags:
  - congress
  - military
  - southern-governments
  end: 18770424
- id: fourteenth_amendment_ratified
  start: 18680709
  level: 1
  kind: constitutional_amendment
  title: Fourteenth Amendment Ratified
  description_short: Birthright citizenship, due process, and equal protection become constitutional guarantees.
  description_long: The amendment makes national citizenship independent of state recognition and authorizes Congress
    to enforce its protections.
  why: It fundamentally changes the relationship between the individual, the states, and the nation.
  tags:
  - constitution
  - citizenship
  - equal-protection
  sources:
  - name: National Archives
    url: https://www.archives.gov/milestone-documents/14th-amendment
- id: fifteenth_amendment_ratified
  start: 18700203
  level: 1
  kind: constitutional_amendment
  title: Fifteenth Amendment Ratified
  description_short: The Constitution prohibits racial discrimination in voting.
  description_long: The amendment bars the United States and the states from denying the vote because of race, color,
    or previous condition of servitude.
  why: It makes Black male political participation a constitutional commitment rather than a temporary condition
    of readmission.
  tags:
  - constitution
  - voting-rights
  - suffrage
  sources:
  - name: National Archives
    url: https://www.archives.gov/research/african-americans/vote/laws-and-courts
- id: ku_klux_klan_act
  start: 18710420
  level: 1
  kind: legislation
  title: Ku Klux Klan Act
  description_short: Congress authorizes federal action against conspiracies that destroy civil and political rights.
  description_long: The third Enforcement Act permits federal prosecution, military intervention, and suspension
    of habeas corpus in extraordinary circumstances. Grant uses it against the Klan in South Carolina.
  why: It marks the high-water point of federal willingness to defend Reconstruction by force.
  tags:
  - enforcement
  - kkk
  - federal-power
  sources:
  - name: National Archives
    url: https://www.archives.gov/research/african-americans/vote/laws-and-courts
- id: panic_of_1873
  start: 18730918
  level: 1
  kind: economic_crisis
  title: Panic of 1873
  description_short: A financial collapse begins a severe and prolonged depression.
  description_long: The failure of Jay Cooke and Company helps trigger bank failures, unemployment, and years of
    economic distress, redirecting Northern attention away from Reconstruction.
  why: Economic crisis weakens the political capacity and public appetite required to sustain federal intervention
    in the South.
  tags:
  - economy
  - depression
  - northern-politics
- id: united_states_v_cruikshank
  start: 18760327
  level: 1
  kind: court_case
  title: United States v. Cruikshank
  description_short: The Supreme Court overturns federal convictions arising from the Colfax Massacre.
  description_long: The Court rules that the Fourteenth Amendment constrains state action rather than purely private
    violence and narrows federal power under the Enforcement Acts.
  why: Judicial doctrine disables a central means of protecting citizens when states refuse to act.
  tags:
  - supreme-court
  - fourteenth-amendment
  - enforcement
- id: compromise_of_1877
  start: 18770302
  level: 1
  kind: political_settlement
  title: Compromise of 1877
  description_short: The disputed presidential election is settled as federal protection of Southern Republican
    governments ends.
  description_long: Hayes takes office after an electoral commission awards him the contested votes. The administration
    withdraws remaining troops from South Carolina (Apr. 10) and Louisiana (Apr. 24, the last state).
  why: The national government abandons sustained enforcement, ending Reconstruction as a governing project.
  tags:
  - election-1876
  - troop-withdrawal
  - redeemers
  end: 18770424
- id: freedmens_bureau_extended
  start: 18660303
  level: 2
  kind: institution
  title: Freedmen's Bureau
  description_short: The federal government assists formerly enslaved people and refugees.
  description_long: Created in March 1865 and extended in 1866, the bureau administers relief, labor contracts,
    schools, hospitals, and legal assistance across the former Confederacy.
  why: It is the principal federal institution attempting to turn emancipation into lived freedom.
  tags:
  - freedmen
  - federal-agency
  - education
  end: 18720630
- id: black_codes
  start: 18651124
  level: 2
  kind: state_legislation
  title: Southern Black Codes
  description_short: Southern legislatures restrict the freedom and labor of formerly enslaved people.
  description_long: Beginning with Mississippi and South Carolina in 1865, states regulate movement, employment,
    contracts, weapons, and vagrancy in ways designed to preserve a dependent labor force.
  why: They demonstrate that abolition without national protection can reproduce much of slavery's social power.
  tags:
  - black-codes
  - labor
  - states
  end: 18661231
- id: joint_committee_reconstruction
  start: 18651213
  level: 2
  kind: congressional_investigation
  title: Joint Committee on Reconstruction
  description_short: Congress investigates conditions in the former Confederate states.
  description_long: The committee gathers testimony on violence, loyalty, and the treatment of freedpeople before
    recommending constitutional and statutory conditions for readmission.
  why: Its work supplies Congress with the factual and political basis for taking control of Reconstruction.
  tags:
  - congress
  - investigation
  - readmission
  sources:
  - name: U.S. Senate Historical Office
    url: https://www.senate.gov/history/CivilWar_chronology.htm
- id: memphis_massacre
  start: 18660501
  level: 2
  kind: racial_violence
  title: Memphis Massacre
  description_short: White police, firefighters, and civilians attack Black residents in Memphis.
  description_long: Over three days, attackers kill dozens, assault women, and burn homes, churches, and schools
    while local authorities fail to protect the victims.
  why: The violence helps convince Northern voters that restored Southern governments cannot secure basic citizenship.
  tags:
  - violence
  - memphis
  - civil-rights
  end: 18660503
- id: new_orleans_massacre
  start: 18660730
  level: 2
  kind: racial_violence
  title: New Orleans Massacre
  description_short: Police and white attackers assault a biracial constitutional convention.
  description_long: The attack kills Black marchers and white Republicans gathered to reconvene Louisiana's 1864
    convention.
  why: Together with Memphis, it turns Southern violence into decisive evidence for Congressional Reconstruction.
  tags:
  - violence
  - louisiana
  - constitutional-convention
- id: election_of_1866
  start: 18661106
  level: 2
  kind: election
  title: Congressional Elections of 1866
  description_short: Republicans win veto-proof majorities after campaigning against Johnson's Reconstruction.
  description_long: Johnson's speaking tour fails to dislodge congressional Republicans, who gain the power to override
    him and impose their own settlement.
  why: The election gives Congress the political authority to enact military Reconstruction.
  tags:
  - election
  - congress
  - andrew-johnson
- id: supplementary_reconstruction_acts
  start: 18670323
  level: 2
  kind: legislation
  title: Supplementary Reconstruction Acts
  description_short: Congress specifies how military registration and constitutional conventions will operate.
  description_long: Additional acts empower military commanders to register voters, supervise elections, and remove
    obstructive officials.
  why: They convert the First Reconstruction Act from a framework into an administrative process.
  tags:
  - reconstruction-acts
  - military-districts
  - elections
  end: 18680311
- id: johnson_impeached
  start: 18680224
  level: 2
  kind: impeachment
  title: Andrew Johnson Impeached
  description_short: The House impeaches the president after his struggle with Congress culminates in Stanton's
    removal.
  description_long: Johnson is tried in the Senate and escapes conviction by one vote on May 16, with final votes
    taken May 26.
  why: The crisis tests whether the president can obstruct a congressionally directed Reconstruction settlement.
  tags:
  - impeachment
  - andrew-johnson
  - separation-of-powers
  end: 18680526
  sources:
  - name: U.S. Senate Historical Office
    url: https://www.senate.gov/about/powers-procedures/impeachment/impeachment-johnson.htm
- id: grant_elected
  start: 18681103
  level: 2
  kind: election
  title: Ulysses S. Grant Elected President
  description_short: The Union's leading general wins on a platform of peace and Reconstruction.
  description_long: Black voters in reconstructed states contribute to Grant's victory, while Republicans retain
    national control.
  why: His election places federal executive power behind congressional policy and later enforcement against the
    Klan.
  tags:
  - election
  - ulysses-s-grant
  - republican-party
- id: first_enforcement_act
  start: 18700531
  level: 2
  kind: legislation
  title: First Enforcement Act
  description_short: Congress criminalizes interference with voting rights.
  description_long: The law authorizes federal penalties against officials and private individuals who obstruct
    the Fifteenth Amendment.
  why: It begins the statutory machinery needed to defend suffrage against organized intimidation.
  tags:
  - enforcement-acts
  - voting-rights
  - federal-courts
  sources:
  - name: National Archives
    url: https://www.archives.gov/research/african-americans/vote/laws-and-courts
- id: second_enforcement_act
  start: 18710228
  level: 2
  kind: legislation
  title: Second Enforcement Act
  description_short: Congress expands federal supervision of elections.
  description_long: The law permits federal oversight of registration and voting in jurisdictions where citizens
    request protection.
  why: It recognizes that formal suffrage requires administrative protection at the polls.
  tags:
  - enforcement-acts
  - elections
  - voting-rights
  sources:
  - name: National Archives
    url: https://www.archives.gov/research/african-americans/vote/laws-and-courts
- id: klan_suppression_south_carolina
  start: 18711017
  level: 2
  kind: federal_enforcement
  title: Grant Suppresses the Klan in South Carolina
  description_short: Grant suspends habeas corpus in nine South Carolina counties.
  description_long: Federal troops and prosecutors arrest suspected Klansmen, producing indictments and weakening
    the organization in its strongest region.
  why: It demonstrates that federal power can protect elections when the national government is willing to use it.
  tags:
  - kkk
  - south-carolina
  - grant
  end: 18720331
- id: liberal_republican_revolt
  start: 18720501
  level: 2
  kind: party_split
  title: Liberal Republican Revolt
  description_short: Republican critics nominate Horace Greeley against Grant.
  description_long: The movement attacks corruption, military rule, and continued federal intervention while calling
    for civil-service reform and reconciliation.
  why: The split reveals that substantial Northern Republican opinion is turning from Reconstruction toward reunion
    and reform.
  tags:
  - liberal-republicans
  - election-1872
  - reconciliation
  end: 18721105
- id: colfax_massacre
  start: 18730413
  level: 2
  kind: racial_violence
  title: Colfax Massacre
  description_short: White paramilitaries kill Black defenders of a Republican courthouse in Louisiana.
  description_long: The attack follows a disputed state election and ends with the murder of many prisoners after
    they surrender.
  why: It exposes the capacity of organized violence to overturn elections and becomes the case through which the
    Supreme Court narrows federal protection.
  tags:
  - colfax
  - louisiana
  - white-terror
  sources:
  - name: National Park Service
    url: https://www.nps.gov/planyourvisit/event-details.htm?id=EB616570-AA88-4C91-AE92A10CC9945479
- id: democrats_win_house_1874
  start: 18741103
  level: 2
  kind: election
  title: Democrats Capture the House
  description_short: Democrats win control of the House of Representatives in the 1874 midterms.
  description_long: Economic depression, scandal, and political fatigue produce a major electoral reversal for Republicans.
  why: Congressional support for continued Reconstruction loses its governing majority.
  tags:
  - election
  - democratic-party
  - panic-of-1873
- id: mississippi_plan
  start: 18750803
  level: 2
  kind: political_campaign
  title: Mississippi Plan
  description_short: White Democrats combine violence, intimidation, and political organization to retake Mississippi.
  description_long: Rifle clubs disrupt Republican meetings, coerce voters, and exploit federal reluctance to intervene
    before the 1875 election.
  why: It provides a replicable strategy for destroying Reconstruction governments while preserving the appearance
    of electoral victory.
  tags:
  - mississippi
  - redeemers
  - voter-intimidation
  end: 18751102
- id: civil_rights_act_1875
  start: 18750301
  level: 2
  kind: legislation
  title: Civil Rights Act of 1875
  description_short: Congress prohibits racial discrimination in public accommodations and jury service.
  description_long: The law is the final major civil-rights measure of Reconstruction, though it lacks strong enforcement
    and is later invalidated by the Supreme Court.
  why: It shows Congress restating an expansive national promise even as its practical capacity to enforce that
    promise is collapsing.
  tags:
  - civil-rights
  - public-accommodations
  - congress
- id: election_of_1876
  start: 18761107
  level: 2
  kind: election
  title: Disputed Election of 1876
  description_short: Hayes and Tilden contest electoral votes from four states.
  description_long: Tilden wins the popular vote but falls one electoral vote short as rival returns emerge from
    Florida, Louisiana, South Carolina, and Oregon.
  why: The unresolved election creates the bargaining crisis through which Reconstruction is abandoned.
  tags:
  - hayes
  - tilden
  - electoral-dispute
- id: electoral_commission_act
  start: 18770129
  level: 2
  kind: legislation
  title: Electoral Commission Created
  description_short: Congress establishes a special commission to decide the disputed electoral votes.
  description_long: The fifteen-member body awards every contested vote to Hayes by party-line decisions.
  why: It supplies a constitutional procedure for resolving the election while moving political bargaining outside
    the formal record.
  tags:
  - electoral-commission
  - congress
  - election-1876
- id: johnson_amnesty_proclamation
  start: 18650529
  level: 3
  kind: proclamation
  title: Johnson Issues Amnesty and Reconstruction Proclamations
  description_short: Johnson offers pardons and appoints provisional governors in the South.
  description_long: His program requires repudiation of secession, debts, and slavery but leaves voting and civil
    status largely to white-controlled state conventions.
  why: It explains how former Confederate elites regain authority quickly enough to enact the Black Codes.
  tags:
  - andrew-johnson
  - amnesty
  - presidential-reconstruction
- id: forty_acres_order_revoked
  start: 18650912
  level: 3
  kind: land_policy
  title: Freedpeople's Land Returned to Former Owners
  description_short: Johnson orders abandoned and confiscated Southern land restored to pardoned owners.
  description_long: The policy reverses many wartime land allocations, including settlements associated with Special
    Field Orders No. 15.
  why: The failure of land redistribution leaves freedom dependent on labor relations controlled by former slaveholders.
  tags:
  - land
  - freedpeople
  - sharecropping
- id: mississippi_black_code
  start: 18651124
  level: 3
  kind: state_legislation
  title: Mississippi Black Code
  description_short: Mississippi adopts the first comprehensive postwar Black Code.
  description_long: The laws regulate labor contracts, apprenticeships, movement, and vagrancy while imposing distinct
    legal disabilities on Black residents.
  why: It becomes the clearest early evidence that restored states intend to preserve racial subordination after
    slavery.
  tags:
  - mississippi
  - black-codes
  - labor
- id: freedmens_bureau_bill_veto
  start: 18660219
  level: 3
  kind: presidential_veto
  title: Johnson Vetoes Freedmen's Bureau Bill
  description_short: Johnson rejects a bill expanding the bureau's authority.
  description_long: Congress initially fails to override the veto, widening the split between the president and
    Republican lawmakers.
  why: The veto clarifies that emancipation policy will become a struggle between executive restoration and congressional
    protection.
  tags:
  - andrew-johnson
  - freedmens-bureau
  - veto
- id: civil_rights_act_veto
  start: 18660327
  level: 3
  kind: presidential_veto
  title: Johnson Vetoes the Civil Rights Act
  description_short: Johnson denies that Congress can define and protect national civil rights in the unreconstructed
    states.
  description_long: Congress overrides him in April, making the act law over a presidential veto.
  why: The confrontation transforms citizenship from a policy dispute into a constitutional struggle over national
    authority.
  tags:
  - andrew-johnson
  - civil-rights-act
  - veto
- id: fourteenth_amendment_proposed
  start: 18660613
  level: 3
  kind: constitutional_amendment
  title: Congress Proposes the Fourteenth Amendment
  description_short: Congress submits national citizenship and equal protection to the states.
  description_long: The proposal constitutionalizes principles of the Civil Rights Act and sets ratification as
    a condition of restoration.
  why: It protects the second founding from dependence on ordinary legislation alone.
  tags:
  - fourteenth-amendment
  - congress
  - citizenship
- id: tennessee_readmitted
  start: 18660724
  level: 3
  kind: readmission
  title: Tennessee Readmitted to Congress
  description_short: Tennessee becomes the first former Confederate state restored to congressional representation.
  description_long: Because it ratifies the Fourteenth Amendment, Tennessee is exempted from military Reconstruction.
  why: Its readmission establishes constitutional acceptance as the route back into national government.
  tags:
  - tennessee
  - readmission
  - fourteenth-amendment
  sources:
  - name: U.S. Senate Historical Office
    url: https://www.senate.gov/history/CivilWar_chronology.htm
- id: command_of_army_act
  start: 18670302
  level: 3
  kind: legislation
  title: Command of the Army Act
  description_short: Congress requires presidential military orders to pass through General Grant.
  description_long: Attached to an appropriations law, the measure limits Johnson's ability to interfere with military
    administration in the South.
  why: It shows Congress protecting Reconstruction from executive sabotage through control of the chain of command.
  tags:
  - andrew-johnson
  - military
  - congress
- id: tenure_of_office_act
  start: 18670302
  level: 3
  kind: legislation
  title: Tenure of Office Act
  description_short: Congress restricts the president's power to remove certain officeholders.
  description_long: The law is designed in part to protect Secretary of War Edwin Stanton, an ally of congressional
    Reconstruction.
  why: Johnson's challenge to the act produces the impeachment crisis.
  tags:
  - tenure-of-office-act
  - edwin-stanton
  - impeachment
  sources:
  - name: U.S. Senate Historical Office
    url: https://www.senate.gov/about/powers-procedures/impeachment/impeachment-johnson.htm
- id: reconstruction_conventions
  start: 18671105
  level: 3
  kind: constitutional_conventions
  title: Reconstruction Constitutional Conventions
  description_short: Biracial electorates choose delegates to rewrite Southern state constitutions.
  description_long: The conventions expand public education, civil rights, and suffrage while reorganizing state
    institutions under federal requirements.
  why: They are the mechanism by which Congressional Reconstruction becomes state constitutional government.
  tags:
  - state-constitutions
  - black-politics
  - conventions
  end: 18690228
- id: stanton_removed
  start: 18680221
  level: 3
  kind: executive_action
  title: Johnson Removes Edwin Stanton
  description_short: Johnson attempts to dismiss the secretary of war in defiance of Congress.
  description_long: The removal directly challenges the Tenure of Office Act and triggers a new impeachment resolution.
  why: It converts a long constitutional struggle into the first presidential impeachment.
  tags:
  - edwin-stanton
  - andrew-johnson
  - impeachment
  sources:
  - name: U.S. Senate Historical Office
    url: https://www.senate.gov/about/powers-procedures/impeachment/impeachment-johnson.htm
- id: arkansas_readmitted
  start: 18680622
  level: 3
  kind: readmission
  title: Arkansas Readmitted
  description_short: Arkansas becomes the first state readmitted under the Reconstruction Acts.
  description_long: Its new constitution protects Black suffrage and meets Congress's readmission requirements.
  why: It shows the military reconstruction process producing restored representation.
  tags:
  - arkansas
  - readmission
  - reconstruction-acts
  sources:
  - name: U.S. Senate Historical Office
    url: https://www.senate.gov/history/CivilWar_chronology.htm
- id: southern_states_readmitted_1868
  start: 18680625
  level: 3
  kind: readmission
  title: Six Southern States Readmitted
  description_short: Congress restores representation to North Carolina, South Carolina, Louisiana, Georgia, Alabama,
    and Florida subject to conditions.
  description_long: The readmissions recognize new constitutions and reconstructed electorates, though Georgia's
    compliance remains contested.
  why: They mark the rapid institutional expansion of the new Southern political order.
  tags:
  - readmission
  - southern-states
  - congress
- id: georgia_legislature_expels_black_members
  start: 18680903
  level: 3
  kind: legislative_coup
  title: Georgia Expels Black Legislators
  description_short: White legislators remove most Black members from the Georgia General Assembly.
  description_long: The expulsions challenge the meaning of Black suffrage and prompt renewed federal conditions
    before Georgia's final readmission.
  why: They show that electoral participation can be nullified from within reconstructed institutions.
  tags:
  - georgia
  - black-officeholders
  - legislature
- id: washington_inaugural_1869
  start: 18690304
  level: 3
  kind: presidential_transition
  title: Grant Inaugurated
  description_short: Ulysses S. Grant becomes president.
  description_long: Grant pledges to enforce the laws and soon supports the Fifteenth Amendment and federal action
    against political terror.
  why: Executive commitment gives Congressional Reconstruction a stronger enforcement arm.
  tags:
  - ulysses-s-grant
  - presidency
  - enforcement
- id: texas_v_white
  start: 18690412
  level: 3
  kind: court_case
  title: Texas v. White
  description_short: The Supreme Court declares the Union constitutionally indestructible.
  description_long: The Court holds that secession ordinances were legally void while recognizing broad congressional
    authority over restoration.
  why: It supplies a constitutional explanation for why states never lawfully left and why national reconstruction
    is legitimate.
  tags:
  - supreme-court
  - union
  - secession
- id: georgia_act_1869
  start: 18691222
  level: 3
  kind: legislation
  title: Georgia Returned to Military Rule
  description_short: Congress requires Georgia to reseat Black legislators and ratify the Fifteenth Amendment.
  description_long: Federal action reverses the state's effort to evade the terms of Reconstruction.
  why: It demonstrates that readmission is conditional while Congress retains the will to enforce it.
  tags:
  - georgia
  - military-reconstruction
  - black-officeholders
- id: hiram_revels_seated
  start: 18700225
  level: 3
  kind: officeholding
  title: Hiram Revels Seated in the U.S. Senate
  description_short: Mississippi's Hiram Revels becomes the first Black senator.
  description_long: He occupies the seat once held by Jefferson Davis and serves during Mississippi's restored representation.
  why: His seating makes national citizenship and Black political power visible at the highest level of government.
  tags:
  - hiram-revels
  - senate
  - black-officeholders
  sources:
  - name: U.S. Senate Historical Office
    url: https://www.senate.gov/history/CivilWar_chronology.htm
- id: department_of_justice_created
  start: 18700622
  level: 3
  kind: institution
  title: Department of Justice Created
  description_short: Congress establishes a federal department headed by the attorney general.
  description_long: The new department coordinates federal legal work and soon becomes central to prosecutions under
    the Enforcement Acts.
  why: It gives the national government institutional capacity to prosecute attacks on civil and political rights.
  tags:
  - department-of-justice
  - enforcement
  - federal-courts
- id: georgia_final_readmission
  start: 18700715
  level: 3
  kind: readmission
  title: Georgia Finally Readmitted
  description_short: Georgia becomes the last former Confederate state restored to congressional representation.
  description_long: Its return follows federal insistence that Black legislators be reseated and the Fifteenth Amendment
    ratified.
  why: Formal restoration of the Union is completed even as enforcement remains unsettled.
  tags:
  - georgia
  - readmission
  - union
- id: election_of_1872
  start: 18721105
  level: 3
  kind: election
  title: Grant Reelected
  description_short: Grant defeats Horace Greeley and wins a second term.
  description_long: The result preserves Republican national power, but the Liberal Republican challenge normalizes
    calls for amnesty, local self-government, and an end to military intervention.
  why: The election simultaneously renews Grant's authority and reveals erosion within the Reconstruction coalition.
  tags:
  - election-1872
  - grant
  - liberal-republicans
- id: slaughterhouse_cases
  start: 18730414
  level: 3
  kind: court_case
  title: Slaughter-House Cases
  description_short: The Supreme Court narrowly interprets the Fourteenth Amendment's Privileges or Immunities Clause.
  description_long: The majority distinguishes national privileges from most civil rights traditionally regulated
    by states.
  why: The decision closes one possible route for using national citizenship to protect individuals against state
    power.
  tags:
  - supreme-court
  - fourteenth-amendment
  - privileges-or-immunities
- id: salary_grab_act
  start: 18730303
  level: 3
  kind: scandal
  title: Salary Grab Act
  description_short: Congress raises federal salaries and grants itself retroactive pay.
  description_long: Public outrage forces repeal of the congressional increase the following year.
  why: The controversy reinforces perceptions that Republican government is corrupt and distracted from Reconstruction.
  tags:
  - corruption
  - congress
  - grant-era
- id: credit_mobilier_exposed
  start: 18720904
  level: 3
  kind: scandal
  title: Crédit Mobilier Scandal Exposed
  description_short: Newspaper reports reveal that railroad insiders distributed discounted stock to influential
    politicians.
  description_long: The scandal implicates prominent Republicans and damages the moral authority of the governing
    coalition.
  why: Corruption weakens public confidence in the party responsible for sustaining Reconstruction.
  tags:
  - corruption
  - railroads
  - republican-party
  end: 18730304
- id: white_league_founded
  start: 18740401
  level: 3
  kind: paramilitary_organization
  title: White League Organizes
  description_short: Openly armed white supremacist organizations form to overthrow Louisiana's Republican government.
  description_long: Unlike the clandestine Klan, the White League operates as a public military arm of the Democratic
    Party.
  why: It shows white resistance evolving into organized forces capable of seizing political power.
  tags:
  - white-league
  - louisiana
  - paramilitary
  end: 18761231
- id: battle_of_liberty_place
  start: 18740914
  level: 3
  kind: insurrection
  title: Battle of Liberty Place
  description_short: The White League briefly overthrows Louisiana's Republican government in New Orleans.
  description_long: Thousands of armed men defeat police and militia before federal troops restore Governor William
    Pitt Kellogg.
  why: The episode proves that reconstructed governments survive only while national force remains available.
  tags:
  - white-league
  - new-orleans
  - federal-troops
- id: force_bill_defeated_1875
  start: 18750303
  level: 3
  kind: legislative_failure
  title: New Enforcement Legislation Fails
  description_short: The House fails to complete a bill strengthening federal protection in the South.
  description_long: With Democratic control approaching and Republican unity fading, proposals to answer renewed
    violence stall.
  why: The failure shows that the political machinery supporting Reconstruction is breaking before the final troop
    withdrawal.
  tags:
  - congress
  - enforcement
  - political-retreat
- id: hamburg_massacre
  start: 18760708
  level: 3
  kind: racial_violence
  title: Hamburg Massacre
  description_short: White riflemen attack a Black militia company and murder prisoners in South Carolina.
  description_long: The confrontation becomes a campaign symbol for the state's Red Shirts during the violent election
    of 1876.
  why: It demonstrates how paramilitary terror clears the way for Redeemer electoral victory.
  tags:
  - hamburg
  - south-carolina
  - red-shirts
- id: south_carolina_election_1876
  start: 18761107
  level: 3
  kind: disputed_election
  title: South Carolina Has Rival Governments
  description_short: Republican Daniel Chamberlain and Democrat Wade Hampton both claim the governorship.
  description_long: Violence, fraud allegations, and disputed returns leave two governments operating until federal
    support is withdrawn.
  why: The state crisis ties the presidential settlement directly to the survival of Reconstruction government.
  tags:
  - south-carolina
  - wade-hampton
  - rival-governments
  end: 18770411
- id: louisiana_election_1876
  start: 18761107
  level: 3
  kind: disputed_election
  title: Louisiana Has Rival Governments
  description_short: Republican Stephen Packard and Democrat Francis Nicholls both claim the governorship.
  description_long: Competing returning boards and armed supporters produce two governments protected in different
    ways.
  why: Louisiana becomes the other decisive state whose Republican government collapses when federal troops withdraw.
  tags:
  - louisiana
  - rival-governments
  - election-1876
  end: 18770424
- id: sea_islands_land_claims
  start: 18650801
  level: 4
  kind: land_conflict
  title: Sea Islands Freedpeople Defend Land Claims
  description_short: Freed families petition to retain wartime land settlements.
  description_long: Meetings with federal officials expose the conflict between restored property claims and freedpeople's
    expectation that emancipation would include economic independence.
  why: The dispute gives concrete form to Reconstruction's failure to redistribute productive power.
