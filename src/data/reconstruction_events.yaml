  tags: [civil-rights]
  sources: [National Archives]

- id: us_v_cruikshank
  start: 18760327
  level: 1
  kind: supreme_court
  epoch: Reconstruction
  title: United States v. Cruikshank
  description_short: Supreme Court limits federal civil rights enforcement.
  description_long: The Court narrows federal authority to prosecute private violations of civil rights.
