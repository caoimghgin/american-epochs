  level: 4
  kind: institutional_change
  title: Southern Public-School Systems Expand
  description_short: Reconstructed state governments establish or enlarge tax-supported public education.
  description_long: Biracial constitutional conventions and legislatures create statewide systems where little public
    provision had existed, though schools remain segregated.
  why: Education shows Reconstruction changing everyday state capacity beyond elections and amendments.
  tags:
  - public-education
  - southern-states
  - state-government
  end: 18761231
- id: knights_of_white_camelia
  start: 18670522
  level: 4
  kind: paramilitary_organization
  title: Knights of the White Camelia Form
  description_short: A white supremacist secret society organizes in Louisiana.
  description_long: The group spreads across the lower South and uses intimidation to oppose Republican government
