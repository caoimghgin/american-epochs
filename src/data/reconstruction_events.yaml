  - federal-courts
  - kkk
  - south-carolina
  end: 18720422
- id: amnesty_act_1872
  start: 18720522
  level: 4
  kind: legislation
  title: Amnesty Act of 1872
  description_short: Congress removes political disabilities from most former Confederates.
  description_long: Only a small group of high-ranking officials remains barred from office.
  why: The act marks the shift from conditional restoration toward reconciliation with former Confederate leadership.
