  level: 2
  kind: legislation
  epoch: Reconstruction
  title: Enforcement Acts
  description_short: Congress combats voter intimidation.
  description_long: A series of laws strengthen federal authority to protect elections and civil rights.
  why: Expands federal enforcement powers.
  tags: [civil-rights]
  sources: [Library of Congress]

- id: ku_klux_klan_act
  start: 18710420
  level: 1
  kind: legislation
  epoch: Reconstruction
  title: Ku Klux Klan Act
  description_short: Federal government targets political terrorism.
  description_long: The Act authorizes federal intervention against Klan violence and conspiracies.
  why: Peak assertion of federal authority during Reconstruction.
