  tags:
  - hiram-revels
  - citizenship
  - senate
- id: first_black_house_members
  start: 18710304
  level: 5
  kind: officeholding
  title: First Black Representatives Serve in Congress
  description_short: Joseph Rainey and other Black representatives serve in the Forty-second Congress.
  description_long: They advocate civil rights, education, and federal protection against violence.
  why: Their presence shows Reconstruction producing national lawmakers as well as voters.
  tags:
