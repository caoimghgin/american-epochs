  description_short: Federal prosecutors try defendants accused of terrorizing Black voters in York County.
  description_long: Convictions and guilty pleas follow the Grant administration's enforcement campaign.
  why: The trials demonstrate what national protection looks like when law, troops, and prosecution operate together.
