  tags: [military, federal-power]
  sources: [Britannica]

- id: johnson_impeached
  start: 18680224
  level: 1
  kind: impeachment
  epoch: Reconstruction
  title: Andrew Johnson Impeached
  description_short: Congress impeaches the President.
  description_long: Johnson narrowly avoids removal after a constitutional confrontation with Congress.
  why: Highlights the struggle over control of Reconstruction.
  tags: [presidency, congress]
  sources: [U.S. Senate]

- id: grant_elected
  start: 18681103
  level: 1
  kind: election
  epoch: Reconstruction
  title: Ulysses S. Grant Elected
  description_short: Grant wins the presidency.
  description_long: Grant's election reinforces Congressional Reconstruction and federal enforcement.
  why: Public endorses continued Reconstruction.
  tags: [election]
  sources: [National Archives]

- id: fifteenth_amendment
  start: 18700203
  level: 0
  kind: amendment
  epoch: Reconstruction
  title: Fifteenth Amendment Ratified
  description_short: Voting rights protected regardless of race.
  description_long: The amendment prohibits denying the vote based on race, color, or previous condition of servitude.
  why: Completes the Reconstruction Amendments.
  tags: [constitution, amendment]
  sources: [National Archives]

- id: enforcement_acts
