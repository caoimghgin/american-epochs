  - currency
  - gold-standard
  - economic-policy
- id: red_shirts_campaign
  start: 18760701
  level: 4
  kind: paramilitary_campaign
  title: Red Shirts Campaign in South Carolina
  description_short: Armed Democratic clubs openly campaign for Wade Hampton.
  description_long: Rallies, intimidation, and attacks reduce Republican organizing and Black turnout during the
