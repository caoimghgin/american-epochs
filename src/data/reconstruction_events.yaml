  description_short: Representative James Ashley accuses Johnson of high crimes and seeks an investigation.
  description_long: The House initially rejects impeachment after months of inquiry.
  why: The failed attempt shows that removal is debated well before Stanton's dismissal creates a viable case.
  tags:
  - andrew-johnson
  - impeachment
  - house
- id: black_senator_credentials_debate
