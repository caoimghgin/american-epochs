  title: Coushatta Massacre
  description_short: White League members murder Republican officeholders and freedmen in Louisiana.
  description_long: The victims include members of the Marshall family and Black witnesses following a local coup.
  why: The massacre shows paramilitary violence removing the human infrastructure of Republican government county
    by county.
