- id: civil_rights_act_1875
  start: 18750301
  level: 2
  kind: legislation
  epoch: Reconstruction
  title: Civil Rights Act of 1875
  description_short: Congress outlaws racial discrimination in public accommodations.
  description_long: The last major civil rights law of Reconstruction before federal retreat.
