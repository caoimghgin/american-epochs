  description_long: Congress rejects the plan.
  why: 'The failed proposal marks the road not taken: reconstructing property ownership as well as legal status.'
  tags:
  - thaddeus-stevens
  - land-redistribution
  - congress
- id: constitutional_convention_black_delegates
  start: 18671201
  level: 5
  kind: political_participation
  title: Black Delegates Enter Southern Conventions
  description_short: Hundreds of Black men serve in state constitutional conventions.
  description_long: Many are ministers, veterans, teachers, artisans, and community leaders rather than the caricature
