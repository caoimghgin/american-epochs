- id: vicksburg_massacre
  start: 18741207
  level: 5
  kind: racial_violence
  title: Vicksburg Massacre
  description_short: Armed white groups attack Black citizens after forcing the Republican sheriff from office.
  description_long: Federal troops eventually restore order, but many Black residents are killed.
  why: The event foreshadows the Mississippi Plan by showing local office removal backed by mass violence.
  tags:
  - vicksburg
