- id: pinckney_benton_stewart_pinchback
  start: 18721209
  level: 5
  kind: officeholding
  title: P. B. S. Pinchback Becomes Acting Governor
  description_short: Pinchback serves briefly as acting governor of Louisiana.
  description_long: He is the first Black governor of a U.S. state, though he holds office for only thirty-five
    days.
  why: The episode illustrates how far Reconstruction altered political eligibility even amid Louisiana's instability.
