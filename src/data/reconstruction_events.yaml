  why: Their participation supplies the personnel and ideas behind reconstructed state constitutions.
  tags:
  - black-delegates
  - constitutional-conventions
  - leadership
  end: 18690228
- id: ashley_impeachment_resolution
  start: 18670107
  level: 5
