  level: 5
  kind: reform_movement
  title: American Equal Rights Association Formed
  description_short: Abolitionists and women's-rights advocates organize for universal suffrage.
  description_long: Disagreement over prioritizing Black male suffrage later divides the movement.
  why: The organization reveals how Reconstruction's expansion of citizenship also fractures reform coalitions.
