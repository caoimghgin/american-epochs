  - land
  - sea-islands
  - freedpeople
  end: 18660201
- id: southern_homestead_act
  start: 18660621
  level: 4
  kind: legislation
  title: Southern Homestead Act
  description_short: Congress opens federal land in five Southern states to settlement.
  description_long: The law initially excludes former Confederates and is intended partly to provide opportunity
    to freedpeople, but poor land, fees, and limited assistance restrict its effect.
  why: It shows an alternative land policy attempted without confronting plantation ownership directly.
  tags:
  - land
  - homesteading
  - freedpeople
- id: new_orleans_mechanics_institute_convention
  start: 18660730
  level: 4
  kind: constitutional_convention
  title: Louisiana Convention Reconvenes
  description_short: Republicans seek to revive the state's 1864 convention and expand Black suffrage.
  description_long: The gathering at the Mechanics' Institute is attacked before it can complete its work.
  why: The convention explains why the New Orleans Massacre is a direct assault on constitutional reconstruction,
    not spontaneous disorder.
  tags:
  - louisiana
  - constitutional-convention
  - suffrage
- id: swing_around_circle
  start: 18660827
  level: 4
  kind: political_campaign
  title: Johnson's Swing Around the Circle
  description_short: Johnson campaigns publicly against congressional Republicans.
  description_long: His combative speeches, heckling, and attacks on opponents damage his standing during the 1866
    elections.
  why: The tour helps turn the congressional election into a referendum against Presidential Reconstruction.
  tags:
  - andrew-johnson
  - campaign
  - election-1866
  end: 18660915
- id: peonage_sharecropping_expands
  start: 18660101
  level: 4
  kind: economic_system
  title: Sharecropping Expands
  description_short: Landowners and laborers increasingly divide crops instead of paying wages.
  description_long: The system gives freed families some household autonomy but often binds them through debt, crop
    liens, and merchant credit.
  why: It explains how emancipation can coexist with durable economic dependence.
  tags:
  - sharecropping
  - labor
  - debt
  end: 18771231
- id: howard_university_chartered
  start: 18670302
  level: 4
  kind: education
  title: Howard University Chartered
  description_short: Congress charters a university in Washington for the education of Black students.
  description_long: Named for Freedmen's Bureau commissioner Oliver O. Howard, the institution opens during the
    rapid creation of Black schools and colleges.
  why: It represents Reconstruction as an investment in independent citizenship and leadership.
  tags:
  - education
  - howard-university
  - freedpeople
- id: alaska_purchase
  start: 18670330
  level: 4
  kind: foreign_policy
  title: United States Purchases Alaska
  description_short: The United States agrees to buy Alaska from Russia.
  description_long: The acquisition is initially mocked but expands national territory during Reconstruction.
  why: It situates the era within a nation simultaneously reconstructing the South and extending its continental
    reach.
  tags:
  - alaska
  - territorial-expansion
  - foreign-policy
- id: union_league_mobilization
  start: 18670101
  level: 4
  kind: political_organization
  title: Union Leagues Mobilize Black Voters
  description_short: Local Union League chapters organize political education, mutual aid, and Republican participation.
  description_long: The leagues become crucial networks linking freed communities to constitutional conventions
    and elections.
  why: They explain how newly enfranchised citizens become an effective political constituency.
  tags:
  - union-league
  - black-politics
  - republican-party
  end: 18711231
- id: black_voters_register
  start: 18670801
  level: 4
  kind: voter_registration
  title: Black Men Register Under Military Reconstruction
  description_short: Military officials enroll new electorates across the former Confederacy.
  description_long: Hundreds of thousands of Black men register while some former Confederates are temporarily disqualified.
  why: Registration makes the abstract promise of Congressional Reconstruction operational.
  tags:
  - voter-registration
  - military-districts
  - black-suffrage
  end: 18671031
- id: oscar_dunn_lieutenant_governor
  start: 18680627
  level: 4
  kind: officeholding
  title: Oscar Dunn Elected Lieutenant Governor of Louisiana
  description_short: Dunn becomes the first elected Black lieutenant governor in the United States.
  description_long: He serves in a biracial Republican government during intense factional and racial conflict.
  why: His officeholding demonstrates the scale of political transformation produced by the new electorate.
  tags:
  - oscar-dunn
  - louisiana
  - black-officeholders
- id: south_carolina_black_majority_legislature
  start: 18680706
  level: 4
  kind: legislature
  title: Biracial Government Takes Office in South Carolina
  description_short: South Carolina's reconstructed legislature includes a Black majority in its lower house.
  description_long: The government expands public education and civil institutions while facing fierce opposition
    and accusations of corruption.
  why: It is the clearest state-level expression of Reconstruction's democratic experiment.
  tags:
  - south-carolina
  - legislature
  - black-politics
- id: camilla_massacre
  start: 18680919
  level: 4
  kind: racial_violence
  title: Camilla Massacre
  description_short: White residents attack a Republican political procession in Camilla, Georgia.
  description_long: Black marchers and Republican speakers are fired upon as they approach a campaign meeting.
