  description_long: These meetings build leadership networks and articulate political programs before federal enfranchisement.
  why: They demonstrate that Black citizenship is asserted from below rather than simply granted from above.
  tags:
  - black-conventions
  - citizenship
  - political-organizing
  end: 18670228
- id: atlanta_university_founded
  start: 18650919
  level: 5
  kind: education
  title: Atlanta University Founded
  description_short: Missionaries and Freedmen's Bureau officials establish a school for Black students.
  description_long: It develops into a major institution of higher education.
  why: The founding illustrates the dense educational infrastructure growing alongside political Reconstruction.
  tags:
  - education
  - atlanta-university
  - freedpeople
- id: fisk_university_founded
  start: 18660109
  level: 5
  kind: education
  title: Fisk University Opens
  description_short: The American Missionary Association opens a school for freedpeople in Nashville.
  description_long: The Fisk Jubilee Singers later raise funds and bring international attention to the institution.
  why: It gives local and cultural form to Reconstruction's investment in education.
  tags:
  - education
  - fisk-university
  - jubilee-singers
- id: american_equal_rights_association
