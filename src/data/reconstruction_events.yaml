  title: Robert Brown Elliott Defends Civil Rights
  description_short: South Carolina representative Robert Brown Elliott delivers a celebrated House speech supporting
    public-accommodations legislation.
  description_long: He answers constitutional objections and invokes the Fourteenth Amendment's national promise.
  why: The speech gives eloquent contemporary expression to Reconstruction's theory of equal citizenship.
