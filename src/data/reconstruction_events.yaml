  - opelousas
  - louisiana
  - voter-suppression
  end: 18681003
- id: fifteenth_amendment_proposed
  start: 18690226
  level: 4
  kind: constitutional_amendment
  title: Congress Proposes the Fifteenth Amendment
  description_short: Congress submits a prohibition on race-based voting discrimination to the states.
