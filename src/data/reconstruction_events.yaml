  title: Wormley Conference
  description_short: Republicans and Southern Democrats meet at Washington's Wormley Hotel.
  description_long: Participants discuss acceptance of Hayes alongside internal improvements, local control, and
    the withdrawal of troops.
  why: The meeting gives concrete form to the informal bargaining remembered as the Compromise of 1877.
