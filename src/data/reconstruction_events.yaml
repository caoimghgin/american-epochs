- id: freedmans_bank_failure
  start: 18740629
  level: 5
  kind: bank_failure
  title: Freedman's Savings Bank Fails
  description_short: The bank closes with tens of thousands of depositors unable to recover their savings.
  description_long: Its failure follows speculative investment and weak oversight by white trustees.
  why: The loss erodes trust and destroys Black wealth during the same years national commitment is retreating.
  tags:
