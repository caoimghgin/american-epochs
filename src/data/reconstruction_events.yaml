  - camilla
  - georgia
  - election-violence
- id: opelousas_massacre
  start: 18680928
  level: 4
  kind: racial_violence
  title: Opelousas Massacre
  description_short: White attackers kill Black residents and Republicans in St. Landry Parish, Louisiana.
