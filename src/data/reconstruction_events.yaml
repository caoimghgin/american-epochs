  why: The campaign is the mature form of a counterrevolution operating through both spectacle and terror.
  tags:
  - red-shirts
  - south-carolina
  - wade-hampton
  end: 18761107
- id: belknap_impeachment
  start: 18760302
  level: 4
  kind: scandal
  title: Secretary Belknap Impeached
  description_short: War Secretary William Belknap resigns as the House prepares to impeach him for corruption.
  description_long: The Senate later acquits him after debating whether it can try a former officer.
  why: The scandal further damages the Grant administration during the election that ends Reconstruction.
  tags:
  - belknap
  - corruption
  - grant-administration
  end: 18760801
- id: electoral_commission_decisions
