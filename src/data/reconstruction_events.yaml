  description_short: The commission resolves disputes from Florida, Louisiana, Oregon, and South Carolina for Hayes.
  description_long: Each decisive vote follows an eight-to-seven partisan division.
  why: The sequence turns an election crisis into a settlement whose legitimacy depends on political acceptance.
  tags:
  - electoral-commission
  - hayes
  - tilden
  end: 18770302
- id: savannah_colloquy
