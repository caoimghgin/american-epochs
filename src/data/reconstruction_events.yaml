  why: Final legitimacy crisis of the epoch.
  tags: [election]
  sources: [National Archives]

- id: compromise_1877
  start: 18770302
  level: 0
  kind: compromise
  epoch: Reconstruction
  title: Compromise of 1877
  description_short: Federal troops withdrawn from the South.
