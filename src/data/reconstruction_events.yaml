- id: oregon_elector_dispute
  start: 18761206
  level: 5
  kind: electoral_dispute
  title: Oregon Elector Disputed
  description_short: Oregon's Democratic governor attempts to replace an elector deemed constitutionally ineligible.
  description_long: The controversy adds one electoral vote to the larger national dispute.
  why: It shows that the election crisis is not solely a Southern contest, even though Southern governments are
    what the settlement sacrifices.
