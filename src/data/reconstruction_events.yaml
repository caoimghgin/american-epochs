
- id: lincoln_assassinated
  start: 18650414
  end: 18650415
  level: 0
  kind: assassination
  epoch: Reconstruction
  title: Abraham Lincoln Assassinated
  description_short: Lincoln is assassinated days after Union victory.
  description_long: Lincoln's death removes the principal architect of postwar reconciliation and places Reconstruction under Andrew Johnson.
  why: Opens Reconstruction under dramatically different leadership.
  tags: [presidency, reconstruction]
  sources: [National Archives]

- id: andrew_johnson_president
  start: 18650415
  level: 1
  kind: presidency
  epoch: Reconstruction
  title: Andrew Johnson Becomes President
  description_short: Johnson inherits responsibility for Reconstruction.
  description_long: Following Lincoln's assassination, Johnson assumes the presidency and quickly clashes with Congress over Reconstruction.
  why: Sets the political direction of the epoch.
  tags: [presidency]
  sources: [White House]

- id: freedmens_bureau
  start: 18650303
  level: 2
  kind: legislation
  epoch: Reconstruction
  title: Freedmen's Bureau Established
  description_short: Federal agency assists formerly enslaved people.
  description_long: The Bureau provides education, legal assistance, labor contracts, and humanitarian aid during Reconstruction.
  why: Represents the federal government's first large-scale reconstruction effort.
  tags: [civil-rights, federal-power]
  sources: [National Archives]

- id: black_codes
  start: 18651101
  end: 18661231
  level: 2
  kind: legislation
  epoch: Reconstruction
  title: Black Codes Enacted
  description_short: Southern states restrict the freedoms of freedpeople.
  description_long: Former Confederate states enact laws limiting civil rights, prompting stronger federal intervention.
  why: Demonstrates organized resistance to Reconstruction.
  tags: [civil-rights, south]
  sources: [Britannica]

- id: civil_rights_act_1866
  start: 18660409
  level: 1
  kind: legislation
  epoch: Reconstruction
  title: Civil Rights Act of 1866
  description_short: Congress guarantees basic civil rights.
  description_long: The first major federal civil rights law establishes birthright citizenship protections and overrides Johnson's veto.
  why: Signals Congress's determination to shape Reconstruction.
  tags: [civil-rights, congress]
  sources: [National Archives]

- id: fourteenth_amendment
  start: 18680709
  level: 0
  kind: amendment
  epoch: Reconstruction
  title: Fourteenth Amendment Ratified
  description_short: Citizenship and equal protection enter the Constitution.
  description_long: The amendment nationalizes civil rights through due process and equal protection.
  why: Fundamentally rewrites the constitutional order.
  tags: [constitution, amendment]
  sources: [National Archives]

