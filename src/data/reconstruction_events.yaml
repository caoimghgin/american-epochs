  - white-terror
- id: clinton_massacre
  start: 18750904
  level: 5
  kind: racial_violence
  title: Clinton Massacre
  description_short: Violence erupts at a Republican meeting in Clinton, Mississippi.
  description_long: White armed groups pursue and kill Black residents in the surrounding area.
  why: The attack is part of the coordinated intimidation that enables Democratic victory under the Mississippi
    Plan.
  tags:
  - clinton
  - mississippi-plan
  - racial-violence
- id: wheeler_compromise_louisiana
  start: 18750304
  level: 5
  kind: political_compromise
  title: Wheeler Compromise
  description_short: A congressional arrangement settles contested seats in the Louisiana legislature.
  description_long: Democrats recognize Republican governor Kellogg while gaining legislative representation.
  why: The compromise temporarily stabilizes Louisiana but normalizes negotiated retreat from clear federal protection.
  tags:
  - louisiana
  - william-wheeler
  - political-compromise
- id: grant_refuses_mississippi_troops
  start: 18750914
  level: 5
  kind: executive_decision
  title: Grant Declines Broad Intervention in Mississippi
  description_short: The administration does not provide the sweeping troop deployment requested by Mississippi's
    Republican governor.
  description_long: Federal officials fear political backlash and doubt that military action can resolve the campaign.
  why: The decision shows enforcement failing through reluctance before it fails through formal withdrawal.
  tags:
  - grant
  - mississippi-plan
  - federal-retreat
