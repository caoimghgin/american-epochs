  - financial-failure
- id: blanche_bruce_seated
  start: 18750304
  level: 5
  kind: officeholding
  title: Blanche K. Bruce Enters the Senate
  description_short: Mississippi elects Blanche K. Bruce to a full Senate term.
  description_long: He becomes the second Black senator and the first to serve a complete term.
  why: His service captures both the reality of Reconstruction political power and how abruptly that representation
    will disappear.
