schema:
  name: American Epochs Event Corpus
  version: 2
  date_format: YYYYMMDD
  level_definition:
    1: The epoch's "crown of the mountain" — always visible, at every zoom, from the very widest view. One beat per structural
      hinge in the epoch's own arc, not a list of "the important stuff." Target 5-8 entries regardless of how large or eventful
      the epoch was; see curation_guidance below. Automatically revealed first as the viewer zooms in from full history —
      never a manual toggle.
    2: Major events, automatically revealed at the first closer zoom past Level 1.
    3: Supporting events explaining mechanisms, shifts, and consequences.
    4: Contextual events — political, military, social, institutional texture.
    5: Fine-grained events for the closest inspection.
  curation_guidance:
  - Level 1 is the hardest and most important editorial call in the corpus. The viewer never chooses to see it — it is what
    everyone sees whether they zoom in or not, so it carries the whole epoch's argument on its own.
  - Pick one entry per point where the epoch's own arc genuinely turns, not one per famous name or battle. A working test
    - "does removing this entry break the causal chain from the epoch's start to its end?" If not, it belongs at Level 2 or
    below, however well-known it is.
  - Target 5-8 Level 1 point events specifically. This is deliberately independent of the epoch's total event count or length
    in years. Reconstruction intentionally carries nine point events because the Panic of 1873 and United States v. Cruikshank
    describe distinct political and judicial turns and the editor has approved a slightly crowded crown.
  - Span (duration) entries at Level 1 do not count against the point-event target because the live instrument never tier-filters
    spans; they provide scene-setting context.
  - Levels 2-5 have much more room to breathe. Disagreement there is a rounding error, not a structural problem. Spend the
    real editorial effort on Level 1.
  notes:
  - A missing end date indicates a point event.
  - Dates represent the most defensible public date for display, not necessarily every stage of a legal or political process.
  - date_precision (year or month) applies to start, and end_precision (month) to the end of a range. Where set, the placeholder
    in the date field must not be rendered as exact. Absent means a full day-level date. date_verified true means the date
    was confirmed against an identifiable source.
  - This corpus is a research/authoring artifact. A human or LLM reconciles it into the live EVENTS array.
  - 'AS-OF DATE: this corpus is written as of October 19, 2026, two weeks before the midterms. The epoch is open, and the
    last stretch is provisional: events from the final twelve months have no settled significance, and none of them reaches
    Level 1 unless it is structural beyond argument. The instrument should draw the final stretch as provisional.'
  - Levels were assigned by Claude as a first-pass editorial judgment (see reckoning_outline.md). Dates for 2016 to 2024 are
    drafted from memory and are not source-verified. Dates for 2025 and 2026 were researched on the web on the as-of date
    and carry a source URL. date_verified is true only where a non-Wikipedia page was read for the date; otherwise the date
    rests on Wikipedia or search summaries and should be re-checked against primary sources (congress.gov roll calls, supremecourt.gov,
    whitehouse.gov) before it is treated as settled. Figures to check first include the CBO estimates for the 2025 tax law,
    the Iran War casualty counts, the boat-strike totals, and the DHS shutdown lengths.
  - The Level 1 carries eleven point events (well above the usual five to eight) plus the COVID-19 span. The editor directed
    that the 2024 election, the DOGE dismantling of agencies, and the tariffs be Level 1 alongside the immunity decision and
    the January 6 pardons, and that unusual events receive higher legibility. Five of the eleven fall between July 2024 and
    April 2025, so the crown is dense at the right edge. Candidates to demote if labels collide are the 2020 emergency (the
    COVID span carries it), Kabul, and the immunity decision.
  - 'The COVID-19 span (2020-03-13 to 2023-05-11) replaces the live year-level span. The Afghanistan War span (2001-10-07
    to 2021-08-30) is owned by the End of History corpus, and this corpus carries its end events: the Doha agreement (Level
    2), the fall of Kabul (Level 1), and the last flight (Level 2).'
  - The Iran War (2026-02-28) is Level 2, not Level 1, under the rule that nothing under twelve months old reaches Level 1
    unless structural beyond argument. It is the first candidate for promotion once the war has an outcome. The Maduro capture,
    the 2026 shutdown, and the 2026 Supreme Court decisions are likewise Level 2 or 3.
  - 'The rule-of-law and preferred-treatment thread continues from the Interregnum: the immunity decision and the January
    6 pardons (Level 1), the Arpaio pardon, the Stone commutation, and the Hunter Biden pardon (Level 3), and the Comey and
    James indictments (Level 3). The immigration thread is carried by the travel ban, family separation, Remain in Mexico,
    Title 42, the 2023 and 2024 border events, and the second term''s deportation program.'
  - 'The corpus opens on 2016-01-01 and has no close. It ends at the as-of date. The handoff is the open question the framework
    cannot answer: whether the period that began in 2016 resolves into a new settlement or deepens into the kind of crisis
    that ends the cycle.'
epoch:
  id: reckoning
  title: The Reckoning
  start: 20160101
  end: 20261019
  thesis: 'The symptom is given the office, and the debts the order deferred come due. A candidate who won by repudiating
    the consensus takes power in 2016. A pandemic tests the state, the killing of George Floyd reopens the racial question,
    a mob enters the Capitol, the empire''s longest war ends in collapse, and the Supreme Court ends a fifty-year settlement
    on abortion. Then the executive tests the institutions: immunity from prosecution, mass pardons, the dismantling of agencies,
    tariffs by emergency decree, troops in cities, and a war begun without a vote. The courts and Congress respond unevenly.
    The epoch has not resolved into a new order, and it is still open.'
events:
- id: trump_elected
  start: 20161108
  level: 1
  kind: election
  title: Trump Elected
  description_short: Donald Trump wins the Electoral College, 304 to 227, while losing the popular vote by about 2.9 million.
  description_long: A candidate with no prior office defeats Hillary Clinton and sixteen Republican rivals, against both parties'
    establishments and nearly every poll. He carries Michigan, Wisconsin, and Pennsylvania by a combined margin of about 78,000
    votes. The Senate had refused to act on Obama's Supreme Court nominee, so the winner also inherits the vacant seat.
  why: 'The Interregnum''s question is answered: the symptom is given the office.'
  tags:
  - election
  - trump
  - populism
  - electoral-college
- id: covid_emergency
  start: 20200313
  level: 1
  kind: public-health
  title: COVID-19 National Emergency Declared
  description_short: Trump declares a national emergency as the pandemic closes schools, businesses, and borders.
  description_long: The World Health Organization had called the outbreak a pandemic two days earlier. Unemployment rose from
    3.5 percent in February to 14.7 percent in April, the highest rate since records began in 1948. More than a million Americans
    died of COVID-19 over the next three years, and the burden fell unevenly by age, occupation, and race.
  why: A government hollowed out by decades of defunding is tested, and the loss falls on particular people.
  tags:
  - pandemic
  - covid
  - state-capacity
  - public-health
- id: covid_pandemic
  start: 20200313
  end: 20230511
  level: 1
  kind: public-health
  title: COVID-19
  description_short: The national emergency lasts from March 13, 2020 to May 11, 2023, the end of the federal public health
    emergency.
  description_long: The span covers lockdowns, the CARES Act and later relief, the first vaccines in December 2020, the Delta
    and Omicron waves, and the mandates that followed. The federal public health emergency ended on May 11, 2023, the same
    day as the Title 42 border rule.
  why: The state's capacity is tested for three years, and the period names who bears the cost.
  tags:
  - pandemic
  - covid
  - public-health
- id: george_floyd
  start: 20200525
  level: 1
  kind: race
  title: George Floyd Killed
  description_short: A Minneapolis police officer kneels on George Floyd's neck for more than nine minutes, and a bystander's
    video spreads worldwide.
  description_long: Derek Chauvin is convicted of murder on April 20, 2021 and sentenced to 22 and a half years. The protests
    that followed in the summer of 2020 reached every state, and a New York Times analysis estimated that between 15 and 26
    million Americans took part, which would make them among the largest movements in the country's history.
  why: The racial order's oldest debt reopens in public, in the middle of a pandemic.
  tags:
  - race
  - policing
  - protest
  - minneapolis
- id: january_6
  start: 20210106
  level: 1
  kind: politics
  title: January 6
  description_short: A crowd that Trump addressed at the Ellipse enters the Capitol while Congress counts the electoral votes,
    delaying certification by hours.
  description_long: About 140 police officers were injured, and the House impeached Trump a week later, 232 to 197, with ten
    Republicans in favor. The Senate voted 57 to 43 to convict, ten short of two-thirds. Congress certified Biden's victory
    at about 3:40 a.m. on January 7. Roughly 1,500 people were eventually charged.
  why: The transfer of power is tested by a mob, and the legitimacy deficit becomes physical.
  tags:
  - election
  - capitol
  - legitimacy
  - rule-of-law
- id: fall_of_kabul
  start: 20210815
  level: 1
  kind: war
  title: Fall of Kabul
  description_short: The Taliban enter Kabul as President Ashraf Ghani flees, ending the twenty-year American war in Afghanistan
    within days.
  description_long: Biden had announced the withdrawal on April 14, following the February 2020 agreement Trump's administration
    signed in Doha. The Afghan army collapsed faster than American intelligence had predicted. More than 120,000 people were
    flown out in two weeks. The war killed about 2,400 American service members and cost roughly $2 trillion.
  why: The empire's longest war ends in collapse, and the soldiers and Afghans who carried it are left to carry the end.
  tags:
  - afghanistan
  - taliban
  - withdrawal
  - empire
- id: dobbs
  start: 20220624
  level: 1
  kind: court
  title: Dobbs v. Jackson Women's Health Organization
  description_short: The Supreme Court overrules Roe v. Wade and Planned Parenthood v. Casey, ending the constitutional right
    to abortion.
  description_long: A draft opinion had leaked on May 2. The decision was 6 to 3 on the Mississippi law and 5 to 4 on overruling
    Roe. Within months more than a dozen states enforced bans on nearly all abortions, and voters in Kansas, Ohio, and other
    states then sided with abortion rights at the ballot box.
  why: The Court ends its longest-standing settlement, and the cost falls on the women of particular states.
  tags:
  - court
  - abortion
  - roe
  - federalism
- id: trump_v_united_states
  start: 20240701
  level: 1
  kind: court
  title: Trump v. United States
  description_short: The Supreme Court holds, 6 to 3, that a president has absolute immunity for core constitutional acts
    and presumptive immunity for official acts.
  description_long: The case arose from the federal election-interference indictment. The majority also barred prosecutors
    from using evidence of official acts to prove unofficial ones. Justice Sotomayor's dissent warned that the president had
    become "a king above the law." The trial court could not proceed before the election.
  why: The Court decides that the executive is not equally subject to the law it enforces.
  tags:
  - court
  - executive-power
  - rule-of-law
  - immunity
- id: trump_reelected
  start: 20241105
  level: 1
  kind: election
  title: Trump Re-elected
  description_short: Trump defeats Kamala Harris, 312 to 226 electoral votes, and wins the popular vote by about 2.3 million,
    becoming the first president since Grover Cleveland to win non-consecutive terms.
  description_long: He won every swing state. He is a convicted felon and twice impeached, and wins the popular vote after
    losing it in 2016 and 2020. The federal cases against him are dismissed after the election because of the Justice Department's
    policy against prosecuting a sitting president.
  why: The electorate returns the vehicle to office, after the institutions that might have judged him declined to.
  tags:
  - election
  - trump
  - legitimacy
  - rule-of-law
- id: january_6_pardons
  start: 20250120
  level: 1
  kind: executive-power
  title: The January 6 Pardons
  description_short: On his first day back in office, Trump pardons about 1,500 people convicted or charged in the January
    6 attack and commutes the sentences of 14 others.
  description_long: The proclamation pardons everyone convicted of offenses related to the Capitol attack, directs the dismissal
    of pending cases, and commutes 14 named sentences, including those of Oath Keepers and Proud Boys leaders convicted of
    seditious conspiracy, to time served. The proclamation gives no count, and the Justice Department had charged about 1,583
    people. Officers injured that day were among the victims.
  why: The president forgives the people who attacked the transfer of power, on the day he completes it.
  tags:
  - pardon
  - january-6
  - executive-power
  - preferred-treatment
  - rule-of-law
  date_verified: true
  source: https://www.whitehouse.gov/presidential-actions/2025/01/granting-pardons-and-commutation-of-sentences-for-certain-offenses-relating-to-the-events-at-or-near-the-united-states-capitol-on-january-6-2021/
- id: doge
  start: 20250207
  level: 1
  kind: executive-power
  title: DOGE Takes the Government Apart
  description_short: The Department of Government Efficiency, led by Elon Musk, gains access to Treasury payment systems and
    begins dismantling USAID and other agencies, and the courts begin to set limits.
  description_long: An executive order on January 20 renamed the U.S. Digital Service the U.S. DOGE Service. It was not a
    new agency, and it was given a temporary organization set to end on July 4, 2026. On February 7, a federal judge limited
    its access at Treasury, and another blocked the placing of USAID employees on leave. About 317,000 federal employees left
    in 2025, according to the Office of Personnel Management, most of them voluntarily, and USAID was shut down and merged
    into the State Department on July 1.
  why: The executive dismantles agencies that Congress created and funded, and the budget power is tested without a statute.
  tags:
  - doge
  - executive-power
  - administrative-state
  - impoundment
  - separation-of-powers
  date_verified: true
  source: https://www.whitehouse.gov/presidential-actions/2025/01/establishing-and-implementing-the-presidents-department-of-government-efficiency/
- id: liberation_day_tariffs
  start: 20250402
  level: 1
  kind: economics
  title: '"Liberation Day" Tariffs'
  description_short: Trump declares a national emergency over trade deficits and imposes a 10 percent tariff on nearly all
    imports and higher rates on dozens of countries.
  description_long: The order cited the International Emergency Economic Powers Act, which had never before been used to set
    tariffs. Yale's Budget Lab estimated the average effective tariff rate at 22.5 percent, the highest since 1909. The country-specific
    rates were suspended for ninety days on April 9, except China's, which rose to 125 percent before a May 12 truce in Geneva.
    The Supreme Court held on February 20, 2026 that the statute did not authorize the tariffs.
  why: A power that belongs to Congress is exercised by emergency declaration, and the effect reaches every household.
  tags:
  - tariffs
  - executive-power
  - trade
  - separation-of-powers
  - deindustrialization
  date_verified: true
  source: https://www.whitehouse.gov/presidential-actions/2025/04/regulating-imports-with-a-reciprocal-tariff-to-rectify-trade-practices-that-contribute-to-large-and-persistent-annual-united-states-goods-trade-deficits/
- id: scalia_garland
  start: 20160213
  level: 2
  kind: court
  title: Scalia Dies, Garland Blocked
  description_short: Justice Antonin Scalia dies, and the Senate refuses to consider Obama's nominee, Merrick Garland.
  description_long: McConnell announces within hours that the next president should fill the seat. Obama nominates Garland
    on March 16, and the Senate holds no hearing or vote. The nomination lapses on January 3, 2017. Trump fills the seat with
    Neil Gorsuch on April 7, 2017, and later appoints two more justices.
  why: The Court becomes the prize, and the blockade is the first move in the project that ends in Dobbs.
  tags:
  - court
  - senate
  - scalia
  - garland
- id: travel_ban
  start: 20170127
  level: 2
  kind: immigration
  title: The Travel Ban
  description_short: Trump signs an executive order suspending entry from seven Muslim-majority countries and suspending the
    refugee program.
  description_long: The order is issued without notice to agencies and sends travelers into airports around the country, drawing
    protests and lawsuits. Courts block it, and the administration issues a revised order in March and a third version in
    September. The Supreme Court upholds the third version, 5 to 4, in Trump v. Hawaii on June 26, 2018.
  why: Immigration becomes the executive's first test of what the courts will allow.
  tags:
  - immigration
  - executive-power
  - muslim-ban
  - courts
- id: charlottesville
  start: 20170812
  level: 2
  kind: race
  title: Charlottesville
  description_short: White nationalists march in Charlottesville, Virginia, and one of them drives a car into a crowd, killing
    Heather Heyer.
  description_long: Hundreds marched with torches the night before, chanting "Jews will not replace us." On August 15, Trump
    said there were "very fine people on both sides." The driver, James Alex Fields Jr., was convicted of murder and hate
    crimes.
  why: The racial order's open defenders step into the daylight, and the president declines to separate himself from them.
  tags:
  - race
  - white-nationalism
  - charlottesville
  - trump
- id: tcja
  start: 20171222
  level: 2
  kind: legislation
  title: Tax Cuts and Jobs Act
  description_short: Trump signs the Tax Cuts and Jobs Act, cutting the corporate rate from 35 to 21 percent.
  description_long: The Senate passed it 51 to 48 and the House 224 to 201, with no Democratic votes. Congress's Joint Committee
    on Taxation estimated it would add about $1.5 trillion to deficits over a decade. The individual cuts were written to
    expire after 2025, and the corporate cut was permanent.
  why: 'The first term''s one major law repeats the 1981 bargain: the largest benefits go to capital, and the bill arrives
    as debt.'
  tags:
  - tax
  - legislation
  - preferred-treatment
  - deficit
- id: family_separation
  start: 20180506
  level: 2
  kind: immigration
  title: Family Separation
  description_short: The administration's "zero tolerance" policy prosecutes every illegal border crossing, and thousands
    of children are separated from their parents.
  description_long: Attorney General Sessions announced the policy on April 6, and separations began in earnest in early May.
    More than 2,000 children were taken from parents in about six weeks. Trump signed an order ending the practice on June
    20 after public outrage, and a federal judge ordered the families reunited. The government was later unable to reunite
    hundreds of them quickly.
  why: The immigration system's cost is imposed on children who are the least able to carry it.
  tags:
  - immigration
  - border
  - children
  - zero-tolerance
- id: mueller_report
  start: 20190418
  level: 2
  kind: politics
  title: The Mueller Report
  description_short: The Justice Department releases the special counsel's report on Russian interference and the president's
    conduct.
  description_long: Robert Mueller found that Russia interfered in the 2016 election in a "sweeping and systematic" way, did
    not find sufficient evidence to charge a conspiracy with the campaign, and declined to reach a conclusion on obstruction
    of justice, writing that the report "does not exonerate" the president. Attorney General Barr had released a summary on
    March 24 that said the evidence was not sufficient to establish obstruction.
  why: The first test of whether the president can be held to the law ends without a conclusion.
  tags:
  - rule-of-law
  - russia
  - special-counsel
  - obstruction
- id: first_impeachment
  start: 20191218
  level: 2
  kind: politics
  title: First Impeachment
  description_short: The House impeaches Trump for abuse of power and obstruction of Congress over his pressure on Ukraine,
    and the Senate acquits him.
  description_long: The House votes 230 to 197 on abuse of power and 229 to 198 on obstruction, with no Republican support.
    The charges arise from a July 25 call in which he asked Ukraine's president to investigate Joe Biden while military aid
    was withheld. The Senate acquits on February 5, 2020, 52 to 48 and 53 to 47. Mitt Romney is the only senator to vote against
    his own party's president.
  why: The constitutional remedy for an executive is tried and fails along party lines.
  tags:
  - impeachment
  - ukraine
  - executive-power
  - rule-of-law
- id: doha_agreement
  start: 20200229
  level: 2
  kind: war
  title: The Doha Agreement
  description_short: The United States and the Taliban sign an agreement in Doha setting conditions for the withdrawal of
    American troops from Afghanistan.
  description_long: The Afghan government was not a party. The United States agreed to withdraw all forces within fourteen
    months, and the Taliban promised to prevent attacks from Afghan soil and to negotiate with Kabul. Biden later said the
    agreement left him few choices, and set the deadline first for September 11 and then for August 31, 2021.
  why: The end of the war is negotiated with the enemy and without the ally.
  tags:
  - afghanistan
  - taliban
  - withdrawal
  - diplomacy
- id: cares_act
  start: 20200327
  level: 2
  kind: legislation
  title: CARES Act
  description_short: Trump signs the $2.2 trillion Coronavirus Aid, Relief, and Economic Security Act, the largest rescue
    in American history.
  description_long: The Senate passed it 96 to 0 and the House by voice vote. It provided one-time payments of up to $1,200,
    a $600 weekly unemployment supplement, and $349 billion in forgivable loans for small businesses. Later rounds of relief
    followed in December 2020 and March 2021.
  why: In the one case where the state moves at scale, the money reaches households before it reaches finance.
  tags:
  - pandemic
  - relief
  - legislation
  - covid
- id: barrett_confirmed
  start: 20201026
  level: 2
  kind: court
  title: Barrett Confirmed
  description_short: The Senate confirms Amy Coney Barrett, 52 to 48, eight days before the 2020 election.
  description_long: Justice Ruth Bader Ginsburg had died on September 18. In 2016 the Senate majority had refused to consider
    a nominee eight months before the election. Barrett's confirmation gave the Court a six-to-three conservative majority.
  why: The blockade's logic is reversed when it serves the other side, and the Court's majority is secured.
  tags:
  - court
  - senate
  - barrett
  - ginsburg
- id: election_2020
  start: 20201103
  level: 2
  kind: election
  title: The 2020 Election
  description_short: Joe Biden defeats Trump, 306 to 232 electoral votes, with about 81 million votes to Trump's 74 million.
  description_long: The networks called the race on November 7. Trump and his allies filed more than sixty lawsuits challenging
    the result, and nearly all were dismissed, including a Texas suit the Supreme Court rejected on December 11. The Electoral
    College met on December 14. Trump has continued to claim the election was stolen.
  why: The incumbent refuses to concede, and the legitimacy of the count becomes a partisan fact.
  tags:
  - election
  - biden
  - legitimacy
  - stop-the-steal
- id: last_flight_kabul
  start: 20210830
  level: 2
  kind: war
  title: The Last Flight From Kabul
  description_short: The last American military plane leaves Kabul, ending the war on the day before the withdrawal deadline.
  description_long: Thirteen American service members and about 170 Afghans were killed in the bombing at Abbey Gate on August
    26. Evacuations continued until the last day, and thousands of Americans' Afghan allies were left behind. The war, begun
    on October 7, 2001, ended after nearly twenty years.
  why: The Afghanistan span closes where it opened, in the hands of the Taliban.
  tags:
  - afghanistan
  - withdrawal
  - evacuation
  - empire
- id: ukraine_invasion
  start: 20220224
  level: 2
  kind: war
  title: Russia Invades Ukraine
  description_short: Russia launches a full-scale invasion of Ukraine, the largest land war in Europe since 1945.
  description_long: The United States and its allies responded with sanctions and arms. Congress appropriated about $175 billion
    in aid across several bills through 2024, before the flow stalled in a fight over a supplemental bill that was passed
    in April 2024.
  why: The empire's overextension is tested in Europe within six months of leaving Afghanistan.
  tags:
  - ukraine
  - russia
  - war
  - nato
- id: inflation_peak
  start: 20220613
  level: 2
  kind: economics
  title: Inflation Peaks
  description_short: Consumer prices rise 9.1 percent over twelve months, the largest increase in forty years.
  description_long: The Labor Department reported the June figure on July 13. Inflation had been below 2 percent before the
    pandemic and began to rise in 2021 as demand recovered and supply chains broke. The Federal Reserve raised its rate eleven
    times between March 2022 and July 2023, from near zero to 5.25 to 5.5 percent.
  why: A problem the order believed it had solved returns, and the price is paid by the households with the least slack.
  tags:
  - inflation
  - economy
  - fed
  - cost-of-living
- id: trump_indicted
  start: 20230330
  level: 2
  kind: politics
  title: Trump Indicted
  description_short: A New York grand jury indicts Trump, the first criminal indictment of a former president.
  description_long: 'The Manhattan district attorney charged him with 34 felony counts of falsifying business records over
    hush-money payments in 2016. Three more indictments followed in 2023: federal charges over classified documents (June
    8, 37 counts) and over the 2020 election (August 1, four counts), and a Georgia racketeering case (August 14, 41 counts
    against 19 defendants).'
  why: The legal system takes up the question of whether a former president answers to it, and the question becomes part of
    the campaign.
  tags:
  - indictment
  - rule-of-law
  - trump
  - courts
- id: october_7
  start: 20231007
  level: 2
  kind: war
  title: October 7
  description_short: Hamas attacks southern Israel, killing about 1,200 people and taking about 250 hostages, and the Gaza
    war begins.
  description_long: Israel's response killed tens of thousands of Gazans according to the territory's health ministry. The
    United States supplied Israel with arms and diplomatic cover, and protests over the war spread to American campuses in
    the spring of 2024.
  why: A foreign war enters American politics at the center of a divided coalition and an election year.
  tags:
  - gaza
  - israel
  - hamas
  - war
- id: trump_convicted
  start: 20240530
  level: 2
  kind: politics
  title: Trump Convicted
  description_short: A Manhattan jury convicts Trump on all 34 counts of falsifying business records, the first conviction
    of a former president.
  description_long: The jury deliberated for about eleven hours. Trump was sentenced on January 10, 2025, to an unconditional
    discharge, which carried no jail or fine, ten days before his second inauguration. His other three cases were dismissed
    or stalled.
  why: A felony conviction does not bar a candidate, and the verdict becomes a campaign fact.
  tags:
  - trump
  - conviction
  - rule-of-law
  - election
- id: butler_shooting
  start: 20240713
  level: 2
  kind: politics
  title: Butler, Pennsylvania
  description_short: A gunman fires at Trump at a rally in Butler, Pennsylvania, wounding his ear and killing a spectator,
    Corey Comperatore.
  description_long: The shooter, Thomas Crooks, was killed by a Secret Service sniper. The director of the Secret Service
    resigned. Trump's raised fist and the photograph that followed were the image of the convention that week.
  why: The most dramatic event of the campaign is a near-assassination, and it hardens the vehicle's story.
  tags:
  - trump
  - assassination
  - election
  - secret-service
- id: biden_withdraws
  start: 20240721
  level: 2
  kind: election
  title: Biden Withdraws
  description_short: Biden ends his campaign and endorses Vice President Kamala Harris, less than four months before the election.
  description_long: His June 27 debate performance had prompted weeks of pressure from Democratic leaders and donors. Harris
    became the nominee without a primary.
