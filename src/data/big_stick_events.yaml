schema:
  name: American Epochs Event Corpus
  version: 2
  date_format: YYYYMMDD
  level_definition:
    1: The epoch's "crown of the mountain" — always visible, at every zoom, from the very widest view. One beat
      per structural hinge in the epoch's own arc, not a list of "the important stuff." Target 5-8 entries regardless
      of how large or eventful the epoch was; see curation_guidance below. Automatically revealed first as the viewer
      zooms in from full history — never a manual toggle.
    2: Major events, automatically revealed at the first closer zoom past Level 1.
    3: Supporting events explaining mechanisms, shifts, and consequences.
    4: Contextual events — political, military, social, institutional texture.
    5: Fine-grained events for the closest inspection.
  curation_guidance:
  - Level 1 is the hardest and most important editorial call in the corpus. The viewer never chooses to see it —
    it is what everyone sees whether they zoom in or not, so it carries the whole epoch's argument on its own.
  - Pick one entry per point where the epoch's own arc genuinely turns, not one per famous name or battle. A working
    test - "does removing this entry break the causal chain from the epoch's start to its end?" If not, it belongs
    at Level 2 or below, however well-known it is.
  - Target 5-8 Level 1 point events specifically. This is deliberately independent of the epoch's total event count
    or length in years. Reconstruction intentionally carries nine point events because the Panic of 1873 and United
    States v. Cruikshank describe distinct political and judicial turns and the editor has approved a slightly crowded
    crown.
  - Span (duration) entries at Level 1 do not count against the point-event target because the live instrument never
    tier-filters spans; they provide scene-setting context.
  - Levels 2-5 have much more room to breathe. Disagreement there is a rounding error, not a structural problem.
    Spend the real editorial effort on Level 1.
  notes:
  - A missing end date indicates a point event.
  - Dates represent the most defensible public date for display, not necessarily every stage of a legal or political
    process.
  - date_precision (year or month) applies to start, and end_precision (month) to the end of a range. Where set, the
    placeholder in the date field must not be rendered as exact. Absent means a full day-level date. date_verified
    true means the date was confirmed against an identifiable source.
  - This corpus is a research/authoring artifact. A human or LLM reconciles it into the live EVENTS array.
  - Levels were assigned by Claude as a first-pass editorial judgment (see big_stick_outline.md for the Level 1
    reasoning). All dates are drafted from memory and none are yet source-verified, so verify before treating as
    settled. No source URLs are included, per the guide's rule against unverifiable citations.
  - Level 1 was spacing-checked against emptiness, with no gap between Level 1 points longer than about 3.5 years.
  - Spans follow the "duration is necessary but not sufficient" rule. Only philippine_american_war earns a permanent
    lane. spanish_american_war, mckinley_assassinated, anthracite_coal_strike, and lawrence_textile_strike are
    recorded with true ranges but are under two years, so they reconcile as point events at their end dates.
  - Boundary decisions. The corpus opens with the USS Maine (1898-02-15) and closes at Election Day 1912. About eleven
    months of 1897 after McKinley's inauguration belong to neither corpus. The Sixteenth Amendment is proposed here
    (1909) and ratified in the New Freedom (1913). The Federal Reserve belongs to the next epoch.
epoch:
  id: big_stick
  title: The Big Stick
  start: 18980215
  end: 19121105
  thesis: The Gilded Age's unanswered question gets an answer, which is that the national executive and a new class of
    federal regulators will govern. Roosevelt breaks up a railroad trust, settles a coal strike, inspects meat, polices
    the Caribbean, and builds a canal, and the Republican Party follows him to the edge of what that authority can
    mean. The same period extends the nation's rule over people outside its electorate and writes segregation into
    Southern law and Northern habit. The confidence is real, and so is the exclusion. It ends when the coalition that
    created the activist state destroys itself in 1912 arguing over how activist it should be.
events:
# ---------------------------------------------------------------- Level 1: span
- id: philippine_american_war
  start: 18990204
  end: 19020704
  level: 1
  kind: war
  title: Philippine–American War
  description_short: The United States fights a three-year war to suppress Filipino independence after taking the
    islands from Spain.
  description_long: Fighting begins in Manila on February 4, 1899, after the Treaty of Paris transfers the Philippines.
    Emilio Aguinaldo's republic is defeated by conventional and then guerrilla campaigns marked by harsh reprisals,
    and Roosevelt declares the war over on July 4, 1902. Hundreds of thousands of Filipinos die, mostly from disease
    and famine. Fighting with the Moro peoples continues for years afterward.
  why: It is the empire's cost made concrete, a republic ruling people who never consented and defending that rule
    by force.
  tags:
  - philippines
  - empire
  - war
# ---------------------------------------------------------------- Level 1: points
- id: spanish_american_war
  start: 18980425
  end: 18980812
  level: 1
  kind: war
  title: Spanish–American War
  description_short: A ten-week war with Spain makes the United States an overseas power.
  description_long: Congress declares war on April 25, 1898 (retroactive to April 21), and Dewey destroys the Spanish
    fleet at Manila Bay on May 1. An armistice follows on August 12, and the Treaty of Paris cedes the Philippines,
    Puerto Rico, and Guam, with Cuba under American control.
  why: The country that began by rejecting colonies now governs people who never voted on it, which sets the epoch's
    foundational question.
  tags:
  - war
  - empire
  - spain
- id: mckinley_assassinated
  start: 19010906
  end: 19010914
  level: 1
  kind: political_event
  title: McKinley Assassinated
  description_short: An anarchist shoots President McKinley in Buffalo, and Theodore Roosevelt becomes president.
  description_long: Leon Czolgosz shoots McKinley at the Pan-American Exposition on September 6, 1901, and McKinley
    dies on September 14. At forty-two, Roosevelt is the youngest president in the nation's history.
  why: It brings the activist presidency to power, the instrument through which the epoch's answer to who governs
    will be given.
  tags:
  - assassination
  - roosevelt
  - presidency
- id: northern_securities_suit
  start: 19020219
  level: 1
  kind: legal
  title: Northern Securities Suit
  description_short: Roosevelt's Justice Department sues to break up the Morgan-Hill railroad holding company.
  description_long: Attorney General Philander Knox announces the antitrust suit without warning J.P. Morgan, who
    protests that the president should have settled it privately. The Supreme Court orders the company dissolved in
    1904 by a 5–4 vote.
  why: It is the executive, not Congress or the courts alone, moving against concentrated capital, the direct answer
    to the Gilded Age's unanswered question.
  tags:
  - antitrust
  - roosevelt
  - railroads
- id: roosevelt_corollary
  start: 19041206
  level: 1
  kind: foreign_policy
  title: Roosevelt Corollary
  description_short: Roosevelt claims an American right to police the Western Hemisphere.
  description_long: In his annual message to Congress, Roosevelt declares that "chronic wrongdoing" by Latin American
    states may require the United States to exercise international police power. The corollary follows the Venezuelan
    blockade and justifies interventions in the Dominican Republic, Cuba, Nicaragua, and Haiti.
  why: It is the foreign-policy half of the same governing impulse, and the best-known statement of "big stick"
    diplomacy.
  tags:
  - monroe-doctrine
  - latin-america
  - intervention
- id: pure_food_meat_inspection
  start: 19060630
  level: 1
  kind: legislation
  title: Pure Food and Drug and Meat Inspection Acts
  description_short: Congress creates federal oversight of what Americans eat and the drugs they take.
  description_long: Public outrage after Upton Sinclair's The Jungle and a Roosevelt-commissioned report on
    Chicago's packinghouses pass both laws on June 30, 1906. The Pure Food and Drug Act later becomes the basis of the
    Food and Drug Administration.
  why: It is the high-water mark of the Square Deal, regulation reaching ordinary products and not just railroads.
  tags:
  - regulation
  - food
  - progressivism
- id: panic_of_1907
  start: 19071022
  level: 1
  kind: economic_crisis
  title: Panic of 1907
  description_short: A run on New York trust companies nearly collapses the financial system until J.P. Morgan
    organizes a rescue.
  description_long: The failure of a copper-corner scheme leads to a run on the Knickerbocker Trust Company on October
    22, 1907, and then on others. With no central bank, Morgan locks the city's bankers in his library until they
    agree to a rescue fund, and Treasury deposits help.
  why: It shows the limit of Progressive regulation, since finance still answered to a private banker. The lesson
    leads to the Federal Reserve in the next epoch.
  tags:
  - panic
  - banking
  - morgan
- id: new_nationalism_speech
  start: 19100831
  level: 1
  kind: speech
  title: New Nationalism Speech
  description_short: Roosevelt breaks with Taft's version of the Republican Party in a speech at Osawatomie, Kansas.
  description_long: Roosevelt calls for a strong national government to protect human welfare over property rights,
    including regulation of corporations, a graduated income tax, and labor protections. It is more radical than
    anything he did as president and widens the split with Republican conservatives.
  why: It begins the fracture, with the party's own founder of the activist state turning against its caretaker.
  tags:
  - roosevelt
  - progressivism
  - taft
- id: election_of_1912
  start: 19121105
  level: 1
  kind: election
  title: Election of 1912
  description_short: The Republican vote splits between Taft and Roosevelt, and Wilson wins with 42 percent.
  description_long: Roosevelt's Progressive Party finishes second with 27 percent, ahead of Taft's 23, and Socialist
    Eugene Debs wins about 6 percent. Wilson carries forty states and a majority of the electoral votes.
  why: The coalition that built the activist state destroys itself from pride, not opposition, closing the epoch at
    its own peak.
  tags:
  - election
  - wilson
  - progressive-party
# ---------------------------------------------------------------- Level 2
- id: uss_maine
  start: 18980215
  level: 2
  kind: military
  title: USS Maine Explodes
  description_short: An American battleship explodes in Havana harbor, killing about 260 sailors.
  description_long: The cause is still disputed, but the yellow press blames Spain and the cry "Remember the Maine"
    drives the country toward war.
  why: It is the trigger of the war that opens the epoch.
  tags:
  - maine
  - cuba
  - spain
- id: treaty_of_paris_1898
  start: 18981210
  level: 2
  kind: treaty
  title: Treaty of Paris
  description_short: Spain cedes the Philippines, Puerto Rico, and Guam, and gives up Cuba, for $20 million.
  description_long: The Senate ratifies it on February 6, 1899, by a single vote over the two-thirds needed, after a
    national debate over whether the republic should hold colonies.
  why: It is the legal moment the country acquires subjects with no vote.
  tags:
  - empire
  - treaty
  - philippines
- id: insular_cases
  start: 19010527
  level: 2
  kind: court_case
  title: Downes v. Bidwell and the Insular Cases
  description_short: The Supreme Court holds that the Constitution does not fully apply in the new overseas territories.
  description_long: In a fractured decision, the Court rules that Puerto Rico belongs to but is not part of the
    United States, so Congress may tax it differently. A series of Insular Cases creates the doctrine of
    "unincorporated territories."
  why: It is the constitutional statement of the empire, people governed outside the document that justifies the
    government.
  tags:
  - territories
  - supreme-court
  - constitution
- id: speak_softly
  start: 19010902
  level: 2
  kind: speech
  title: Speak Softly Speech
  description_short: Roosevelt quotes the proverb "speak softly and carry a big stick" at the Minnesota State Fair.
  description_long: He delivers the line days before McKinley is shot. The phrase gives the era its name and becomes
    shorthand for his foreign policy.
  why: It names the epoch and its governing style, power backed by readiness to use it.
  tags:
  - roosevelt
  - diplomacy
  - speech
- id: us_steel_formed
  start: 19010301
  level: 2
  kind: corporate
  title: U.S. Steel Formed
  description_short: J.P. Morgan consolidates Carnegie Steel and others into the first billion-dollar corporation.
  description_long: The merger caps the Great Merger Movement and controls about two-thirds of American steel
    production. Date is month-level (March 1901).
  why: It shows industrial consolidation continuing under the activist state, setting the scale regulators must
    confront.
  tags:
  - steel
  - morgan
  - consolidation
  date_precision: month
- id: anthracite_coal_strike
  start: 19020512
  end: 19021023
  level: 2
  kind: strike
  title: Anthracite Coal Strike
  description_short: Roosevelt mediates a miners' strike as a neutral arbiter, the first such intervention.
  description_long: About 140,000 miners strike for higher pay and shorter hours, and Roosevelt threatens to send the
    army to run the mines. The mine owners, led by George Baer, accept arbitration, and the miners win a raise.
  why: It reverses the Gilded Age's pattern of federal power in strikes, where government acts as arbiter and not as
    strikebreaker.
  tags:
  - labor
  - coal
  - arbitration
- id: hay_bunau_varilla_treaty
  start: 19031118
  level: 2
  kind: treaty
  title: Hay–Bunau-Varilla Treaty
  description_short: The United States secures the Panama Canal Zone, days after Panama's U.S.-backed secession from
    Colombia.
  description_long: American warships keep Colombia from suppressing the revolt, the U.S. recognizes Panama within
    days, and Panama's envoy signs a treaty granting the zone in perpetuity.
  why: It shows the executive's power to reshape the map, and the canal is the epoch's greatest engineering result.
  tags:
  - panama
  - canal
  - empire
- id: hepburn_act
  start: 19060629
  level: 2
  kind: legislation
  title: Hepburn Act
  description_short: Congress gives the Interstate Commerce Commission power to set railroad rates.
  description_long: The act strengthens the ICC's enforcement powers after two decades of weakness and lets it fix
    maximum rates. It is the first real regulatory teeth since the Interstate Commerce Act of 1887.
  why: It is the clearest callback to the Gilded Age, the same railroads and the same law, finally made enforceable.
  tags:
  - railroads
  - regulation
  - icc
- id: brownsville_affair
  start: 19060813
  level: 2
  kind: political_event
  title: Brownsville Affair
  description_short: Roosevelt dishonorably discharges 167 Black soldiers after a shooting in Brownsville, Texas.
  description_long: White residents blame the Black soldiers of the 25th Infantry for a night of shooting on August
    13 and 14, 1906. Roosevelt discharges the entire battalion without trial in November. A later review clears most
    of them.
  why: It shows the limit of the era's activist state, which could govern a hemisphere but not stand with its own Black
    soldiers.
  tags:
  - race
  - army
  - roosevelt
- id: election_1908_taft
  start: 19081103
  level: 2
  kind: election
  title: Taft Elected
  description_short: Roosevelt's chosen successor, William Howard Taft, defeats William Jennings Bryan.
  description_long: Roosevelt sets the program and Taft inherits it, along with a party of rival factions. Taft keeps
    much of the program, including more antitrust suits than Roosevelt brought, but not the temperament.
  why: It makes the party's split possible, since an activist movement now depends on a caretaker.
  tags:
  - election
  - taft
  - succession
- id: naacp_founded
  start: 19090212
  level: 2
  kind: organization
  title: NAACP Founded
  description_short: A biracial group of reformers issues the call that creates the National Association for the
    Advancement of Colored People.
  description_long: The call is issued on Lincoln's centennial after the 1908 Springfield riot, with W.E.B. Du Bois,
    Ida B. Wells, Jane Addams, and others. It becomes the main organization for Black civil rights litigation.
  why: It is the organized response to the exclusion that the era's activist state tolerated.
  tags:
  - civil-rights
  - race
  - du-bois
- id: standard_oil_v_us
  start: 19110515
  level: 2
  kind: court_case
  title: Standard Oil Co. v. United States
  description_short: The Supreme Court orders the Standard Oil monopoly dissolved, but under a "rule of reason."
  description_long: The Court breaks Standard Oil into thirty-four companies and holds that the Sherman Act bans only
    "unreasonable" restraints of trade. The decision is a victory for the trust-busters and a limit on the law.
  why: It completes the arc from Standard Oil Trust (1882) to dissolution, while leaving judges to decide what
    counts as reasonable.
  tags:
  - antitrust
  - supreme-court
  - standard-oil
- id: republican_convention_1912
  start: 19120622
  level: 2
  kind: political_event
  title: Republican Convention of 1912
  description_short: The convention renominates Taft over Roosevelt's supporters' protests, and Roosevelt's delegates walk out.
  description_long: Taft's control of the party machinery wins him the nomination, and Roosevelt calls the result a
    fraud. Roosevelt's followers prepare a new party.
  why: It is the moment the coalition breaks, in a hall, over procedure.
  tags:
  - republicans
  - taft
  - roosevelt
- id: progressive_party_founded
  start: 19120805
  level: 2
  kind: political_event
  title: Progressive Party Founded
  description_short: Roosevelt accepts the nomination of the new Progressive ("Bull Moose") Party in Chicago.
  description_long: The convention adopts a platform calling for women's suffrage, labor protections, and social
    insurance, and Roosevelt declares himself "fit as a bull moose."
  why: It gives the activist-state argument its own party, at the cost of the party that produced it.
  tags:
  - progressive-party
  - roosevelt
  - bull-moose
# ---------------------------------------------------------------- Level 3
- id: war_declared_on_spain
  start: 18980425
  level: 3
  kind: political_event
  title: Congress Declares War on Spain
  description_short: Congress declares war, retroactive to April 21, after the Teller Amendment disclaims annexing Cuba.
  description_long: McKinley asks for authority to intervene in Cuba, and Congress passes the declaration with the
    Teller Amendment, which promises Cuban independence.
  why: It is the formal opening of the war and the promise that the empire then breaks for the Philippines.
  tags:
  - war
  - spain
  - congress
- id: williams_v_mississippi
  start: 18980425
  level: 3
  kind: court_case
  title: Williams v. Mississippi
  description_short: The Supreme Court upholds Mississippi's disfranchising constitution.
  description_long: The Court finds no discrimination in poll taxes and literacy tests that were written to exclude
    Black voters, because the text is race-neutral. It clears the way for other Southern states.
  why: It carries the Gilded Age's disfranchisement into constitutional law as the new epoch begins.
  tags:
  - disfranchisement
  - supreme-court
  - jim-crow
- id: dewey_manila_bay
  start: 18980501
  level: 3
  kind: military
  title: Battle of Manila Bay
  description_short: Commodore Dewey destroys the Spanish Pacific fleet in a few hours.
  description_long: The victory makes Dewey a hero and puts the Philippines in American hands, a surprise acquisition
    nobody had planned for.
  why: It is the move that turns a war about Cuba into one about Asia.
  tags:
  - navy
  - philippines
  - dewey
- id: hawaii_annexed
  start: 18980707
  level: 3
  kind: legislation
  title: Hawaii Annexed
  description_short: Congress annexes Hawaii by joint resolution, using the war as justification.
  description_long: The Newlands Resolution passes by simple majorities, since the Senate lacks the two-thirds needed
    for a treaty. It completes the process begun in the 1893 overthrow.
  why: It is the empire's quiet acquisition, accomplished by a legislative shortcut.
  tags:
  - hawaii
  - annexation
  - empire
- id: wilmington_massacre
  start: 18981110
  level: 3
  kind: violence
  title: Wilmington Coup and Massacre
  description_short: White supremacists overthrow Wilmington, North Carolina's elected biracial government and kill
    Black residents.
  description_long: After a campaign of white supremacy, a mob burns the Black newspaper office and forces the mayor
    and council to resign. The dead number at least dozens, and no one is prosecuted.
  why: It shows what the exclusion looked like in practice while the nation looked abroad.
  tags:
  - race
  - violence
  - north-carolina
- id: open_door_notes
  start: 18990906
  level: 3
  kind: diplomacy
  title: Open Door Notes
  description_short: Secretary of State John Hay asks the powers to keep China open to American trade.
  description_long: The notes assert equal commercial access without committing the U.S. to colonies in China. The
    powers give evasive answers, but Hay announces their acceptance.
  why: It is the empire's commercial form, influence without territory.
  tags:
  - china
  - trade
  - diplomacy
- id: gold_standard_act
  start: 19000314
  level: 3
  kind: legislation
  title: Gold Standard Act
  description_short: Congress formally fixes the dollar to gold, ending the silver fight of the 1890s.
  description_long: The act settles by statute what the 1896 election settled politically. Gold discoveries in
    Alaska and South Africa have already ended the deflation that fed Populism.
  why: It closes the Gilded Age's monetary question and shows how thoroughly 1896 was decided.
  tags:
  - gold-standard
  - money
  - congress
- id: aguinaldo_captured
  start: 19010323
  level: 3
  kind: military
  title: Aguinaldo Captured
  description_short: American forces capture Filipino leader Emilio Aguinaldo by a ruse.
  description_long: Aguinaldo's capture ends the conventional phase of the war and leads to his oath of allegiance, but
    guerrilla fighting continues on Samar and elsewhere.
  why: It is the turning point in the Philippine war.
  tags:
  - philippines
  - war
  - aguinaldo
- id: platt_amendment
  start: 19010302
  level: 3
  kind: legislation
  title: Platt Amendment
  description_short: Congress makes Cuba's constitution give the U.S. the right to intervene and to lease naval bases.
  description_long: Cuba must write the amendment into its constitution as a condition of American withdrawal. The U.S.
    keeps Guantánamo Bay and the right to intervene for decades.
  why: It is a model of the epoch's imperial form, nominal independence with American control.
  tags:
  - cuba
  - empire
  - sovereignty
- id: newlands_reclamation_act
  start: 19020617
  level: 3
  kind: legislation
  title: Newlands Reclamation Act
  description_short: Congress uses federal land-sale revenue to build irrigation projects in the West.
  description_long: The Reclamation Service builds dams and canals across arid western states, a large federal
    investment in the region's development.
  why: It shows the activist state building as well as regulating.
  tags:
  - conservation
  - west
  - water
- id: department_of_commerce_labor
  start: 19030214
  level: 3
  kind: institution
  title: Department of Commerce and Labor Created
  description_short: Congress creates a cabinet department with a Bureau of Corporations to investigate big business.
  description_long: The bureau gathers data on corporations and becomes the investigative arm of Roosevelt's
    trust policy, a forerunner of the Federal Trade Commission.
  why: It builds a standing federal capacity to watch industry, the bureaucratic side of the activist state.
  tags:
  - bureaucracy
  - corporations
  - regulation
- id: panamanian_independence
  start: 19031103
  level: 3
  kind: foreign_policy
  title: Panama Declares Independence
  description_short: Panama secedes from Colombia with American naval support.
  description_long: The revolt succeeds without fighting, after U.S. warships block Colombian troops, and the U.S.
    recognizes the new republic within days.
  why: It is the Corollary-style executive action behind the canal.
  tags:
  - panama
  - colombia
  - intervention
- id: northern_securities_decision
  start: 19040314
  level: 3
  kind: court_case
  title: Northern Securities Co. v. United States
  description_short: The Supreme Court orders the Northern Securities holding company dissolved, 5–4.
  description_long: The decision establishes that the Sherman Act applies to holding-company mergers, a rare enforcement
    victory after the E.C. Knight setback.
  why: It confirms the executive's trust-busting authority and answers E.C. Knight.
  tags:
  - antitrust
  - supreme-court
  - railroads
- id: election_1904_landslide
  start: 19041108
  level: 3
  kind: election
  title: Roosevelt Wins in a Landslide
  description_short: Roosevelt wins a full term with 56 percent of the vote, the largest popular margin to that date.
  description_long: He promises a "square deal" to every man and pledges not to seek another term in 1908. The pledge
    later complicates his 1912 return.
  why: It gives the activist presidency its own electoral mandate.
  tags:
  - election
  - roosevelt
  - square-deal
- id: treaty_of_portsmouth
  start: 19050905
  level: 3
  kind: diplomacy
  title: Treaty of Portsmouth
  description_short: Roosevelt mediates an end to the Russo-Japanese War and wins the Nobel Peace Prize.
  description_long: The treaty is signed in New Hampshire and gives Roosevelt the global standing the Big Stick
    implies, though it also feeds Japanese resentment.
  why: It shows the executive acting as a world power broker.
  tags:
  - japan
  - russia
  - nobel
- id: lochner_v_new_york
  start: 19050417
  level: 3
  kind: court_case
  title: Lochner v. New York
  description_short: The Supreme Court strikes down a New York law limiting bakers' working hours.
  description_long: The Court finds that the law interferes with liberty of contract under the Fourteenth Amendment. The
    case gives its name to an era of judicial skepticism of economic regulation.
  why: It shows the courts still claiming the final word, setting the limits for the activist state.
  tags:
  - labor
  - supreme-court
  - due-process
- id: the_jungle
  start: 19060201
  level: 3
  kind: intellectual
  title: The Jungle Published
  description_short: Upton Sinclair's novel about Chicago's packinghouses shocks the public.
  description_long: Sinclair intends to expose the workers' conditions, but readers fixate on the food contamination.
    The book spurs the meat inspection law. Date is month-level (February 1906).
  why: It is the best-known example of the muckraking that powers the era's reforms.
  tags:
  - muckraking
  - food
  - sinclair
  date_precision: month
- id: great_white_fleet
  start: 19071216
  level: 3
  kind: military
  title: Great White Fleet Departs
  description_short: Sixteen battleships begin a fourteen-month voyage around the world.
  description_long: Roosevelt sends the fleet to show American naval power, and it returns in February 1909. The
    voyage is the era's most visible demonstration of the Big Stick.
  why: It is the epoch's confidence on display, power projected without a shot.
  tags:
  - navy
  - diplomacy
  - roosevelt
- id: sixteenth_amendment_proposed
  start: 19090712
  level: 3
  kind: constitutional_amendment
  title: Sixteenth Amendment Proposed
  description_short: Congress sends the states an amendment authorizing a federal income tax.
  description_long: The amendment answers Pollock (1895) directly. Ratification comes in February 1913, in the next
    epoch.
  why: It is the constitutional route to the fiscal power the activist state needs.
  tags:
  - income-tax
  - constitution
  - taxation
- id: payne_aldrich_tariff
  start: 19090805
  level: 3
  kind: legislation
  title: Payne–Aldrich Tariff
  description_short: Taft signs a tariff that raises rates on many goods despite promises to lower them.
  description_long: Progressive Republicans in the Midwest oppose the bill, and Taft calls it the best tariff the party
    ever passed. The statement alienates the insurgents.
  why: It is the first public break between Taft and the party's reformers.
